<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5e43" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a3023" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Estoque, compras, vendas e parcelas de cestas básicas. Funciona sem internet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FeiraUP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FeiraUP</title>
<style>
/* Controle de Cestas — tema "pinheiro e milho": verde-escuro profundo, amarelo de milho como único destaque */
:root {
  --bg: #eef3ee; --surface: #ffffff; --surface2: #f3f7f3; --text: #10231b; --muted: #556a5f;
  --line: #d9e3db; --line-strong: #bccabf;
  --brand: #0b5e43; --brand-2: #12805a; --brand-ink: #ffffff; --brand-soft: #dcefe4;
  --corn: #f4b73d; --corn-ink: #2b1d00;
  --ok: #0f7a4f; --ok-bg: #dcf1e5; --warn: #7a4e00; --warn-bg: #fdf0cc; --bad: #b3261e; --bad-bg: #fde4e1;
  --info: #1f5a78; --info-bg: #e0eff7;
  --shadow: 0 1px 2px rgba(16, 35, 27, .06), 0 6px 18px -8px rgba(16, 35, 27, .14);
  --radius: 18px; --radius-sm: 12px; --nav-h: 68px; --side-w: 244px;
  --hero-a: #0f7650; --hero-b: #073d2c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1611; --surface: #14231b; --surface2: #1a2d22; --text: #e8f1ea; --muted: #9bb2a2;
    --line: #27402f; --line-strong: #38573f;
    --brand: #4fc88a; --brand-2: #4fc88a; --brand-ink: #062213; --brand-soft: #1b3a29;
    --corn: #f4b73d; --corn-ink: #2b1d00;
    --ok: #74dba1; --ok-bg: #1b3b29; --warn: #f2c870; --warn-bg: #3a2e10; --bad: #ff9d92; --bad-bg: #44201a;
    --info: #8fcbe9; --info-bg: #17303c; --shadow: none;
    --hero-a: #145f45; --hero-b: #0a3023;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);
  overflow-wrap: anywhere;
}
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.012em; }
h1 { font-size: 1.2rem; font-weight: 750; }
h2 { font-size: 1.1rem; font-weight: 720; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 .5rem; }
small, .muted { color: var(--muted); }
small { font-size: .86rem; }
b { font-weight: 680; }

/* ---------- estrutura ---------- */
.shell { display: block; }
.main { min-width: 0; }
.top {
  position: sticky; top: 0; z-index: 20; color: #fff; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 10px; }
.brand h1 { color: #fff; font-size: 1.05rem; }
.brand span { display: block; font-size: .78rem; opacity: .82; line-height: 1.2; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 16px 14px 0; }
#saveWarn { display: none; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; font-size: .92rem; }
#saveWarn.show { display: block; }

/* chip de nuvem */
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.12); color: #fff; font: inherit; font-size: .84rem; font-weight: 650; cursor: pointer; white-space: nowrap;
}
.chip:hover { background: rgba(255,255,255,.2); }
.chip.static { background: var(--surface2); color: var(--text); border-color: var(--line); cursor: default; }
.chip[hidden] { display: none; }
.chip.install { background: var(--corn); color: var(--corn-ink); border-color: transparent; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #9fb0a5; flex: 0 0 auto; }
.dot.ok { background: #5be29a; } .dot.pending { background: var(--corn); } .dot.offline { background: #c4cfc8; box-shadow: inset 0 0 0 2px #6f8377; }
.dot.syncing { background: #7cc4ee; animation: pulse 1.1s ease-in-out infinite; }
.dot.conflict, .dot.error, .dot.expired { background: #ff8d80; }
.chip.static .dot.offline { background: #8fa196; box-shadow: none; }
@keyframes pulse { 50% { opacity: .35; } }
.syncline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- avisos ---------- */
.banner { border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid; font-size: .95rem; }
.banner > div { flex: 1 1 220px; min-width: 0; }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.banner button { flex: 0 0 auto; }

/* ---------- cartões ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span2 { grid-column: 1 / -1; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; margin-bottom: 14px; }
.grid > .card { margin-bottom: 0; }
.card > h2 { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub { margin-bottom: 10px; }

/* cartão de destaque: quantas cestas dá para montar agora */
.card.hero {
  background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); border-color: transparent; color: #fff; position: relative; overflow: hidden; padding: 22px 20px;
}
.card.hero::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 190px; height: 190px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(244,183,61,.35), rgba(244,183,61,0) 70%); pointer-events: none;
}
.card.hero h2, .card.hero p, .card.hero b { color: #fff; }
.card.hero small, .card.hero .muted { color: rgba(255,255,255,.8); }
.card.hero .big { color: var(--corn); font-size: clamp(3.4rem, 14vw, 5rem); }
.card.hero .badge.ok, .card.hero .badge.warn, .card.hero .badge.bad, .card.hero .badge.info { background: rgba(255,255,255,.18); color: #fff; }
.card.hero .btn { background: var(--corn); color: var(--corn-ink); border-color: var(--corn); }

.big { font-size: 2.3rem; font-weight: 780; line-height: 1.05; letter-spacing: -.03em; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; min-width: 0; border: 1px solid var(--line); }
.kpi b { display: block; font-size: 1.12rem; font-weight: 740; letter-spacing: -.01em; }
.kpi span { font-size: .82rem; color: var(--muted); }
.kpi.bad b { color: var(--bad); } .kpi.ok b { color: var(--ok); }
.bar { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 12px 0 6px; }
.bar i { display: block; height: 100%; }
.bar .c { background: var(--corn); } .bar .p { background: var(--brand-2); }
.legend { display: flex; gap: 16px; font-size: .86rem; color: var(--muted); flex-wrap: wrap; }
.legend em { font-style: normal; }
.legend em::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.legend .c::before { background: var(--corn); } .legend .p::before { background: var(--brand-2); }

.badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .8rem; font-weight: 650; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }

/* ---------- formulários ---------- */
label { display: block; font-size: .9rem; font-weight: 650; margin: 0 0 5px; }
.field { margin-bottom: 12px; min-width: 0; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row.one { grid-template-columns: minmax(0, 1fr); }
.row.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 560px) { .row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 10px 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--line-strong);
  background: var(--surface); color: var(--text); font: inherit; font-size: 16px; transition: border-color .15s, box-shadow .15s;
}
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 24%, transparent); }
textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }
input[type=checkbox] { width: 22px; min-height: 22px; }
.btn {
  min-height: 48px; padding: 10px 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--brand); background: var(--brand); color: var(--brand-ink);
  font: inherit; font-weight: 680; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: filter .15s, transform .08s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.small { min-height: 44px; padding: 7px 14px; font-size: .92rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- listas ---------- */
.list { display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--surface); min-width: 0; }
.item .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.item .head b { min-width: 0; }
.parcel { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; border-top: 1px dashed var(--line-strong); }
.parcel:first-of-type { margin-top: 8px; }
.parcel .info { flex: 1 1 140px; min-width: 0; }
.parcel .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.stats div { background: var(--surface2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stats b { display: block; font-size: .9rem; white-space: nowrap; overflow-wrap: normal; } .stats span { font-size: .78rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); }
.cat { margin: 18px 0 8px; font-size: .88rem; letter-spacing: .01em; color: var(--brand); font-weight: 740; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line > span:first-child { min-width: 0; }
.line > span:last-child { text-align: right; flex: 0 0 auto; max-width: 55%; }
.check-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.check-row:last-child { border-bottom: 0; }
.check-row.bad { color: var(--bad); }
.msg { border-radius: var(--radius-sm); padding: 10px 14px; margin: 10px 0; font-size: .95rem; border: 1px solid; }
.msg.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.msg.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.msg.info { background: var(--info-bg); color: var(--info); border-color: var(--info); }
.msg.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.items-edit { display: grid; gap: 8px; }
.items-edit .ie { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 10px; align-items: center; }
.items-edit .ie span { min-width: 0; font-size: .95rem; }
.items-edit .ie small { display: block; }
.prow { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; background: var(--surface2); }
.prow .row { margin-top: 10px; }
.total { font-size: 1.2rem; font-weight: 760; text-align: right; margin: 8px 0; }
details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 650; }
.flow { display: grid; gap: 10px; }
.flow .m { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px; background: var(--surface2); }
.flow .m b { display: block; margin-bottom: 4px; }
.flow .m div { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .92rem; }

/* ---------- navegação: barra inferior no celular, lateral no computador ---------- */
.side { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -6px 20px -12px rgba(16,35,27,.25); }
.side-brand { display: none; }
nav.tabs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
nav.tabs button {
  position: relative; min-height: var(--nav-h); border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .66rem; font-weight: 650;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 6px 1px;
}
nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current=page] { color: var(--brand); }
nav.tabs button[aria-current=page] svg { stroke-width: 2.3; }
nav.tabs button[aria-current=page]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 4px 4px; background: var(--brand-2); }

@media (min-width: 900px) {
  body { padding-bottom: 32px; }
  .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); align-items: start; }
  .side { position: sticky; top: 0; height: 100vh; border-top: 0; border-right: 1px solid var(--line); box-shadow: none; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
  .side-brand svg { width: 40px; height: 40px; border-radius: 11px; }
  .side-brand b { display: block; font-size: 1.05rem; line-height: 1.15; }
  .side-brand small { font-size: .8rem; }
  nav.tabs { display: flex; flex-direction: column; gap: 4px; }
  nav.tabs button { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 48px; padding: 8px 14px; border-radius: var(--radius-sm); font-size: .98rem; text-align: left; }
  nav.tabs button:hover { background: var(--surface2); }
  nav.tabs button[aria-current=page] { background: var(--brand-soft); }
  nav.tabs button[aria-current=page]::before { content: none; }
  .top { background: transparent; color: var(--text); padding: 18px 28px 0; position: static; }
  .brand { display: none; }
  .top::before { content: ""; flex: 1; }
  .chip { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
  .chip:hover { background: var(--surface2); }
  .chip .dot.ok { background: var(--ok); } .chip .dot.offline { background: #8fa196; box-shadow: none; } .chip .dot.syncing { background: var(--info); }
  .chip .dot.conflict, .chip .dot.error, .chip .dot.expired { background: var(--bad); } .chip .dot.pending { background: #d99a12; }
  .wrap { padding: 14px 28px 0; }
}

#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #10231b; color: #fff; padding: 12px 18px; border-radius: 99px; font-size: .95rem; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 92vw; text-align: center; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); }
#toast.show { opacity: 1; transform: translateX(-50%); }
@media (min-width: 900px) { #toast { bottom: 28px; } }
@media (prefers-reduced-motion: reduce) { #toast, .btn, input, select { transition: none; } .dot.syncing { animation: none; } html { scroll-behavior: auto; } }
@media print { .side, .top, #toast { display: none !important; } body { padding: 0; } .card { box-shadow: none; } }

/* ---------- tela de entrada ---------- */
body.locked { padding-bottom: 0; }
body.locked .shell { display: none; }
#gate { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); }
#gate[hidden] { display: none; }
.gate-card { width: 100%; max-width: 400px; background: var(--surface); border-radius: 24px; padding: 28px 22px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); text-align: center; }
.gate-card img { border-radius: 20px; margin-bottom: 10px; }
.gate-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
.gate-card form { text-align: left; }
.btn.wide { width: 100%; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 16px 0 14px; background: var(--surface2); border-radius: var(--radius-sm); border: 1px solid var(--line); }
.seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 650; cursor: pointer; }
.seg button[aria-selected=true], .seg button[aria-checked=true] { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
.gate-card .msg { text-align: left; }

/* ---------- cotação ---------- */
.btn.pick { justify-content: space-between; width: 100%; text-align: left; flex-wrap: wrap; min-height: 52px; }
.btn.pick small { color: inherit; opacity: .8; font-weight: 600; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

.btn.big { min-height: 56px; font-size: 1.05rem; margin-top: 12px; }
.bigin input { font-size: 1.35rem; font-weight: 700; min-height: 54px; }
.row.bigin label { font-size: .85rem; }
.item .head + small { display: block; margin-top: 2px; }
/* no celular, esconde a barra de abas enquanto o teclado está aberto (sobra mais tela para digitar) */
@media (max-width: 399px) { nav.tabs button { font-size: .6rem; letter-spacing: -.01em; } }
nav.tabs button { white-space: nowrap; }
@media (max-width: 899px) { body.kb .side { display: none; } body.kb { padding-bottom: 16px; } }
.total.sub2 { font-size: 1rem; font-weight: 500; margin-top: 0; color: var(--muted); }
.total.sub2 b { color: var(--text); font-size: 1.15rem; }
#quoteForm .seg { margin-top: 0; }

.chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -2px 0 6px; }
.chip-btn { min-height: 44px; min-width: 56px; padding: 6px 14px; border-radius: 99px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
.chip-btn.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.chips small { flex: 1 1 100%; }

/* ---------- painel ---------- */
.brand, .side-brand { background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; padding: 0; }
.side-brand { width: 100%; border-radius: var(--radius-sm); }
.side-brand:hover { background: var(--surface2); }
.seg.four { grid-template-columns: repeat(4, 1fr); margin: 4px 0 10px; }
.seg.four button { font-size: .86rem; padding: 0 4px; }
.dks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .dks { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpi.dk { display: flex; flex-direction: column; gap: 2px; padding: 12px; }
.kpi.dk span { order: 0; }
.kpi.dk b { order: 1; font-size: 1.3rem; }
.dk-foot { order: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 20px; }

<script>
/* FeiraUP - núcleo de cálculo (funções puras, sem DOM) */
(function (root) {
  'use strict';

  var TZ = 'America/Sao_Paulo';
  var EPS = 1e-9;

  /* ---------- utilidades ---------- */
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function round2(n) { n = num(n); return Math.round(n * 100 + (n >= 0 ? 1e-9 : -1e-9)) / 100; }
  function r6(n) { return Math.round(num(n) * 1e6) / 1e6; }
  function r3(n) { return Math.round(num(n) * 1e3) / 1e3; }
  function floorCov(x) { return Math.floor(x + EPS); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function today() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  }
  function parseISO(iso) { var p = String(iso).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function addDays(iso, n) {
    var p = String(iso).split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
  function validISO(iso) { return /^\d{4}-\d{2}-\d{2}$/.test(String(iso || '')); }

  var moneyFmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var numFmt = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 });
  function money(n) { return moneyFmt.format(round2(n)); }
  function fnum(n) { return numFmt.format(r3(n)); }
  function fdate(iso) { if (!validISO(iso)) return '';var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function monthKey(iso) { return String(iso).slice(0, 7); }
  function fmonth(key) {
    var p = key.split('-');
    var nomes = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    return nomes[Number(p[1]) - 1] + '/' + p[0];
  }

  /* aceita "1.234,56", "12,5" e "12.5" */
  function parseNum(str) {
    if (typeof str === 'number') return isFinite(str) ? str : NaN;
    var s = String(str == null ? '' : str).trim().replace(/\s/g, '').replace(/^R\$/, '');
    if (s === '') return NaN;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  /* ---------- padrões ---------- */
  var DEFAULT_SETTINGS = { price: 340, term: '30-60', target: 10, minCover: 4, costMode: 'last', riceKg: 12 };
  var TERMS = ['30-60', 'avista', '30', 'fiado'];
  var CATS = ['Alimentos', 'Limpeza e higiene', 'Embalagens'];
  var EXPENSE_CATS = ['Combustível', 'Embalagens e sacolas', 'Caixotes e caixas', 'Frete e transporte', 'Alimentação', 'Manutenção', 'Taxas e tarifas', 'Itens extras', 'Outros'];

  function defaultProducts() {
    var A = CATS[0], L = CATS[1];
    function p(id, name, cat, unit, perBasket, packSize, packLabel, group) {
      var o = { id: id, name: name, cat: cat, unit: unit, perBasket: perBasket, packSize: packSize || 1, packLabel: packLabel || '' };
      if (group) o.group = group;
      return o;
    }
    return [
      p('p_arroz_pb', 'Arroz parboilizado (PB)', A, 'kg', 6, 30, 'fardo de 30', 'arroz'),
      p('p_arroz_br', 'Arroz branco', A, 'kg', 6, 30, 'fardo de 30', 'arroz'),
      p('p_acucar', 'Açúcar', A, 'kg', 3),
      p('p_flocao', 'Flocão de milho 500 g', A, 'un', 3),
      p('p_feijao', 'Feijão', A, 'kg', 1),
      p('p_tapioca', 'Goma de tapioca', A, 'kg', 1),
      p('p_cracker', 'Biscoito cream cracker', A, 'un', 1),
      p('p_maria', 'Biscoito Maria', A, 'un', 1),
      p('p_leite', 'Leite em pó Purelac 200 g', A, 'un', 2),
      p('p_cafe', 'Café moído 250 g', A, 'un', 2),
      p('p_macarrao', 'Macarrão espaguete 400 g', A, 'un', 2),
      p('p_sal', 'Sal refinado 1 kg', A, 'un', 1, 30, 'fardo de 30'),
      p('p_pimenta', 'Condimento pimenta', A, 'un', 1, 10, 'fardo de 10'),
      p('p_corante', 'Corante (colorau)', A, 'un', 1, 10, 'fardo de 10'),
      p('p_oleo', 'Óleo de soja 900 ml', A, 'un', 2),
      p('p_goiaba', 'Doce de goiaba 250 g', A, 'un', 1),
      p('p_margarina', 'Margarina 500 g', A, 'un', 1, 12, 'caixa de 12'),
      p('p_esponja', 'Esponja de lavar louça', L, 'un', 2, 80, 'caixa de 80'),
      p('p_sabao_po', 'Sabão em pó sachê 400 g', L, 'un', 1, 30, 'fardo de 30'),
      p('p_sabao_barra', 'Sabão em barra 450 g', L, 'un', 0.5),
      p('p_sabonete', 'Sabonete Ypê 85 g', L, 'un', 2, 12, 'dúzia de 12'),
      p('p_pasta', 'Pasta de dente 90 g', L, 'un', 1),
      p('p_detergente', 'Detergente Ypê 500 ml', L, 'un', 1),
      p('p_papel', 'Papel higiênico (pacote com 4)', L, 'un', 1),
      p('p_agua_san', 'Água sanitária', L, 'un', 1)
    ];
  }

  function newState() {
    return {
      settings: Object.assign({}, DEFAULT_SETTINGS),
      customers: [], suppliers: [], products: defaultProducts(),
      purchases: [], sales: [], adjustments: [], quotes: [], payables: [], withdrawals: [], contributions: [], expenses: []
    };
  }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  /* ---------- migração de dados antigos ---------- */
  function normSettings(s) {
    var o = Object.assign({}, DEFAULT_SETTINGS, s || {});
    ['price', 'target', 'minCover', 'riceKg'].forEach(function (k) {
      var n = Number(o[k]);
      o[k] = isFinite(n) && n >= 0 ? n : DEFAULT_SETTINGS[k];
    });
    if (TERMS.indexOf(o.term) < 0) o.term = DEFAULT_SETTINGS.term;
    if (o.costMode !== 'avg' && o.costMode !== 'last') o.costMode = 'last';
    return o;
  }

  function normProduct(p) {
    var o = Object.assign({}, p);
    o.id = o.id || uid();
    o.name = String(o.name || 'Produto');
    o.cat = CATS.indexOf(o.cat) >= 0 ? o.cat : CATS[0];
    o.unit = o.unit === 'kg' ? 'kg' : 'un';
    o.perBasket = Math.max(0, num(o.perBasket));
    o.packSize = Math.max(1, num(o.packSize) || 1);
    o.packLabel = String(o.packLabel || '');
    if (!o.group && /arroz/i.test(o.name)) o.group = 'arroz';
    if (!o.group) delete o.group;
    return o;
  }

  function migrate(raw) {
    var st = raw && typeof raw === 'object' ? (raw.state && typeof raw.state === 'object' ? raw.state : raw) : {};
    var out = newState();
    out.settings = normSettings(st.settings);
    out.products = Array.isArray(st.products) && st.products.length ? st.products.map(normProduct) : defaultProducts();
    // o arroz parboilizado também é comprado em fardo de 30 kg (igual ao arroz branco)
    out.products.forEach(function (p) { if (p.id === 'p_arroz_pb' && !(p.packSize > 1) && !p.packLabel) { p.packSize = 30; p.packLabel = 'fardo de 30'; } });

    out.suppliers = (Array.isArray(st.suppliers) ? st.suppliers : []).map(function (s) {
      return { id: s.id || uid(), name: String(s.name || 'Fornecedor'), address: String(s.address || ''), phone: String(s.phone || ''), doc: String(s.doc || '') };
    });

    out.customers = (Array.isArray(st.customers) ? st.customers : []).map(function (c) {
      var mods = {};
      if (c.mods && typeof c.mods === 'object') Object.keys(c.mods).forEach(function (k) { mods[k] = Math.max(0, num(c.mods[k])); });
      return { id: c.id || uid(), name: String(c.name || 'Cliente'), phone: String(c.phone || ''), address: String(c.address || ''), note: String(c.note || ''), mods: mods };
    });

    out.purchases = (Array.isArray(st.purchases) ? st.purchases : []).map(function (pu) {
      var o = {
        id: pu.id || uid(), date: validISO(pu.date) ? pu.date : today(), supplierId: pu.supplierId || '', note: String(pu.note || ''),
        items: (Array.isArray(pu.items) ? pu.items : []).map(function (it) { return { pid: it.pid, qty: num(it.qty), total: round2(it.total) }; })
      };
      if (pu.paidFrom === 'pessoal') o.paidFrom = 'pessoal';
      if (pu.payableId) o.payableId = String(pu.payableId);
      return o;
    });
    out.purchases.forEach(function (pu) { if (pu.payableId && !(Array.isArray(st.payables) && st.payables.some(function (b) { return b.id === pu.payableId; }))) delete pu.payableId; });

    // contas a pagar (fornecedores a prazo e outras despesas) e retiradas para a conta pessoal
    out.payables = (Array.isArray(st.payables) ? st.payables : []).filter(function (b) { return b && num(b.amount) > 0; }).map(function (b) {
      var o = { id: b.id || uid(), desc: String(b.desc || 'Conta a pagar').slice(0, 120), supplierId: b.supplierId || '', amount: round2(b.amount), due: validISO(b.due) ? b.due : today(), note: String(b.note || '') };
      if (b.purchaseId) o.purchaseId = String(b.purchaseId);
      o.pays = (Array.isArray(b.pays) ? b.pays : []).filter(function (x) { return x && validISO(x.date) && num(x.amount) > 0; }).map(function (x) {
        var y = { date: x.date, amount: round2(x.amount), from: x.from === 'pessoal' ? 'pessoal' : 'caixa' }; if (METHODS[x.method]) y.method = x.method; return y;
      });
      return o;
    });
    // despesas do negócio (combustível, itens extras...)
    out.expenses = (Array.isArray(st.expenses) ? st.expenses : []).filter(function (x) { return x && num(x.amount) > 0; }).map(function (x) {
      var o = { id: x.id || uid(), date: validISO(x.date) ? x.date : today(), amount: round2(x.amount), cat: EXPENSE_CATS.indexOf(x.cat) >= 0 ? x.cat : 'Outros', desc: String(x.desc || '').slice(0, 120), from: x.from === 'pessoal' ? 'pessoal' : 'caixa' };
      if (METHODS[x.method]) o.method = x.method; return o;
    });
    // dinheiro que o dono colocou no negócio
    out.contributions = (Array.isArray(st.contributions) ? st.contributions : []).filter(function (w) { return w && num(w.amount) > 0; }).map(function (w) {
      var o = { id: w.id || uid(), date: validISO(w.date) ? w.date : today(), amount: round2(w.amount), note: String(w.note || '').slice(0, 120) };
      if (METHODS[w.method]) o.method = w.method; return o;
    });
    out.withdrawals = (Array.isArray(st.withdrawals) ? st.withdrawals : []).filter(function (w) { return w && num(w.amount) > 0; }).map(function (w) {
      var o = { id: w.id || uid(), date: validISO(w.date) ? w.date : today(), amount: round2(w.amount), note: String(w.note || '').slice(0, 120) };
      if (METHODS[w.method]) o.method = w.method; return o;
    });

    out.adjustments = (Array.isArray(st.adjustments) ? st.adjustments : []).map(function (a) {
      return { id: a.id || uid(), pid: a.pid, delta: r6(a.delta), date: validISO(a.date) ? a.date : today(), note: String(a.note || '') };
    });

    // cotações feitas andando de comércio em comércio (não mexem no estoque)
    out.quotes = (Array.isArray(st.quotes) ? st.quotes : []).filter(function (q) {
      return q && typeof q.pid === 'string' && String(q.place || '').trim() && num(q.price) > 0 && num(q.qty) > 0;
    }).map(function (q) {
      return { id: q.id || uid(), pid: q.pid, place: String(q.place).trim().slice(0, 60), price: round2(q.price), qty: r3(q.qty), date: validISO(q.date) ? q.date : today() };
    });

    var defItems = {};
    out.products.forEach(function (p) { if (p.perBasket > 0) defItems[p.id] = p.perBasket; });

    out.sales = (Array.isArray(st.sales) ? st.sales : []).map(function (s) {
      var sale = Object.assign({}, s);
      sale.id = sale.id || uid();
      sale.date = validISO(sale.date) ? sale.date : today();
      sale.qty = num(sale.qty) > 0 ? num(sale.qty) : 1;
      sale.price = sale.price != null && isFinite(Number(sale.price)) ? num(sale.price) : out.settings.price;
      if (!sale.items || typeof sale.items !== 'object' || Array.isArray(sale.items) || !Object.keys(sale.items).length) sale.items = Object.assign({}, defItems);
      else { var it = {}; Object.keys(sale.items).forEach(function (k) { it[k] = Math.max(0, num(sale.items[k])); }); sale.items = it; }
      sale.mods = Array.isArray(sale.mods) ? sale.mods : [];
      sale.parcels = (Array.isArray(sale.parcels) ? sale.parcels : []).map(function (p) {
        var q = { id: p.id || uid(), due: validISO(p.due) ? p.due : sale.date, amount: round2(p.amount), paid: !!p.paid, received: round2(p.received) };
        if (p.kind === 'entrada' || p.kind === 'avista') q.kind = p.kind;
        if (Array.isArray(p.pays)) q.pays = p.pays.filter(function (x) { return x && validISO(x.date) && num(x.amount) > 0; }).map(function (x) { var y = { date: x.date, amount: round2(x.amount) }; if (METHODS[x.method]) y.method = x.method; return y; });
        return q;
      });
      if (!sale.customerId || !byId(out.customers, sale.customerId)) {
        var nm = String(sale.customerName || sale.customer || sale.cliente || sale.name || '').trim();
        var found = null;
        if (nm) {
          out.customers.forEach(function (c) { if (c.name.toLowerCase() === nm.toLowerCase()) found = c; });
          if (!found) { found = { id: uid(), name: nm, phone: '', address: '', note: '', mods: {} }; out.customers.push(found); }
        }
        sale.customerId = found ? found.id : '';
      }
      if (!isFinite(Number(sale.costSnap)) || sale.costSnap === '' || sale.costSnap == null) sale.costSnap = 0;
      sale._needCost = !(s.costSnap != null && isFinite(Number(s.costSnap)));
      return sale;
    });

    out.sales.forEach(function (s) {

  /* ---------- estoque e cobertura ---------- */
  function derive(state) {
    var products = state.products || [];
    var bought = {}, sold = {}, adj = {}, stock = {};
    (state.purchases || []).forEach(function (pu) {
      (pu.items || []).forEach(function (it) { bought[it.pid] = (bought[it.pid] || 0) + num(it.qty); });
    });
    (state.sales || []).forEach(function (s) {
      var q = num(s.qty), items = s.items || {};
      Object.keys(items).forEach(function (pid) { sold[pid] = (sold[pid] || 0) + q * num(items[pid]); });
    });
    (state.adjustments || []).forEach(function (a) { adj[a.pid] = (adj[a.pid] || 0) + num(a.delta); });
    products.forEach(function (p) {
      bought[p.id] = r6(bought[p.id] || 0); sold[p.id] = r6(sold[p.id] || 0); adj[p.id] = r6(adj[p.id] || 0);
      stock[p.id] = r6(bought[p.id] - sold[p.id] + adj[p.id]);
    });

    var rice = products.filter(function (p) { return p.group === 'arroz'; });
    var groups = [];
    products.forEach(function (p) {
      if (p.group === 'arroz' || !(num(p.perBasket) > 0)) return;
      groups.push({ key: p.id, name: p.name, pids: [p.id], cov: floorCov(stock[p.id] / p.perBasket) });
    });
    if (rice.length && riceKg > 0) {
      var sum = rice.reduce(function (a, p) { return a + stock[p.id]; }, 0);
      groups.unshift({ key: 'arroz', name: 'Arroz', pids: rice.map(function (p) { return p.id; }), cov: floorCov(sum / riceKg) });
    }
    var covOf = {};
    groups.forEach(function (g) { g.pids.forEach(function (pid) { covOf[pid] = g.cov; }); });
    var total = groups.length ? Math.max(0, Math.min.apply(null, groups.map(function (g) { return g.cov; }))) : 0;
    var limiting = groups.filter(function (g) { return g.cov === Math.min.apply(null, groups.map(function (x) { return x.cov; })); });
    return { bought: bought, sold: sold, adj: adj, stock: stock, groups: groups, covOf: covOf, total: total, limiting: limiting };
  }

  function statusOf(cov, settings) {
    var m = num(settings.minCover);
    if (cov < m) return 'urgent';
    if (cov <= m + 2) return 'near';
    return 'ok';
  }

  /* ---------- custos ---------- */
  /* Histórico de preço de um produto: custo unitário da última compra de cada fornecedor (para cotação). */
  function priceHistory(state, pid) {
    var per = {};
    (state.purchases || []).forEach(function (pu, idx) {
      var q = 0, t = 0;
      (pu.items || []).forEach(function (it) { if (it.pid === pid && num(it.qty) > 0) { q += num(it.qty); t += num(it.total); } });
      if (q <= 0) return;
      var key = pu.supplierId || '', cur = per[key];
      if (!cur || pu.date > cur.date || (pu.date === cur.date && idx > cur.idx)) per[key] = { supplierId: key, date: pu.date, idx: idx, qty: q, total: round2(t), unit: t / q };
    });
    var rows = Object.keys(per).map(function (k) { return per[k]; });
    rows.sort(function (a, b) { return a.unit - b.unit; });
    var last = null;
    rows.forEach(function (r) { if (!last || r.date > last.date || (r.date === last.date && r.idx > last.idx)) last = r; });
    return { rows: rows, last: last, best: rows.length ? rows[0] : null };
  }

  function normText(t) { return String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim(); }
  /* Quadro de preços de um produto: última compra de cada fornecedor + última cotação de cada comércio, do menor para o maior. */
  function priceBoard(state, pid) {
    var hist = priceHistory(state, pid), rows = [], latest = {};
    hist.rows.forEach(function (r) {
      var sup = (state.suppliers || []).filter(function (x) { return x.id === r.supplierId; })[0];
      rows.push({ source: 'compra', place: sup ? sup.name : 'Compra sem fornecedor', unit: r.unit, date: r.date, qty: r.qty, total: r.total });
    });
    (state.quotes || []).forEach(function (q, i) {
      if (q.pid !== pid) return;
      var k = normText(q.place), cur = latest[k];
      if (!cur || q.date > cur.q.date || (q.date === cur.q.date && i > cur.i)) latest[k] = { q: q, i: i };
    });
    Object.keys(latest).forEach(function (k) {
      var q = latest[k].q;
      rows.push({ source: 'cotação', place: q.place, unit: q.price / q.qty, date: q.date, qty: q.qty, total: q.price, id: q.id });
    });
    rows.sort(function (a, b) { return a.unit - b.unit; });
    return { rows: rows, best: rows.length ? rows[0] : null, lastBuy: hist.last };
  }
  /* Onde comprar: para cada produto cotado, escolhe o menor preço (cotação ou compra anterior) e agrupa por comércio.
     want: { pid: quantidade }. Sem quantidade informada, usa a da última cotação. */
  function shoppingPlan(state, want) {
    want = want || {};
    var stores = {}, order = [], items = 0, compared = 0, total = 0, saves = 0, noQty = [];
    var cands = {}; // comércio -> { place, total, count, all }
    var prods = [];
    (state.products || []).forEach(function (p) {
      var quotes = (state.quotes || []).filter(function (q) { return q.pid === p.id; });
      if (!quotes.length) return;
      var bd = priceBoard(state, p.id); if (!bd.best) return;
      var qty = num(want[p.id]); var why = 'repor';
      if (!(qty > 0)) { qty = num(quotes[quotes.length - 1].qty); why = 'cotação'; }
      if (!(qty > 0)) { noQty.push(p.id); return; }
      prods.push({ p: p, bd: bd, qty: qty, why: why });
    });
    prods.forEach(function (x) {
      var b = x.bd.best, key = normText(b.place), worst = x.bd.rows[x.bd.rows.length - 1];
      var line = round2(b.unit * x.qty), sv = x.bd.rows.length > 1 ? round2((worst.unit - b.unit) * x.qty) : 0;
      var second = x.bd.rows.length > 1 ? x.bd.rows[1] : null;
      var st = stores[key] || (stores[key] = { key: key, place: b.place, items: [], total: 0, saves: 0 });
      if (stores[key].items.length === 0) order.push(key);
      st.items.push({ pid: x.p.id, name: x.p.name, unit: x.p.unit, qty: x.qty, why: x.why, unitPrice: b.unit, total: line, source: b.source, date: b.date, prices: x.bd.rows.length, second: second ? { place: second.place, unit: second.unit } : null, saves: sv });
      st.total = round2(st.total + line); st.saves = round2(st.saves + sv);
      total = round2(total + line); saves = round2(saves + sv); items++; if (x.bd.rows.length > 1) compared++;
      x.bd.rows.forEach(function (r) {
        var k = normText(r.place), c = cands[k] || (cands[k] = { place: r.place, total: 0, count: 0 });
        c.total = round2(c.total + r.unit * x.qty); c.count++;

    });
    var list = order.map(function (k) { return stores[k]; }).sort(function (a, b) { return b.total - a.total; });
    // um comércio só: só vale se ele tem preço para todos os itens
    var one = null;
    Object.keys(cands).forEach(function (k) { var c = cands[k]; if (c.count === items && items > 0 && (!one || c.total < one.total)) one = { place: c.place, total: c.total, extra: round2(c.total - total) }; });

    return { stores: list, total: total, saves: saves, items: items, compared: compared, onePlace: one && list.length > 1 ? one : null };
  }

  /* Nomes de comércio já usados (fornecedores + cotações), os mais recentes primeiro. */
  function knownPlaces(state) {
    var seen = {}, out = [];
    function add(n) { var k = normText(n); if (k && !seen[k]) { seen[k] = 1; out.push(String(n).trim()); } }
    (state.quotes || []).slice().reverse().forEach(function (q) { add(q.place); });
    (state.suppliers || []).forEach(function (x) { add(x.name); });
    return out;
  }

  function unitCost(state, pid) {
    var lines = [];
    (state.purchases || []).forEach(function (pu, idx) {
      (pu.items || []).forEach(function (it) {
        if (it.pid === pid && num(it.qty) > 0) lines.push({ date: pu.date, idx: idx, qty: num(it.qty), total: num(it.total) });
      });
    });
    if (!lines.length) return null;
    if (state.settings.costMode === 'avg') {
      var q = 0, t = 0;
      lines.forEach(function (l) { q += l.qty; t += l.total; });
      return q > 0 ? t / q : null;
    }
    var best = lines[0];
    lines.forEach(function (l) { if (l.date > best.date || (l.date === best.date && l.idx > best.idx)) best = l; });
    var qq = 0, tt = 0;
    lines.forEach(function (l) { if (l.idx === best.idx) { qq += l.qty; tt += l.total; } });
    return qq > 0 ? tt / qq : null;
  }

  function defaultItems(state) {
    var o = {};
    state.products.forEach(function (p) { if (num(p.perBasket) > 0) o[p.id] = num(p.perBasket); });
    return o;
  }

  function basketCost(state, items) {
    items = items || defaultItems(state);
    var cost = 0, missing = [];
    Object.keys(items).forEach(function (pid) {
      var q = num(items[pid]);
      if (q <= 0) return;
      var c = unitCost(state, pid);
      if (c == null) missing.push(pid); else cost += q * c;

    return { cost: cost, missing: missing };
  }

  /* ---------- reposição ---------- */
  function lastSupplier(state, pid) {
    var best = null;
    (state.purchases || []).forEach(function (pu, idx) {
      var has = (pu.items || []).some(function (it) { return it.pid === pid; });
      if (has && (!best || pu.date > best.date || (pu.date === best.date && idx > best.idx))) best = { date: pu.date, idx: idx, supplierId: pu.supplierId || '' };
    });
    return best ? best.supplierId : '';
  }

  function replenish(state, T, d) {
    d = d || derive(state);
    T = Math.max(0, num(T));
    var riceKg = num(state.settings.riceKg);
    var falta = {};
    state.products.forEach(function (p) {
      if (p.group === 'arroz' || !(num(p.perBasket) > 0)) return;
      falta[p.id] = Math.max(0, T * p.perBasket - d.stock[p.id]);
    });
    var rice = state.products.filter(function (p) { return p.group === 'arroz'; });
    if (rice.length && riceKg > 0) {
      var stockR = rice.reduce(function (a, p) { return a + d.stock[p.id]; }, 0);
      var grp = Math.max(0, T * riceKg - stockR);
      var soldSum = rice.reduce(function (a, p) { return a + d.sold[p.id]; }, 0);
      var pbSum = rice.reduce(function (a, p) { return a + num(p.perBasket); }, 0);
      rice.forEach(function (p) {
        var w = soldSum > 0 ? d.sold[p.id] / soldSum : (pbSum > 0 ? num(p.perBasket) / pbSum : 1 / rice.length);
        falta[p.id] = grp * w;
      });
    }
    var rows = [];
    state.products.forEach(function (p) {
      if (!(p.id in falta)) return;
      var f = falta[p.id];
      var row = { pid: p.id, name: p.name, unit: p.unit, falta: r3(f), qty: 0, packs: null, packLabel: p.packLabel || '', supplierId: '', unitCost: null, cost: 0 };
      if (f > EPS) {
        if (p.packSize > 1) { row.packs = Math.ceil(f / p.packSize - EPS); row.qty = row.packs * p.packSize; }
        else row.qty = r3(f);
        row.supplierId = lastSupplier(state, p.id);
        row.unitCost = unitCost(state, p.id);
        row.cost = round2(row.qty * (row.unitCost || 0));
      }
      rows.push(row);
    });
    var need = rows.filter(function (r) { return r.qty > 0; });
    var map = {};
    need.forEach(function (r) {
      var k = r.supplierId || '';
      if (!map[k]) map[k] = { supplierId: k, name: k ? ((byId(state.suppliers, k) || {}).name || 'Fornecedor removido') : 'Sem fornecedor definido', items: [], total: 0 };
      map[k].items.push(r); map[k].total = round2(map[k].total + r.cost);
    });
    var groups = Object.keys(map).map(function (k) { return map[k]; });
    groups.sort(function (a, b) { return a.name.localeCompare(b.name, 'pt-BR'); });
    var total = round2(need.reduce(function (a, r) { return a + r.cost; }, 0));
    var unknown = need.filter(function (r) { return r.unitCost == null; }).length;
    return { rows: rows, items: need, groups: groups, total: total, unknownCost: unknown };
  }

  /* ---------- parcelas ---------- */
  function recebido(p) { return round2(p.paid ? p.amount : Math.min(num(p.amount), num(p.received))); }
  function aberto(p) { return round2(num(p.amount) - recebido(p)); }
  function isOpen(p) { return aberto(p) > 0.004; }
  function isOverdue(p, hoje) { return isOpen(p) && p.due < (hoje || today()); }

  function allParcels(state) {
    var rows = [];
    (state.sales || []).forEach(function (s) {
      (s.parcels || []).forEach(function (p) { rows.push({ sale: s, parcel: p, customerId: s.customerId }); });
    });
    return rows;
  }

  function customerBalance(state, customerId, hoje) {
    var open = 0, late = 0, count = 0;
    allParcels(state).forEach(function (r) {
      if (r.customerId !== customerId || !isOpen(r.parcel)) return;
      var a = aberto(r.parcel);
      open += a; count++;
      if (isOverdue(r.parcel, hoje)) late += a;
    });
    return { open: round2(open), late: round2(late), count: count };
  }

  function lateSummary(state, hoje) {
    var count = 0, sum = 0;
    allParcels(state).forEach(function (r) {
      if (isOverdue(r.parcel, hoje)) { count++; sum += aberto(r.parcel); }
    });
    return { count: count, sum: round2(sum) };
  }

  /* abate primeiro as parcelas abertas mais antigas */
  function receiveForCustomer(state, customerId, value, date, splits) {
    var rem = round2(value);
    var queue = (splits && splits.length ? splits : [{ amount: rem }]).map(function (x) { return { method: x.method, amount: x.amount }; });
    if (!(rem > 0)) return { applied: 0, leftover: 0 };
    var rows = allParcels(state).filter(function (r) { return r.customerId === customerId && isOpen(r.parcel); });
    rows.sort(function (a, b) { return a.parcel.due < b.parcel.due ? -1 : a.parcel.due > b.parcel.due ? 1 : (a.sale.date < b.sale.date ? -1 : a.sale.date > b.sale.date ? 1 : 0); });

        addPay(p, t, date, q.method); q.amount = round2(q.amount - t); need = round2(need - t);
        if (q.amount <= 0.004) queue.shift();
      }
      p.received = round2(num(p.received) + use);
      if (p.received >= p.amount - 0.004) { p.received = p.amount; p.paid = true; }
      rem = round2(rem - use); applied = round2(applied + use);
    }
    return { applied: applied, leftover: rem };
  }

  var METHODS = { pix: 'Pix', dinheiro: 'Dinheiro' };
  function methodName(m) { return METHODS[m] || 'Sem forma informada'; }
  function addPay(p, amount, date, method) {
    if (!(amount > 0.004)) return;
    var x = { date: validISO(date) ? date : today(), amount: round2(amount) };
    if (METHODS[method]) x.method = method;
    (p.pays = p.pays || []).push(x);
  }
  /* divide um valor entre Pix e dinheiro. mode: 'pix' | 'dinheiro' | 'dividir' (pix = valor no Pix) */
  function splitPay(total, mode, pix) {
    total = round2(total);
    if (mode === 'pix') return { splits: [{ method: 'pix', amount: total }] };
    if (mode === 'dinheiro') return { splits: [{ method: 'dinheiro', amount: total }] };
    if (mode !== 'dividir') return { error: 'Escolha a forma de pagamento.' };
    var v = typeof pix === 'number' ? pix : parseNum(pix);
    if (isNaN(v) || v <= 0 || v >= total - 0.004) return { error: 'Dividindo, o valor no Pix precisa ser maior que zero e menor que ' + money(total) + '.' };
    v = round2(v);
    return { splits: [{ method: 'pix', amount: v }, { method: 'dinheiro', amount: round2(total - v) }] };
  }
  function receiveParcel(p, date, splits) {
    var open = aberto(p), list = splits && splits.length ? splits : [{ amount: open }];
    var sum = list.reduce(function (a, x) { return a + x.amount; }, 0);
    if (Math.abs(sum - open) > 0.01) list = [{ amount: open }];
    list.forEach(function (x) { addPay(p, x.amount, date, x.method); });

  }
  function undoParcel(p) { p.paid = false; p.received = 0; p.pays = []; }
  /* recebimentos de uma parcela, cada um com data. Parcelas antigas, sem data guardada, usam uma data estimada. */
  function paysOf(sale, p, hoje) {

    var list = (p.pays || []).map(function (x) { return { date: x.date, amount: num(x.amount), method: x.method }; });
    var got = list.reduce(function (a, x) { return a + x.amount; }, 0), diff = round2(recebido(p) - got);
    if (diff > 0.004) {

      list.push({ date: d, amount: diff, est: true });
    }
    return list;
  }

  function parcelStatus(p, hoje) {
    hoje = hoje || today();
    var out = [];
    if (!isOpen(p)) { out.push({ cls: 'ok', text: 'Recebida' }); return out; }
    if (recebido(p) > 0.004) out.push({ cls: 'warn', text: 'Parcial' });
    var d = daysBetween(hoje, p.due);
    if (d < 0) out.push({ cls: 'bad', text: 'Atrasada ' + (-d) + ' d' });
    else if (d === 0) out.push({ cls: 'warn', text: 'Vence hoje' });
    else out.push({ cls: 'info', text: 'em ' + d + ' d' });
    return out;
  }

  /* gera as parcelas de uma venda */
  function buildParcels(o) {
    var total = round2(o.total), term = o.term, date = o.date;
    var entrada = round2(isNaN(o.entrada) ? 0 : o.entrada);
    if (entrada < 0) return { error: 'A entrada não pode ser negativa.' };
    var parcels = [];
    function mk(due, amount, paid, kind) {
      var p = { id: uid(), due: due, amount: round2(amount), paid: paid, received: paid ? round2(amount) : 0 };
      if (paid) {
        var sp = o.pay && o.pay.length ? o.pay : null;
        if (sp && Math.abs(sp.reduce(function (a, x) { return a + x.amount; }, 0) - amount) > 0.01) sp = null;
        p.pays = (sp || [{ amount: amount }]).map(function (x) { var y = { date: date, amount: round2(x.amount) }; if (METHODS[x.method]) y.method = x.method; return y; });
      }
      if (kind) p.kind = kind;
      return p;
    }
    if (term === 'avista') {
      if (total > 0) parcels.push(mk(date, total, true, 'avista'));
      return { parcels: parcels };
    }
    if (entrada > total + 0.004) return { error: 'A entrada (' + money(entrada) + ') é maior que o total da venda (' + money(total) + ').' };
    if (entrada > 0.004) parcels.push(mk(date, entrada, true, 'entrada'));
    var rest = round2(total - entrada);
    if (rest <= 0.004) return { parcels: parcels };
    if (term === '30-60') {

    } else if (term === '30') {
      parcels.push(mk(addDays(date, 30), rest, false));
    } else if (term === 'fiado') {

  /* ---------- venda ---------- */
  function isRice(p) { return p.group === 'arroz'; }

  function buildSaleItems(state, customer, riceMode) {
    var items = defaultItems(state);
    var rice = state.products.filter(isRice);
    if (customer && customer.mods) Object.keys(customer.mods).forEach(function (pid) { if (byId(state.products, pid)) items[pid] = num(customer.mods[pid]); });
    if (riceMode && riceMode !== 'mix') {
      rice.forEach(function (p) { items[p.id] = p.id === riceMode ? num(state.settings.riceKg) : 0; });
    }
    return items;
  }

  function diffMods(state, items) {
    var def = defaultItems(state), mods = [];
    state.products.forEach(function (p) {
      var a = num(def[p.id]), b = num(items[p.id]);
      if (Math.abs(a - b) > EPS) mods.push({ pid: p.id, de: a, para: b });
    });
    return mods;
  }

  function checkSale(state, qty, items, d) {
    d = d || derive(state);
    var errors = [], lines = [];
    state.products.forEach(function (p) {
      var per = num(items[p.id]);
      if (per <= 0) return;
      var need = r6(qty * per), have = d.stock[p.id];
      lines.push({ pid: p.id, name: p.name, unit: p.unit, need: need, have: have, ok: need <= have + 1e-9 });
    });
    var rice = state.products.filter(isRice);
    var riceKg = num(state.settings.riceKg);
    var riceSum = rice.reduce(function (a, p) { return a + num(items[p.id]); }, 0);
    var riceOk = !rice.length || Math.abs(riceSum - riceKg) < 1e-6;
    if (!riceOk) errors.push('O arroz da cesta deve somar ' + fnum(riceKg) + ' kg (hoje soma ' + fnum(riceSum) + ' kg).');
    lines.forEach(function (l) {
      if (!l.ok) errors.push('Estoque insuficiente de ' + l.name + ': precisa de ' + fnum(l.need) + ' ' + l.unit + ' e há ' + fnum(Math.max(0, l.have)) + ' ' + l.unit + '.');
    });
    return { errors: errors, lines: lines, riceSum: riceSum, riceOk: riceOk };
  }

  function makeSale(state, input) {
    var qty = input.qty;
    if (!(qty >= 1) || Math.floor(qty) !== qty) return { errors: ['Informe um número inteiro de cestas (mínimo 1).'] };
    if (!validISO(input.date)) return { errors: ['Informe a data da venda.'] };
    if (!(input.price >= 0) || isNaN(input.price)) return { errors: ['Informe o preço por cesta.'] };
    var customer = input.customerId ? byId(state.customers, input.customerId) : null;
    var newName = String(input.newName || '').trim();
    if (!customer && !newName) return { errors: ['Escolha um cliente ou informe o nome do novo cliente.'] };
    var chk = checkSale(state, qty, input.items);
    if (chk.errors.length) return { errors: chk.errors };
    var total = round2(qty * input.price);
    var pr = buildParcels({ total: total, term: input.term, date: input.date, entrada: input.entrada, fiadoDue: input.fiadoDue, pay: input.pay });
    if (pr.error) return { errors: [pr.error] };
    var newCustomer = null;
    if (!customer) {
      var exist = state.customers.filter(function (c) { return c.name.toLowerCase() === newName.toLowerCase(); })[0];
      if (exist) customer = exist; else { newCustomer = { id: uid(), name: newName, phone: '', address: '', note: '', mods: {} }; customer = newCustomer; }
    }
    var items = {};
    Object.keys(input.items).forEach(function (pid) { if (num(input.items[pid]) > 0) items[pid] = num(input.items[pid]); });
    var sale = {
      id: uid(), date: input.date, qty: qty, price: round2(input.price),
      costSnap: round2(basketCost(state, items).cost), customerId: customer.id,
      items: items, mods: diffMods(state, items), parcels: pr.parcels
    };
    if (input.term === 'fiado') sale.fiado = true;
    return { sale: sale, newCustomer: newCustomer, errors: [] };
  }


  /* ---------- editar data de um recebimento ---------- */
  /* Fixa a data do recebimento n da parcela. Parcelas antigas (data estimada) passam a ter data guardada. */
  function setPayDate(sale, p, idx, date, hoje) {
    hoje = hoje || today();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) || isNaN(new Date(date + 'T00:00:00Z').getTime())) return { error: 'Informe uma data válida.' };
    if (date > hoje) return { error: 'A data do recebimento não pode ser no futuro.' };
    var list = paysOf(sale, p, hoje);
    if (!list[idx]) return { error: 'Recebimento não encontrado.' };
    list[idx].date = date;
    p.pays = list.map(function (x) { var o = { date: x.date, amount: x.amount }; if (x.method) o.method = x.method; return o; });
    return { ok: true };
  }

  /* Muda a data prevista (vencimento) de uma parcela ainda não recebida por inteiro. */
  function setDue(p, date) {
    if (!/^\d{4}-\d{2}-\d{2}$/.test(String(date || '')) || isNaN(new Date(date + 'T00:00:00Z').getTime())) return { error: 'Informe uma data válida.' };
    p.due = date; return { ok: true };
  }

  /* ---------- troca na cesta: o que tirar para manter o custo (e o lucro) da cesta padrão ---------- */
  function swapAdvice(state, items, price) {
    var def = defaultItems(state), std = basketCost(state, def), cur = basketCost(state, items);
    var out = { stdCost: round2(std.cost), cost: round2(cur.cost), delta: round2(cur.cost - std.cost), missing: std.missing.concat(cur.missing), options: [], price: price };
    if (out.missing.length) return out;
    if (out.delta <= 0.004) return out;
    out.priceUp = out.delta;
    var cands = [];
    state.products.forEach(function (p) {
      var q = num(items[p.id]), uc = unitCost(state, p.id);
      if (isRice(p) || p.cat === 'Embalagens' || q <= 0 || uc == null || uc <= 0) return;
      if (q > num(def[p.id]) + EPS) return; /* item que o cliente aumentou não entra na lista de cortes */
      var step = p.unit === 'kg' ? 0.5 : 1, levels = [];
      for (var r = step; r < q - EPS; r += step) levels.push(r);
      levels.push(q);
      cands.push({ pid: p.id, name: p.name, unit: p.unit, from: q, uc: uc, levels: levels });
    });
    var sols = [];
    (function walk(start, chosen, removed) {
      if (chosen.length) sols.push({ removals: chosen.slice(), removed: removed });
      if (chosen.length >= 3) return;
      for (var i = start; i < cands.length; i++) {
        var c = cands[i];
        for (var j = 0; j < c.levels.length; j++) {
          var cost = round2(c.levels[j] * c.uc);
          chosen.push({ pid: c.pid, name: c.name, unit: c.unit, from: c.from, to: round2(c.from - c.levels[j]), qty: c.levels[j], cost: cost });
          walk(i + 1, chosen, removed + cost);
          chosen.pop();
        }
      }
    })(0, [], 0);
    sols.forEach(function (x) { x.after = round2(out.cost - x.removed); x.diff = round2(x.after - out.stdCost); });
    var tol = Math.max(1, out.delta * 0.15);
    sols = sols.filter(function (x) { return Math.abs(x.diff) <= tol; });
    /* prefere o que fecha a conta mais certinho; empatando, poucos itens, tirando antes limpeza/higiene que alimento e itens inteiros em vez de pedaços */
    var food = function (x) { return x.removals.filter(function (r) { var pr = byId(state.products, r.pid); return pr && pr.cat === 'Alimentos'; }).length; };
    var parts = function (x) { return x.removals.filter(function (r) { return r.to > EPS; }).length; };
    sols.sort(function (a, b) {
      return (Math.round(Math.abs(a.diff) * 2) - Math.round(Math.abs(b.diff) * 2)) || (a.removals.length - b.removals.length) || (food(a) - food(b)) || (parts(a) - parts(b)) || (Math.abs(a.diff) - Math.abs(b.diff));
    });
    out.options = sols.slice(0, 4);
    return out;
  }

  function saleTotal(s) { return round2(num(s.qty) * num(s.price)); }
  function saleProfit(s) { return round2(saleTotal(s) - num(s.qty) * num(s.costSnap)); }

  /* ---------- painel ---------- */
  /* ---------- painel (dashboard) ---------- */
  function monthAdd(key, n) {
    var y = Number(key.slice(0, 4)), m = Number(key.slice(5, 7)) - 1 + n;
    y += Math.floor(m / 12); m = ((m % 12) + 12) % 12;
    return y + '-' + (m + 1 < 10 ? '0' : '') + (m + 1);
  }
  function monthEnd(key) { return addDays(monthAdd(key, 1) + '-01', -1); }
  /* período escolhido e o período anterior equivalente, para comparar */
  function periodRange(kind, hoje) {
    var cur = monthKey(hoje), r;
    if (kind === 'mes_ant') { var k1 = monthAdd(cur, -1), k2 = monthAdd(cur, -2); r = { from: k1 + '-01', to: monthEnd(k1), pfrom: k2 + '-01', pto: monthEnd(k2), label: fmonth(k1), plabel: fmonth(k2) }; }
    else if (kind === '3m') { var a = monthAdd(cur, -2), b = monthAdd(cur, -5), c = monthAdd(cur, -3); r = { from: a + '-01', to: monthEnd(cur), pfrom: b + '-01', pto: monthEnd(c), label: 'últimos 3 meses', plabel: '3 meses anteriores' }; }
    else if (kind === 'tudo') r = { from: '0000-01-01', to: '9999-12-31', pfrom: null, pto: null, label: 'tudo', plabel: '' };
    else { var p1 = monthAdd(cur, -1); r = { from: cur + '-01', to: monthEnd(cur), pfrom: p1 + '-01', pto: monthEnd(p1), label: 'este mês', plabel: 'mês passado' }; }
    return r;
  }
  function salesMetrics(state, from, to) {
    var rev = 0, qty = 0, n = 0, cost = 0, missing = false, custs = {};
    (state.sales || []).forEach(function (sa) {
      if (!from || sa.date < from || sa.date > to) return;
      var bc = basketCost(state, sa.items);
      rev += saleTotal(sa); qty += num(sa.qty); n++; cost += num(sa.qty) * bc.cost; if (bc.missing.length) missing = true;
      if (sa.customerId) custs[sa.customerId] = 1;
    });
    rev = round2(rev); cost = round2(cost);
    var profit = round2(rev - cost);
    return { revenue: rev, qty: r3(qty), sales: n, cost: cost, profit: profit, margin: rev > 0 ? profit / rev : 0, ticket: n ? round2(rev / n) : 0, customers: Object.keys(custs).length, partialCost: missing };
  }
  /* recebimentos e vencimentos de um período */
  function receiptsMetrics(state, from, to, hoje) {
    var got = 0, n = 0, est = false, due = 0, open = 0, dueN = 0, by = { pix: 0, dinheiro: 0, outro: 0 };
    allParcels(state).forEach(function (r) {
      paysOf(r.sale, r.parcel, hoje).forEach(function (x) {
        if (x.date >= from && x.date <= to) { got += x.amount; n++; if (x.est) est = true; by[METHODS[x.method] ? x.method : 'outro'] += x.amount; }
      });
      if (!r.parcel.kind && r.parcel.due >= from && r.parcel.due <= to) { due += num(r.parcel.amount); open += aberto(r.parcel); dueN++; }
    });
    return { received: round2(got), byMethod: { pix: round2(by.pix), dinheiro: round2(by.dinheiro), outro: round2(by.outro) }, count: n, estimated: est, due: round2(due), dueOpen: round2(open), dueCount: dueN };
  }
  /* variação em relação ao período anterior: { pct, dir } ; dir = 'up' | 'down' | 'flat' | 'new' | 'none' */
  function variation(cur, prev) {
    if (prev == null) return { dir: 'none', pct: 0 };
    if (Math.abs(prev) < 0.005) return Math.abs(cur) < 0.005 ? { dir: 'flat', pct: 0 } : { dir: 'new', pct: 0 };
    var pct = (cur - prev) / Math.abs(prev) * 100;
    return { dir: Math.abs(pct) < 0.05 ? 'flat' : pct > 0 ? 'up' : 'down', pct: Math.round(pct * 10) / 10 };
  }
  function dashboard(state, kind, hoje) {
    hoje = hoje || today();
    var rg = periodRange(kind, hoje);
    var cur = salesMetrics(state, rg.from, rg.to), prev = rg.pfrom ? salesMetrics(state, rg.pfrom, rg.pto) : null;
    cur.flow = cashflow(state, rg.from, rg.to, hoje);
    cur.expenses = expensesSummary(state, rg.from, rg.to); cur.net = round2(cur.profit - cur.expenses.total);
    if (prev) { prev.expenses = expensesSummary(state, rg.pfrom, rg.pto); prev.net = round2(prev.profit - prev.expenses.total); }
    cur.rcv = receiptsMetrics(state, rg.from, rg.to, hoje); if (prev) prev.rcv = receiptsMetrics(state, rg.pfrom, rg.pto, hoje);
    var cmp = {};
    ['revenue', 'profit', 'qty', 'ticket', 'margin'].forEach(function (k) { cmp[k] = variation(cur[k], prev ? prev[k] : null); });

    // últimos 6 meses
    var thisKey = monthKey(hoje), series = [];
    for (var i = 5; i >= 0; i--) {
      var k = monthAdd(thisKey, -i), m = salesMetrics(state, k + '-01', monthEnd(k)), pur = 0;
      (state.purchases || []).forEach(function (pu) { if (monthKey(pu.date) === k) (pu.items || []).forEach(function (it) { pur += num(it.total); }); });
      series.push({ key: k, revenue: m.revenue, profit: m.profit, purchases: round2(pur) });
    }

    // contas a receber
    var open = 0, late = 0, lateCount = 0, d7 = 0, d30 = 0, aging = [0, 0, 0, 0], future = {}, debtors = {};
    allParcels(state).forEach(function (r) {
      var a = aberto(r.parcel); if (a <= 0.004) return;
      open += a;
      var dd = daysBetween(hoje, r.parcel.due);
      var cid = r.customerId || '';
      var db = debtors[cid] || (debtors[cid] = { customerId: cid, open: 0, late: 0, oldest: 0, parcels: 0 });
      db.open += a; db.parcels++;
      if (dd < 0) {
        late += a; lateCount++; db.late += a; db.oldest = Math.max(db.oldest, -dd);
        var days = -dd; aging[days <= 15 ? 0 : days <= 30 ? 1 : days <= 60 ? 2 : 3] += a;
      } else {
        if (dd <= 7) d7 += a;
        if (dd <= 30) d30 += a;
        var mk = monthKey(r.parcel.due); future[mk] = (future[mk] || 0) + a;
      }
    });
    var months = [];
    for (var j = 0; j < 6; j++) { var kk = monthAdd(thisKey, j); months.push({ key: kk, amount: round2(future[kk] || 0) }); }
    var list = Object.keys(debtors).map(function (c) { var d = debtors[c]; d.open = round2(d.open); d.late = round2(d.late); return d; });
    list.sort(function (x, y) { return y.late - x.late || y.open - x.open; });
    cmp.net = variation(cur.net, prev ? prev.net : null); cmp.expenses = variation(cur.expenses.total, prev ? prev.expenses.total : null);
    cmp.received = variation(cur.rcv.received, prev ? prev.rcv.received : null);
    return {
      payables: payablesSummary(state, hoje), cashNow: cashflow(state, null, null, hoje),
      range: rg, cur: cur, prev: prev, cmp: cmp, series: series,
      receivable: { open: round2(open), late: round2(late), lateCount: lateCount, latePct: open > 0 ? late / open : 0, next7: round2(d7), next30: round2(d30), aging: aging.map(round2), months: months },
      debtors: list
    };
  }

  function cash(state) {
    var invested = 0, got = 0, open = 0, late = 0, hoje = today();
    (state.purchases || []).forEach(function (pu) { (pu.items || []).forEach(function (it) { invested += num(it.total); }); });
    allParcels(state).forEach(function (r) {
      got += recebido(r.parcel);
      var a = aberto(r.parcel);
      if (a > 0.004) { open += a; if (r.parcel.due < hoje) late += a; }
    });
    return { invested: round2(invested), received: round2(got), open: round2(open), late: round2(late), balance: round2(got - invested) };
  }

  /* ---------- contas a pagar e fluxo de caixa ---------- */
  function billPaid(b) { return round2((b.pays || []).reduce(function (a, x) { return a + num(x.amount); }, 0)); }
  function billOpen(b) { return round2(Math.max(0, num(b.amount) - billPaid(b))); }
  function billIsOpen(b) { return billOpen(b) > 0.004; }
  function payBill(b, date, method, from) {
    var amt = billOpen(b); if (!(amt > 0.004)) return 0;
    var x = { date: validISO(date) ? date : today(), amount: amt, from: from === 'pessoal' ? 'pessoal' : 'caixa' };
    if (METHODS[method]) x.method = method;
    (b.pays = b.pays || []).push(x); return amt;
  }
  /* paga a conta com uma ou mais formas (Pix/dinheiro) */
  function payBillSplit(b, date, splits, from) {
    var open = billOpen(b); if (!(open > 0.004)) return 0;
    var list = splits && splits.length ? splits : [{ amount: open }];
    if (Math.abs(list.reduce(function (a, x) { return a + x.amount; }, 0) - open) > 0.01) list = [{ amount: open }];
    list.forEach(function (sp) {
      var x = { date: validISO(date) ? date : today(), amount: round2(sp.amount), from: from === 'pessoal' ? 'pessoal' : 'caixa' };
      if (METHODS[sp.method]) x.method = sp.method; (b.pays = b.pays || []).push(x);
    });
    return open;
  }
  function undoBill(b) { b.pays = []; }
  function billStatus(b, hoje) {
    hoje = hoje || today();
    if (!billIsOpen(b)) return [{ cls: 'ok', text: 'Paga' }];
    var d = daysBetween(hoje, b.due), out = [];
    if (billPaid(b) > 0.004) out.push({ cls: 'warn', text: 'Parcial' });
    if (d < 0) out.push({ cls: 'bad', text: 'Vencida há ' + (-d) + ' d' });
    else if (d === 0) out.push({ cls: 'warn', text: 'Vence hoje' });
    else out.push({ cls: 'info', text: 'vence em ' + d + ' d' });
    return out;
  }
  function payablesSummary(state, hoje) {
    hoje = hoje || today();
    var open = 0, late = 0, lateCount = 0, d7 = 0, d30 = 0, n = 0;
    (state.payables || []).forEach(function (b) {
      var a = billOpen(b); if (a <= 0.004) return;
      open += a; n++;
      var dd = daysBetween(hoje, b.due);
      if (dd < 0) { late += a; lateCount++; } else { if (dd <= 7) d7 += a; if (dd <= 30) d30 += a; }
    });
    return { open: round2(open), count: n, late: round2(late), lateCount: lateCount, next7: round2(d7), next30: round2(d30) };
  }
  function purchaseTotal(pu) { return round2((pu.items || []).reduce(function (a, i) { return a + num(i.total); }, 0)); }
  /* Para onde foi o dinheiro entre from e to (inclusive). Só conta o que saiu do caixa da feira. */
  function cashflow(state, from, to, hoje) {
    from = from || '0000-01-01'; to = to || '9999-12-31';
    var inn = 0, buy = 0, billsBuy = 0, billsOther = 0, wd = 0, inBy = { pix: 0, dinheiro: 0, outro: 0 };
    allParcels(state).forEach(function (r) {
      paysOf(r.sale, r.parcel, hoje).forEach(function (x) { if (x.date >= from && x.date <= to) { inn += x.amount; inBy[METHODS[x.method] ? x.method : 'outro'] += x.amount; } });
    });
    (state.purchases || []).forEach(function (pu) {
      if (pu.payableId || pu.paidFrom === 'pessoal') return;
      if (pu.date >= from && pu.date <= to) buy += purchaseTotal(pu);
    });
    (state.payables || []).forEach(function (b) {
      (b.pays || []).forEach(function (x) {
        if (x.from === 'pessoal' || x.date < from || x.date > to) return;
        if (b.purchaseId) billsBuy += x.amount; else billsOther += x.amount;
      });
    });
    (state.withdrawals || []).forEach(function (w) { if (w.date >= from && w.date <= to) wd += w.amount; });
    var contrib = 0, exp = expensesSummary(state, from, to).caixa;
    (state.contributions || []).forEach(function (w) { if (w.date >= from && w.date <= to) contrib += w.amount; });
    var reinvested = round2(buy + billsBuy), out = round2(reinvested + billsOther + wd + exp);
    return { contributed: round2(contrib), received: round2(inn), receivedBy: { pix: round2(inBy.pix), dinheiro: round2(inBy.dinheiro), outro: round2(inBy.outro) }, reinvested: reinvested, bills: round2(billsOther), expenses: round2(exp), withdrawn: round2(wd), out: out, balance: round2(inn + contrib - out) };
  }

  /* despesas no período: total, por categoria, e quanto saiu do caixa */
  function expensesSummary(state, from, to) {
    from = from || '0000-01-01'; to = to || '9999-12-31';
    var tot = 0, caixa = 0, n = 0, by = {};
    (state.expenses || []).forEach(function (x) {
      if (x.date < from || x.date > to) return;
      tot += x.amount; n++; if (x.from !== 'pessoal') caixa += x.amount; by[x.cat] = (by[x.cat] || 0) + x.amount;
    });
    var cats = Object.keys(by).map(function (k) { return { cat: k, amount: round2(by[k]) }; }).sort(function (a, b) { return b.amount - a.amount; });
    return { total: round2(tot), caixa: round2(caixa), count: n, byCat: cats };
  }
  /* Dinheiro do dono no negócio: aportes + compras e contas pagas do bolso, comparado com o que ele já retirou. */
  function ownerCapital(state) {
    var ap = 0, buy = 0, buyN = 0, bills = 0, wd = 0, ex = 0;
    (state.expenses || []).forEach(function (x) { if (x.from === 'pessoal') ex += x.amount; });
    (state.contributions || []).forEach(function (w) { ap += w.amount; });
    (state.purchases || []).forEach(function (pu) { if (!pu.payableId && pu.paidFrom === 'pessoal') { buy += purchaseTotal(pu); buyN++; } });
    (state.payables || []).forEach(function (b) { (b.pays || []).forEach(function (x) { if (x.from === 'pessoal') bills += x.amount; }); });
    (state.withdrawals || []).forEach(function (w) { wd += w.amount; });
    var total = round2(ap + buy + bills + ex);
    return { contributions: round2(ap), purchases: round2(buy), purchasesCount: buyN, bills: round2(bills), expenses: round2(ex), total: total, withdrawn: round2(wd), toRecover: round2(Math.max(0, total - wd)), extra: round2(Math.max(0, wd - total)) };
  }

  function monthlyFlow(state) {
    var m = {};
    function get(k) { return m[k] || (m[k] = { key: k, purchases: 0, inflow: 0 }); }
    (state.purchases || []).forEach(function (pu) {
      var t = (pu.items || []).reduce(function (a, it) { return a + num(it.total); }, 0);
      get(monthKey(pu.date)).purchases += t;
    });
    allParcels(state).forEach(function (r) { get(monthKey(r.parcel.due)).inflow += num(r.parcel.amount); });
    var rows = Object.keys(m).sort().map(function (k) { return m[k]; });
    var acc = 0;
    rows.forEach(function (r) { r.purchases = round2(r.purchases); r.inflow = round2(r.inflow); acc = round2(acc + r.inflow - r.purchases); r.balance = acc; });
    return rows;
  }

  function nextParcels(state, n) {
    var rows = allParcels(state).filter(function (r) { return isOpen(r.parcel); });
    rows.sort(function (a, b) { return a.parcel.due < b.parcel.due ? -1 : a.parcel.due > b.parcel.due ? 1 : 0; });
    return rows.slice(0, n || 6);
  }

  function alerts(state, d, hoje) {
    d = d || derive(state);
    var out = { urgent: null, near: null, late: null };
    var min = num(state.settings.minCover);
    var st = d.groups.length ? statusOf(d.total, state.settings) : 'ok';
    if (st === 'urgent') {
      out.urgent = { total: d.total, min: min, items: d.groups.filter(function (g) { return g.cov < min; }).map(function (g) { return { name: g.name, cov: Math.max(0, g.cov) }; }) };
    } else if (st === 'near') out.near = { total: d.total, min: min };
    var l = lateSummary(state, hoje);
    if (l.count > 0) out.late = l;
    return out;
  }

  /* ---------- exclusões ---------- */
  function canDeleteCustomer(state, id) { return !state.sales.some(function (s) { return s.customerId === id; }); }
  function productUsed(state, id) {
    return state.purchases.some(function (p) { return p.items.some(function (i) { return i.pid === id; }); }) ||
      state.sales.some(function (s) { return s.items && s.items[id] != null; }) ||
      state.adjustments.some(function (a) { return a.pid === id; });
  }
  function supplierUsed(state, id) { return state.purchases.some(function (p) { return p.supplierId === id; }); }

  var api = {
    TZ: TZ, EPS: EPS, DEFAULT_SETTINGS: DEFAULT_SETTINGS, TERMS: TERMS, CATS: CATS,
    num: num, round2: round2, r3: r3, uid: uid, today: today, addDays: addDays, daysBetween: daysBetween, validISO: validISO,

  function dashMesesHTML(db) {

      '<div class="bar" role="img" aria-label="Custo ' + Math.round(cPct) + '% e lucro ' + Math.round(100 - cPct) + '% do preço"><i class="c" style="width:' + cPct + '%"></i><i class="p" style="width:' + (100 - cPct) + '%"></i></div>' +

      '<p class="sub" style="margin-top:8px"><small>O lucro bruto considera só os itens da cesta (sacolas incluídas). Despesas, taxas e inadimplência ficam de fora.</small></p></section>';

    h += dashFlowHTML(db) + dashContasHTML(db);

      return '<div class="item"><div class="head"><b>' + esc(custName(r.customerId)) + '</b><b>' + E.money(E.aberto(r.parcel)) + '</b></div>' +
        '<div class="parcel" style="border-top:0;padding-bottom:0"><div class="info"><small>Vence em ' + E.fdate(r.parcel.due) + '</small> ' + st + '</div>' +
        '<button class="btn small" data-act="recv-parcel" data-sale="' + r.sale.id + '" data-parcel="' + r.parcel.id + '">Receber</button></div></div>';

  /* ---------- VENDAS ---------- */
  function newSaleDraft() {
    var t = E.today();
    return { date: t, qty: '1', customerId: '', newName: '', price: fin(S.settings.price), term: S.settings.term, fiadoDue: E.addDays(t, 30), entrada: '', payMode: lastPayMode(), payPix: '', rice: 'mix', items: E.buildSaleItems(S, null, null) };
  }
  function detectRice(items) {
    var rice = S.products.filter(E.isRice), kg = E.num(S.settings.riceKg);
    for (var i = 0; i < rice.length; i++) {
      var ok = Math.abs(E.num(items[rice[i].id]) - kg) < 1e-9;
      for (var j = 0; j < rice.length && ok; j++) if (j !== i && E.num(items[rice[j].id]) > 1e-9) ok = false;
      if (ok) return rice[i].id;
    }
    return 'mix';
  }
  function saleQty() { var q = E.parseNum(ui.sale.qty); return isNaN(q) ? 0 : q; }

  function saleItemsHTML() {
    var d = ui.sale, rice = S.products.filter(E.isRice), h = '';

    }).join('') + '</div><small>Para tirar um item da cesta, deixe em 0.</small>';

    var d = ui.sale, qty = saleQty(), chk = E.checkSale(S, qty, d.items), h = '<label>Conferência antes de vender</label>';
    var rice = S.products.filter(E.isRice);
