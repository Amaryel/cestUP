<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5e43" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a3023" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Estoque, compras, vendas e parcelas de cestas básicas. Funciona sem internet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cestas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>Controle de Cestas</title>
<style>
/* Controle de Cestas — tema "pinheiro e milho": verde-escuro profundo, amarelo de milho como único destaque */
:root {
  --bg: #eef3ee; --surface: #ffffff; --surface2: #f3f7f3; --text: #10231b; --muted: #556a5f;
  --line: #d9e3db; --line-strong: #bccabf;
  --brand: #0b5e43; --brand-2: #12805a; --brand-ink: #ffffff; --brand-soft: #dcefe4;
  --corn: #f4b73d; --corn-ink: #2b1d00;
  --ok: #0f7a4f; --ok-bg: #dcf1e5; --warn: #7a4e00; --warn-bg: #fdf0cc; --bad: #b3261e; --bad-bg: #fde4e1;
  --info: #1f5a78; --info-bg: #e0eff7;
  --shadow: 0 1px 2px rgba(16, 35, 27, .06), 0 6px 18px -8px rgba(16, 35, 27, .14);
  --radius: 18px; --radius-sm: 12px; --nav-h: 68px; --side-w: 244px;
  --hero-a: #0f7650; --hero-b: #073d2c;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0c1611; --surface: #14231b; --surface2: #1a2d22; --text: #e8f1ea; --muted: #9bb2a2;
    --line: #27402f; --line-strong: #38573f;
    --brand: #4fc88a; --brand-2: #4fc88a; --brand-ink: #062213; --brand-soft: #1b3a29;
    --corn: #f4b73d; --corn-ink: #2b1d00;
    --ok: #74dba1; --ok-bg: #1b3b29; --warn: #f2c870; --warn-bg: #3a2e10; --bad: #ff9d92; --bad-bg: #44201a;
    --info: #8fcbe9; --info-bg: #17303c; --shadow: none;
    --hero-a: #145f45; --hero-b: #0a3023;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);
  overflow-wrap: anywhere;
}
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.012em; }
h1 { font-size: 1.2rem; font-weight: 750; }
h2 { font-size: 1.1rem; font-weight: 720; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 .5rem; }
small, .muted { color: var(--muted); }
small { font-size: .86rem; }
b { font-weight: 680; }

/* ---------- estrutura ---------- */
.shell { display: block; }
.main { min-width: 0; }
.top {
  position: sticky; top: 0; z-index: 20; color: #fff; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 10px; }
.brand h1 { color: #fff; font-size: 1.05rem; }
.brand span { display: block; font-size: .78rem; opacity: .82; line-height: 1.2; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 16px 14px 0; }
#saveWarn { display: none; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; font-size: .92rem; }
#saveWarn.show { display: block; }

/* chip de nuvem */
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.12); color: #fff; font: inherit; font-size: .84rem; font-weight: 650; cursor: pointer; white-space: nowrap;
}
.chip:hover { background: rgba(255,255,255,.2); }
.chip.static { background: var(--surface2); color: var(--text); border-color: var(--line); cursor: default; }
.chip[hidden] { display: none; }
.chip.install { background: var(--corn); color: var(--corn-ink); border-color: transparent; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #9fb0a5; flex: 0 0 auto; }
.dot.ok { background: #5be29a; } .dot.pending { background: var(--corn); } .dot.offline { background: #c4cfc8; box-shadow: inset 0 0 0 2px #6f8377; }
.dot.syncing { background: #7cc4ee; animation: pulse 1.1s ease-in-out infinite; }
.dot.conflict, .dot.error, .dot.expired { background: #ff8d80; }
.chip.static .dot.offline { background: #8fa196; box-shadow: none; }
@keyframes pulse { 50% { opacity: .35; } }
.syncline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- avisos ---------- */
.banner { border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid; font-size: .95rem; }
.banner > div { flex: 1 1 220px; min-width: 0; }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.banner button { flex: 0 0 auto; }

/* ---------- cartões ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span2 { grid-column: 1 / -1; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; margin-bottom: 14px; }
.grid > .card { margin-bottom: 0; }
.card > h2 { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub { margin-bottom: 10px; }

/* cartão de destaque: quantas cestas dá para montar agora */
.card.hero {
  background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); border-color: transparent; color: #fff; position: relative; overflow: hidden; padding: 22px 20px;
}
.card.hero::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 190px; height: 190px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(244,183,61,.35), rgba(244,183,61,0) 70%); pointer-events: none;
}
.card.hero h2, .card.hero p, .card.hero b { color: #fff; }
.card.hero small, .card.hero .muted { color: rgba(255,255,255,.8); }
.card.hero .big { color: var(--corn); font-size: clamp(3.4rem, 14vw, 5rem); }
.card.hero .badge.ok, .card.hero .badge.warn, .card.hero .badge.bad, .card.hero .badge.info { background: rgba(255,255,255,.18); color: #fff; }
.card.hero .btn { background: var(--corn); color: var(--corn-ink); border-color: var(--corn); }

.big { font-size: 2.3rem; font-weight: 780; line-height: 1.05; letter-spacing: -.03em; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; min-width: 0; border: 1px solid var(--line); }
.kpi b { display: block; font-size: 1.12rem; font-weight: 740; letter-spacing: -.01em; }
.kpi span { font-size: .82rem; color: var(--muted); }
.kpi.bad b { color: var(--bad); } .kpi.ok b { color: var(--ok); }
.bar { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 12px 0 6px; }
.bar i { display: block; height: 100%; }
.bar .c { background: var(--corn); } .bar .p { background: var(--brand-2); }
.legend { display: flex; gap: 16px; font-size: .86rem; color: var(--muted); flex-wrap: wrap; }
.legend em { font-style: normal; }
.legend em::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.legend .c::before { background: var(--corn); } .legend .p::before { background: var(--brand-2); }

.badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .8rem; font-weight: 650; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }

/* ---------- formulários ---------- */
label { display: block; font-size: .9rem; font-weight: 650; margin: 0 0 5px; }
.field { margin-bottom: 12px; min-width: 0; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row.one { grid-template-columns: minmax(0, 1fr); }
.row.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 560px) { .row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 10px 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--line-strong);
  background: var(--surface); color: var(--text); font: inherit; font-size: 16px; transition: border-color .15s, box-shadow .15s;
}
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 24%, transparent); }
textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }
input[type=checkbox] { width: 22px; min-height: 22px; }
.btn {
  min-height: 48px; padding: 10px 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--brand); background: var(--brand); color: var(--brand-ink);
  font: inherit; font-weight: 680; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: filter .15s, transform .08s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.small { min-height: 44px; padding: 7px 14px; font-size: .92rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- listas ---------- */
.list { display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--surface); min-width: 0; }
.item .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.item .head b { min-width: 0; }
.parcel { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; border-top: 1px dashed var(--line-strong); }
.parcel:first-of-type { margin-top: 8px; }
.parcel .info { flex: 1 1 140px; min-width: 0; }
.parcel .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.stats div { background: var(--surface2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stats b { display: block; font-size: .98rem; } .stats span { font-size: .78rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); }
.cat { margin: 18px 0 8px; font-size: .88rem; letter-spacing: .01em; color: var(--brand); font-weight: 740; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line > span:first-child { min-width: 0; }
.line > span:last-child { text-align: right; flex: 0 0 auto; max-width: 55%; }
.check-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.check-row:last-child { border-bottom: 0; }
.check-row.bad { color: var(--bad); }
.msg { border-radius: var(--radius-sm); padding: 10px 14px; margin: 10px 0; font-size: .95rem; border: 1px solid; }
.msg.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.msg.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.msg.info { background: var(--info-bg); color: var(--info); border-color: var(--info); }
.msg.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.items-edit { display: grid; gap: 8px; }
.items-edit .ie { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 10px; align-items: center; }
.items-edit .ie span { min-width: 0; font-size: .95rem; }
.items-edit .ie small { display: block; }
.prow { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; background: var(--surface2); }
.prow .row { margin-top: 10px; }
.total { font-size: 1.2rem; font-weight: 760; text-align: right; margin: 8px 0; }
details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 650; }
.flow { display: grid; gap: 10px; }
.flow .m { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px; background: var(--surface2); }
.flow .m b { display: block; margin-bottom: 4px; }
.flow .m div { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .92rem; }

/* ---------- navegação: barra inferior no celular, lateral no computador ---------- */
.side { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -6px 20px -12px rgba(16,35,27,.25); }
.side-brand { display: none; }
nav.tabs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); }
nav.tabs button {
  position: relative; min-height: var(--nav-h); border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .72rem; font-weight: 650;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 6px 1px;
}
nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current=page] { color: var(--brand); }
nav.tabs button[aria-current=page] svg { stroke-width: 2.3; }
nav.tabs button[aria-current=page]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 4px 4px; background: var(--brand-2); }

@media (min-width: 900px) {
  body { padding-bottom: 32px; }
  .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); align-items: start; }
  .side { position: sticky; top: 0; height: 100vh; border-top: 0; border-right: 1px solid var(--line); box-shadow: none; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
  .side-brand svg { width: 40px; height: 40px; border-radius: 11px; }
  .side-brand b { display: block; font-size: 1.05rem; line-height: 1.15; }
  .side-brand small { font-size: .8rem; }
  nav.tabs { display: flex; flex-direction: column; gap: 4px; }
  nav.tabs button { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 48px; padding: 8px 14px; border-radius: var(--radius-sm); font-size: .98rem; text-align: left; }
  nav.tabs button:hover { background: var(--surface2); }
  nav.tabs button[aria-current=page] { background: var(--brand-soft); }
  nav.tabs button[aria-current=page]::before { content: none; }
  .top { background: transparent; color: var(--text); padding: 18px 28px 0; position: static; }
  .brand { display: none; }
  .top::before { content: ""; flex: 1; }
  .chip { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
  .chip:hover { background: var(--surface2); }
  .chip .dot.ok { background: var(--ok); } .chip .dot.offline { background: #8fa196; box-shadow: none; } .chip .dot.syncing { background: var(--info); }
  .chip .dot.conflict, .chip .dot.error, .chip .dot.expired { background: var(--bad); } .chip .dot.pending { background: #d99a12; }
  .wrap { padding: 14px 28px 0; }
}

#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #10231b; color: #fff; padding: 12px 18px; border-radius: 99px; font-size: .95rem; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 92vw; text-align: center; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); }
#toast.show { opacity: 1; transform: translateX(-50%); }
@media (min-width: 900px) { #toast { bottom: 28px; } }
@media (prefers-reduced-motion: reduce) { #toast, .btn, input, select { transition: none; } .dot.syncing { animation: none; } html { scroll-behavior: auto; } }
@media print { .side, .top, #toast { display: none !important; } body { padding: 0; } .card { box-shadow: none; } }

/* ---------- tela de entrada ---------- */
body.locked { padding-bottom: 0; }
body.locked .shell { display: none; }
#gate { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); }
#gate[hidden] { display: none; }
.gate-card { width: 100%; max-width: 400px; background: var(--surface); border-radius: 24px; padding: 28px 22px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); text-align: center; }
.gate-card img { border-radius: 20px; margin-bottom: 10px; }
.gate-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
.gate-card form { text-align: left; }
.btn.wide { width: 100%; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 16px 0 14px; background: var(--surface2); border-radius: var(--radius-sm); border: 1px solid var(--line); }
.seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 650; cursor: pointer; }
.seg button[aria-selected=true] { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
.gate-card .msg { text-align: left; }

</style>
</head>
<body>
<div id="gate" hidden></div>
<div class="shell">
  <aside class="side">
    <div class="side-brand"><img src="icons/favicon.svg" alt="" width="40" height="40"><div><b>Controle de Cestas</b><small>Estoque, vendas e parcelas</small></div></div>
    <nav class="tabs" id="tabs" aria-label="Seções do app"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <div class="brand"><img src="icons/favicon.svg" alt="" width="40" height="40"><div><h1>Controle de Cestas</h1><span>Estoque, compras, vendas e parcelas</span></div></div>
      <div class="top-actions">
        <button class="chip install" id="installBtn" type="button" hidden>Instalar app</button>
        <button class="chip" id="syncChip" type="button" data-act="go" data-tab="cadastros" aria-label="Nuvem"></button>
      </div>
    </header>
    <div class="wrap">
      <div id="saveWarn" role="alert"></div>
      <div id="alerts"></div>
      <main id="view"></main>
    </div>
  </div>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* Controle de Cestas - núcleo de cálculo (funções puras, sem DOM) */
(function (root) {
  'use strict';

  var TZ = 'America/Sao_Paulo';
  var EPS = 1e-9;

  /* ---------- utilidades ---------- */
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function round2(n) { n = num(n); return Math.round(n * 100 + (n >= 0 ? 1e-9 : -1e-9)) / 100; }
  function r6(n) { return Math.round(num(n) * 1e6) / 1e6; }
  function r3(n) { return Math.round(num(n) * 1e3) / 1e3; }
  function floorCov(x) { return Math.floor(x + EPS); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function today() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  }
  function parseISO(iso) { var p = String(iso).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function addDays(iso, n) {
    var p = String(iso).split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
  function validISO(iso) { return /^\d{4}-\d{2}-\d{2}$/.test(String(iso || '')); }

  /* aceita "1.234,56", "12,5" e "12.5" */

  /* ---------- padrões ---------- */
  var DEFAULT_SETTINGS = { price: 340, term: '30-60', target: 10, minCover: 4, costMode: 'last', riceKg: 12 };
  var TERMS = ['30-60', 'avista', '30', 'fiado'];
  var CATS = ['Alimentos', 'Limpeza e higiene'];

    return [
      p('p_arroz_pb', 'Arroz parboilizado (PB)', A, 'kg', 6, 1, '', 'arroz'),

      p('p_acucar', 'Açúcar', A, 'kg', 3),
      p('p_flocao', 'Flocão de milho 500 g', A, 'un', 3),

      p('p_tapioca', 'Goma de tapioca', A, 'kg', 1),
      p('p_cracker', 'Biscoito cream cracker', A, 'un', 1),
      p('p_maria', 'Biscoito Maria', A, 'un', 1),
      p('p_leite', 'Leite em pó Purelac 200 g', A, 'un', 2),
      p('p_cafe', 'Café moído 250 g', A, 'un', 2),
      p('p_macarrao', 'Macarrão espaguete 400 g', A, 'un', 2),
      p('p_sal', 'Sal refinado 1 kg', A, 'un', 1, 30, 'fardo de 30'),
      p('p_pimenta', 'Condimento pimenta', A, 'un', 1, 10, 'fardo de 10'),
      p('p_corante', 'Corante (colorau)', A, 'un', 1, 10, 'fardo de 10'),
      p('p_oleo', 'Óleo de soja 900 ml', A, 'un', 2),
      p('p_goiaba', 'Doce de goiaba 250 g', A, 'un', 1),
      p('p_margarina', 'Margarina 500 g', A, 'un', 1, 12, 'caixa de 12'),
      p('p_esponja', 'Esponja de lavar louça', L, 'un', 2, 80, 'caixa de 80'),
      p('p_sabao_po', 'Sabão em pó sachê 400 g', L, 'un', 1, 30, 'fardo de 30'),
      p('p_sabao_barra', 'Sabão em barra 450 g', L, 'un', 0.5),

  function newState() {
    return {
      settings: Object.assign({}, DEFAULT_SETTINGS),
      customers: [], suppliers: [], products: defaultProducts(),
      purchases: [], sales: [], adjustments: []
    };
  }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  /* ---------- migração de dados antigos ---------- */
  function normSettings(s) {
    var o = Object.assign({}, DEFAULT_SETTINGS, s || {});
    ['price', 'target', 'minCover', 'riceKg'].forEach(function (k) {
      var n = Number(o[k]);
      o[k] = isFinite(n) && n >= 0 ? n : DEFAULT_SETTINGS[k];
    });
    if (TERMS.indexOf(o.term) < 0) o.term = DEFAULT_SETTINGS.term;
    if (o.costMode !== 'avg' && o.costMode !== 'last') o.costMode = 'last';
    return o;
  }

  function normProduct(p) {
    var o = Object.assign({}, p);
    o.id = o.id || uid();
    o.name = String(o.name || 'Produto');
    o.cat = CATS.indexOf(o.cat) >= 0 ? o.cat : CATS[0];
    o.unit = o.unit === 'kg' ? 'kg' : 'un';
    o.perBasket = Math.max(0, num(o.perBasket));
    o.packSize = Math.max(1, num(o.packSize) || 1);
    o.packLabel = String(o.packLabel || '');
    if (!o.group && /arroz/i.test(o.name)) o.group = 'arroz';
    if (!o.group) delete o.group;
    return o;
  }

  function migrate(raw) {
    var st = raw && typeof raw === 'object' ? (raw.state && typeof raw.state === 'object' ? raw.state : raw) : {};
    var out = newState();
    out.settings = normSettings(st.settings);
    out.products = Array.isArray(st.products) && st.products.length ? st.products.map(normProduct) : defaultProducts();

    out.suppliers = (Array.isArray(st.suppliers) ? st.suppliers : []).map(function (s) {
      return { id: s.id || uid(), name: String(s.name || 'Fornecedor'), address: String(s.address || ''), phone: String(s.phone || ''), doc: String(s.doc || '') };
    });

    out.customers = (Array.isArray(st.customers) ? st.customers : []).map(function (c) {
      var mods = {};
      if (c.mods && typeof c.mods === 'object') Object.keys(c.mods).forEach(function (k) { mods[k] = Math.max(0, num(c.mods[k])); });
      return { id: c.id || uid(), name: String(c.name || 'Cliente'), phone: String(c.phone || ''), address: String(c.address || ''), note: String(c.note || ''), mods: mods };
    });

    out.purchases = (Array.isArray(st.purchases) ? st.purchases : []).map(function (pu) {
      return {
        id: pu.id || uid(), date: validISO(pu.date) ? pu.date : today(), supplierId: pu.supplierId || '', note: String(pu.note || ''),
        items: (Array.isArray(pu.items) ? pu.items : []).map(function (it) { return { pid: it.pid, qty: num(it.qty), total: round2(it.total) }; })
      };
    });

    out.adjustments = (Array.isArray(st.adjustments) ? st.adjustments : []).map(function (a) {
      return { id: a.id || uid(), pid: a.pid, delta: r6(a.delta), date: validISO(a.date) ? a.date : today(), note: String(a.note || '') };
    });

    var defItems = {};
    out.products.forEach(function (p) { if (p.perBasket > 0) defItems[p.id] = p.perBasket; });

    out.sales = (Array.isArray(st.sales) ? st.sales : []).map(function (s) {
      var sale = Object.assign({}, s);
      sale.id = sale.id || uid();
      sale.date = validISO(sale.date) ? sale.date : today();
      sale.qty = num(sale.qty) > 0 ? num(sale.qty) : 1;
      sale.price = sale.price != null && isFinite(Number(sale.price)) ? num(sale.price) : out.settings.price;
      if (!sale.items || typeof sale.items !== 'object' || Array.isArray(sale.items) || !Object.keys(sale.items).length) sale.items = Object.assign({}, defItems);
      else { var it = {}; Object.keys(sale.items).forEach(function (k) { it[k] = Math.max(0, num(sale.items[k])); }); sale.items = it; }
      sale.mods = Array.isArray(sale.mods) ? sale.mods : [];
      sale.parcels = (Array.isArray(sale.parcels) ? sale.parcels : []).map(function (p) {
        var q = { id: p.id || uid(), due: validISO(p.due) ? p.due : sale.date, amount: round2(p.amount), paid: !!p.paid, received: round2(p.received) };
        if (p.kind === 'entrada' || p.kind === 'avista') q.kind = p.kind;
        return q;
      });
      if (!sale.customerId || !byId(out.customers, sale.customerId)) {
        var nm = String(sale.customerName || sale.customer || sale.cliente || sale.name || '').trim();
        var found = null;
        if (nm) {
          out.customers.forEach(function (c) { if (c.name.toLowerCase() === nm.toLowerCase()) found = c; });
          if (!found) { found = { id: uid(), name: nm, phone: '', address: '', note: '', mods: {} }; out.customers.push(found); }
        }
        sale.customerId = found ? found.id : '';
      }
      if (!isFinite(Number(sale.costSnap)) || sale.costSnap === '' || sale.costSnap == null) sale.costSnap = 0;
      sale._needCost = !(s.costSnap != null && isFinite(Number(s.costSnap)));
      return sale;
    });

    out.sales.forEach(function (s) {
      if (s._needCost) s.costSnap = round2(basketCost(out, s.items).cost);
      delete s._needCost;
    });
    out.v = 1;
    delete out.v;
    return out;
  }

  /* ---------- estoque e cobertura ---------- */
  function derive(state) {
    var products = state.products || [];
    var bought = {}, sold = {}, adj = {}, stock = {};
    (state.purchases || []).forEach(function (pu) {
      (pu.items || []).forEach(function (it) { bought[it.pid] = (bought[it.pid] || 0) + num(it.qty); });
    });
    (state.sales || []).forEach(function (s) {
      var q = num(s.qty), items = s.items || {};
      Object.keys(items).forEach(function (pid) { sold[pid] = (sold[pid] || 0) + q * num(items[pid]); });
    });
    (state.adjustments || []).forEach(function (a) { adj[a.pid] = (adj[a.pid] || 0) + num(a.delta); });
    products.forEach(function (p) {
      bought[p.id] = r6(bought[p.id] || 0); sold[p.id] = r6(sold[p.id] || 0); adj[p.id] = r6(adj[p.id] || 0);
      stock[p.id] = r6(bought[p.id] - sold[p.id] + adj[p.id]);
    });
    var riceKg = num(state.settings.riceKg);
    var rice = products.filter(function (p) { return p.group === 'arroz'; });
    var groups = [];
    products.forEach(function (p) {
      if (p.group === 'arroz' || !(num(p.perBasket) > 0)) return;
      groups.push({ key: p.id, name: p.name, pids: [p.id], cov: floorCov(stock[p.id] / p.perBasket) });
    });
    if (rice.length && riceKg > 0) {
      var sum = rice.reduce(function (a, p) { return a + stock[p.id]; }, 0);
      groups.unshift({ key: 'arroz', name: 'Arroz', pids: rice.map(function (p) { return p.id; }), cov: floorCov(sum / riceKg) });
    }
    var covOf = {};
    groups.forEach(function (g) { g.pids.forEach(function (pid) { covOf[pid] = g.cov; }); });
    var total = groups.length ? Math.max(0, Math.min.apply(null, groups.map(function (g) { return g.cov; }))) : 0;
    var limiting = groups.filter(function (g) { return g.cov === Math.min.apply(null, groups.map(function (x) { return x.cov; })); });
    return { bought: bought, sold: sold, adj: adj, stock: stock, groups: groups, covOf: covOf, total: total, limiting: limiting };
  }

  function statusOf(cov, settings) {
    var m = num(settings.minCover);
    if (cov < m) return 'urgent';
    if (cov <= m + 2) return 'near';
    return 'ok';
  }

  /* ---------- custos ---------- */
  function unitCost(state, pid) {
    var lines = [];
    (state.purchases || []).forEach(function (pu, idx) {
      (pu.items || []).forEach(function (it) {
        if (it.pid === pid && num(it.qty) > 0) lines.push({ date: pu.date, idx: idx, qty: num(it.qty), total: num(it.total) });
      });
    });
    if (!lines.length) return null;
    if (state.settings.costMode === 'avg') {
      var q = 0, t = 0;
      lines.forEach(function (l) { q += l.qty; t += l.total; });
      return q > 0 ? t / q : null;
    }
    var best = lines[0];
    lines.forEach(function (l) { if (l.date > best.date || (l.date === best.date && l.idx > best.idx)) best = l; });
    var qq = 0, tt = 0;
    lines.forEach(function (l) { if (l.idx === best.idx) { qq += l.qty; tt += l.total; } });
    return qq > 0 ? tt / qq : null;
  }

  function defaultItems(state) {
    var o = {};
    state.products.forEach(function (p) { if (num(p.perBasket) > 0) o[p.id] = num(p.perBasket); });
    return o;
  }

  function basketCost(state, items) {
    items = items || defaultItems(state);
    var cost = 0, missing = [];
    Object.keys(items).forEach(function (pid) {
      var q = num(items[pid]);
      if (q <= 0) return;
      var c = unitCost(state, pid);
      if (c == null) missing.push(pid); else cost += q * c;
    });
    return { cost: cost, missing: missing };
  }

  /* ---------- reposição ---------- */
  function lastSupplier(state, pid) {
    var best = null;
    (state.purchases || []).forEach(function (pu, idx) {
      var has = (pu.items || []).some(function (it) { return it.pid === pid; });
      if (has && (!best || pu.date > best.date || (pu.date === best.date && idx > best.idx))) best = { date: pu.date, idx: idx, supplierId: pu.supplierId || '' };
    });
    return best ? best.supplierId : '';
  }

  function replenish(state, T, d) {
    d = d || derive(state);
    T = Math.max(0, num(T));
    var riceKg = num(state.settings.riceKg);
    var falta = {};
    state.products.forEach(function (p) {
      if (p.group === 'arroz' || !(num(p.perBasket) > 0)) return;
      falta[p.id] = Math.max(0, T * p.perBasket - d.stock[p.id]);
    });
    var rice = state.products.filter(function (p) { return p.group === 'arroz'; });
    if (rice.length && riceKg > 0) {
      var stockR = rice.reduce(function (a, p) { return a + d.stock[p.id]; }, 0);
      var grp = Math.max(0, T * riceKg - stockR);
      var soldSum = rice.reduce(function (a, p) { return a + d.sold[p.id]; }, 0);
      var pbSum = rice.reduce(function (a, p) { return a + num(p.perBasket); }, 0);
      rice.forEach(function (p) {
        var w = soldSum > 0 ? d.sold[p.id] / soldSum : (pbSum > 0 ? num(p.perBasket) / pbSum : 1 / rice.length);
        falta[p.id] = grp * w;
      });
    }
    var rows = [];
    state.products.forEach(function (p) {
      if (!(p.id in falta)) return;
      var f = falta[p.id];
      var row = { pid: p.id, name: p.name, unit: p.unit, falta: r3(f), qty: 0, packs: null, packLabel: p.packLabel || '', supplierId: '', unitCost: null, cost: 0 };
      if (f > EPS) {
        if (p.packSize > 1) { row.packs = Math.ceil(f / p.packSize - EPS); row.qty = row.packs * p.packSize; }
        else row.qty = r3(f);
        row.supplierId = lastSupplier(state, p.id);
        row.unitCost = unitCost(state, p.id);
        row.cost = round2(row.qty * (row.unitCost || 0));
      }
      rows.push(row);
    });
    var need = rows.filter(function (r) { return r.qty > 0; });
    var map = {};
    need.forEach(function (r) {
      var k = r.supplierId || '';
      if (!map[k]) map[k] = { supplierId: k, name: k ? ((byId(state.suppliers, k) || {}).name || 'Fornecedor removido') : 'Sem fornecedor definido', items: [], total: 0 };
      map[k].items.push(r); map[k].total = round2(map[k].total + r.cost);
    });
    var groups = Object.keys(map).map(function (k) { return map[k]; });
    groups.sort(function (a, b) { return a.name.localeCompare(b.name, 'pt-BR'); });
    var total = round2(need.reduce(function (a, r) { return a + r.cost; }, 0));
    var unknown = need.filter(function (r) { return r.unitCost == null; }).length;
    return { rows: rows, items: need, groups: groups, total: total, unknownCost: unknown };
  }

  /* ---------- parcelas ---------- */
  function recebido(p) { return round2(p.paid ? p.amount : Math.min(num(p.amount), num(p.received))); }
  function aberto(p) { return round2(num(p.amount) - recebido(p)); }
  function isOpen(p) { return aberto(p) > 0.004; }
  function isOverdue(p, hoje) { return isOpen(p) && p.due < (hoje || today()); }

  function allParcels(state) {
    var rows = [];
    (state.sales || []).forEach(function (s) {
      (s.parcels || []).forEach(function (p) { rows.push({ sale: s, parcel: p, customerId: s.customerId }); });
    });
    return rows;
  }

  function customerBalance(state, customerId, hoje) {
    var open = 0, late = 0, count = 0;
    allParcels(state).forEach(function (r) {
      if (r.customerId !== customerId || !isOpen(r.parcel)) return;
      var a = aberto(r.parcel);
      open += a; count++;
      if (isOverdue(r.parcel, hoje)) late += a;
    });
    return { open: round2(open), late: round2(late), count: count };
  }

  function lateSummary(state, hoje) {
    var count = 0, sum = 0;
    allParcels(state).forEach(function (r) {
      if (isOverdue(r.parcel, hoje)) { count++; sum += aberto(r.parcel); }
    });
    return { count: count, sum: round2(sum) };
  }

  /* abate primeiro as parcelas abertas mais antigas */
  function receiveForCustomer(state, customerId, value) {
    var rem = round2(value);
    if (!(rem > 0)) return { applied: 0, leftover: 0 };
    var rows = allParcels(state).filter(function (r) { return r.customerId === customerId && isOpen(r.parcel); });
    rows.sort(function (a, b) { return a.parcel.due < b.parcel.due ? -1 : a.parcel.due > b.parcel.due ? 1 : (a.sale.date < b.sale.date ? -1 : a.sale.date > b.sale.date ? 1 : 0); });
    var applied = 0;
    for (var i = 0; i < rows.length && rem > 0.004; i++) {
      var p = rows[i].parcel, open = aberto(p), use = round2(Math.min(open, rem));
      p.received = round2(num(p.received) + use);
      if (p.received >= p.amount - 0.004) { p.received = p.amount; p.paid = true; }
      rem = round2(rem - use); applied = round2(applied + use);
    }
    return { applied: applied, leftover: rem };
  }

  function receiveParcel(p) { p.paid = true; p.received = p.amount; }
  function undoParcel(p) { p.paid = false; p.received = 0; }

  function parcelStatus(p, hoje) {
    hoje = hoje || today();
    var out = [];
    if (!isOpen(p)) { out.push({ cls: 'ok', text: 'Recebida' }); return out; }
    if (recebido(p) > 0.004) out.push({ cls: 'warn', text: 'Parcial' });
    var d = daysBetween(hoje, p.due);
    if (d < 0) out.push({ cls: 'bad', text: 'Atrasada ' + (-d) + ' d' });
    else if (d === 0) out.push({ cls: 'warn', text: 'Vence hoje' });
    else out.push({ cls: 'info', text: 'em ' + d + ' d' });
    return out;
  }

  /* gera as parcelas de uma venda */
  function buildParcels(o) {
    var total = round2(o.total), term = o.term, date = o.date;
    var entrada = round2(isNaN(o.entrada) ? 0 : o.entrada);
    if (entrada < 0) return { error: 'A entrada não pode ser negativa.' };
    var parcels = [];
    function mk(due, amount, paid, kind) {
      var p = { id: uid(), due: due, amount: round2(amount), paid: paid, received: paid ? round2(amount) : 0 };
      if (kind) p.kind = kind;
      return p;
    }
    if (term === 'avista') {
      if (total > 0) parcels.push(mk(date, total, true, 'avista'));
      return { parcels: parcels };
    }
    if (entrada > total + 0.004) return { error: 'A entrada (' + money(entrada) + ') é maior que o total da venda (' + money(total) + ').' };
    if (entrada > 0.004) parcels.push(mk(date, entrada, true, 'entrada'));
    var rest = round2(total - entrada);
    if (rest <= 0.004) return { parcels: parcels };
    if (term === '30-60') {
      var p1 = Math.floor(rest * 100 / 2 + 1e-9) / 100, p2 = round2(rest - p1);
      parcels.push(mk(addDays(date, 30), p1, false));
      parcels.push(mk(addDays(date, 60), p2, false));
    } else if (term === '30') {
      parcels.push(mk(addDays(date, 30), rest, false));
    } else if (term === 'fiado') {
      if (!validISO(o.fiadoDue)) return { error: 'Informe o vencimento do fiado.' };
      parcels.push(mk(o.fiadoDue, rest, false));
    } else return { error: 'Prazo inválido.' };
    return { parcels: parcels };
  }

  /* ---------- venda ---------- */
  function isRice(p) { return p.group === 'arroz'; }

  function buildSaleItems(state, customer, riceMode) {
    var items = defaultItems(state);
    var rice = state.products.filter(isRice);
    if (customer && customer.mods) Object.keys(customer.mods).forEach(function (pid) { if (byId(state.products, pid)) items[pid] = num(customer.mods[pid]); });
    if (riceMode && riceMode !== 'mix') {
      rice.forEach(function (p) { items[p.id] = p.id === riceMode ? num(state.settings.riceKg) : 0; });
    }
    return items;
  }

  function diffMods(state, items) {
    var def = defaultItems(state), mods = [];
    state.products.forEach(function (p) {
      var a = num(def[p.id]), b = num(items[p.id]);
      if (Math.abs(a - b) > EPS) mods.push({ pid: p.id, de: a, para: b });
    });
    return mods;
  }

  function checkSale(state, qty, items, d) {
    d = d || derive(state);
    var errors = [], lines = [];
    state.products.forEach(function (p) {
      var per = num(items[p.id]);
      if (per <= 0) return;
      var need = r6(qty * per), have = d.stock[p.id];
      lines.push({ pid: p.id, name: p.name, unit: p.unit, need: need, have: have, ok: need <= have + 1e-9 });
    });
    var rice = state.products.filter(isRice);
    var riceKg = num(state.settings.riceKg);
    var riceSum = rice.reduce(function (a, p) { return a + num(items[p.id]); }, 0);
    var riceOk = !rice.length || Math.abs(riceSum - riceKg) < 1e-6;
    if (!riceOk) errors.push('O arroz da cesta deve somar ' + fnum(riceKg) + ' kg (hoje soma ' + fnum(riceSum) + ' kg).');

    var pr = buildParcels({ total: total, term: input.term, date: input.date, entrada: input.entrada, fiadoDue: input.fiadoDue });

  function saleTotal(s) { return round2(num(s.qty) * num(s.price)); }

  }

  function nextParcels(state, n) {

  }

  function alerts(state, d, hoje) {
    d = d || derive(state);

      state.sales.some(function (s) { return s.items && s.items[id] != null; }) ||

  var api = {

    num: num, round2: round2, r3: r3, uid: uid, today: today, addDays: addDays, daysBetween: daysBetween, validISO: validISO,

    defaultProducts: defaultProducts, newState: newState, byId: byId, migrate: migrate,
    derive: derive, statusOf: statusOf, unitCost: unitCost, defaultItems: defaultItems, basketCost: basketCost,
    replenish: replenish, lastSupplier: lastSupplier,
    recebido: recebido, aberto: aberto, isOpen: isOpen, isOverdue: isOverdue, allParcels: allParcels,
    customerBalance: customerBalance, lateSummary: lateSummary, receiveForCustomer: receiveForCustomer,
    receiveParcel: receiveParcel, undoParcel: undoParcel, parcelStatus: parcelStatus, buildParcels: buildParcels,
    isRice: isRice, buildSaleItems: buildSaleItems, diffMods: diffMods, checkSale: checkSale, makeSale: makeSale,
    saleTotal: saleTotal, saleProfit: saleProfit, cash: cash, monthlyFlow: monthlyFlow, nextParcels: nextParcels,

(function (root) {

  var st = { code: 'off', msg: '' };

  }

  /* ---------- HTTP ---------- */

    return req('PATCH', path, { token: tk, body: body, prefer: 'return=representation' }).then(function (r) {

  }

    if (e.status === 413 || code === '23514') return 'Os dados passaram do limite de tamanho aceito pela nuvem.';

  }

  /* ---------- API pública ---------- */

})(window);

      var ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      var ok = false; try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta); toast(ok ? 'Copiado!' : 'Não foi possível copiar.');
    }
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(function () { toast('Copiado!'); }, fallback);
    else fallback();

  /* ---------- persistência ---------- */
  /* primeira abertura (sem dados salvos): começa vazio; os dados vêm da nuvem ou de Cadastros → Backup */
  function firstRunState() { return E.newState(); }
  function load() {
    var raw = null;
    try { raw = localStorage.getItem(KEY); } catch (e) { setTimeout(function () { warnSave('O navegador bloqueou o armazenamento local. Seus dados não serão salvos.'); }, 0); }
    if (!raw) return firstRunState();
    hadSaved = true;
    try { return E.migrate(JSON.parse(raw)); }
    catch (e) {
      try { localStorage.setItem(KEY + ':backup', raw); } catch (e2) { /* ignore */ }
      setTimeout(function () { warnSave('Os dados salvos estavam ilegíveis. Uma cópia foi guardada e o app começou vazio.'); }, 0);
      return E.newState();
    }
  }
  function warnSave(t) { var el = $('#saveWarn'); el.textContent = t || ''; el.classList.toggle('show', !!t); }
  function writeNow() {
    try { localStorage.setItem(KEY, JSON.stringify({ v: 1, state: S })); warnSave(''); }
    catch (e) { warnSave('Não foi possível salvar agora. Exporte os dados em Cadastros para não perder nada.'); }
  }
  function save() { clearTimeout(saveTimer); saveTimer = setTimeout(writeNow, 350); if (window.Sync) window.Sync.changed(); }
  function flush() { if (saveTimer) { clearTimeout(saveTimer); saveTimer = null; writeNow(); } }
  function commit() { save(); render(); }

  /* ---------- sincronização (interface) ---------- */
  var SYNC_LABEL = { off: 'Entrar', ok: 'Sincronizado', pending: 'Pendente', offline: 'Sem internet', syncing: 'Sincronizando', conflict: 'Conflito', error: 'Falha na nuvem', expired: 'Entrar de novo' };
  function ago(ms) {
    if (!ms) return 'ainda não sincronizou';
    var m = Math.round((Date.now() - ms) / 60000);
    if (m < 1) return 'agora há pouco';
    if (m < 60) return 'há ' + m + ' min';
    var h = Math.round(m / 60); if (h < 24) return 'há ' + h + ' h';
    return 'em ' + new Date(ms).toLocaleDateString('pt-BR');
  }
  function chipHTML() {

    var s = window.Sync.status(), h = '<h2>Conta e nuvem</h2>';

        '<div class="actions"><button class="btn" data-act="leave-guest">Entrar na conta</button></div>';
    }
    h += '<div class="syncline"><span class="chip static ' + s.code + '">' + chipHTML() + '</span><small>' + esc(s.email) + '</small></div>';
    var note = s.msg;
    if (!note) {
      if (s.code === 'offline') note = 'Sem internet. ' + (s.dirty ? 'As alterações estão salvas aqui e serão enviadas quando a conexão voltar.' : 'Você pode continuar usando o app normalmente.');
      else if (s.code === 'pending') note = 'Há alterações para enviar. O envio é automático.';
      else if (s.code === 'ok') note = 'Tudo enviado (' + ago(s.last) + ').';

      '<div class="bar" role="img" aria-label="Custo ' + Math.round(cPct) + '% e lucro ' + Math.round(100 - cPct) + '% do preço"><i class="c" style="width:' + cPct + '%"></i><i class="p" style="width:' + (100 - cPct) + '%"></i></div>' +

  function submitCust() {
    var cd = ui.cust, name = cd.name.trim();

    var dup = S.customers.some(function (c) { return c.id !== cd.id && c.name.toLowerCase() === name.toLowerCase(); });

      var v = String(cd.modsStr[pid]).trim(); if (v === '') return;

      mods[pid] = n;

    var rec = cd.id ? E.byId(S.customers, cd.id) : null;
    if (rec) { rec.name = name; rec.phone = cd.phone.trim(); rec.address = cd.address.trim(); rec.note = cd.note.trim(); rec.mods = mods; }
    else S.customers.push({ id: E.uid(), name: name, phone: cd.phone.trim(), address: cd.address.trim(), note: cd.note.trim(), mods: mods });

  }

    d.rows.forEach(function (r, i) {

      if (empty && d.rows.length > 1) return;
      var qty = E.parseNum(r.qty), total = E.parseNum(r.total), pid = r.pid;

      if (pid === '__new') {
        var nm = r.newName.trim();

        var ex = S.products.filter(function (p) { return p.name.toLowerCase() === nm.toLowerCase(); })[0] || newProds.filter(function (p) { return p.name.toLowerCase() === nm.toLowerCase(); })[0];

      '<div id="supMsg">' + msgHTML('sup') + '</div><div class="actions"><button type="submit" class="btn">' + (sd.id ? 'Salvar' : 'Cadastrar fornecedor') + '</button>' + (sd.id ? '<button type="button" class="btn ghost" data-act="cancel-sup">Cancelar</button>' : '') + '</div></form></section>';

    h += '<section class="card"><h2>Produtos</h2>';

      var ps = S.products.filter(function (p) { return p.cat === cat; });
      if (!ps.length) return;

      '<div class="row"><div class="field"><label for="p-cat">Categoria</label><select id="p-cat" data-bind="prod.cat">' + E.CATS.map(function (c) { return '<option' + (pd.cat === c ? ' selected' : '') + '>' + c + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="p-unit">Unidade</label><select id="p-unit" data-bind="prod.unit"><option value="un"' + (pd.unit === 'un' ? ' selected' : '') + '>un</option><option value="kg"' + (pd.unit === 'kg' ? ' selected' : '') + '>kg</option></select></div></div>' +
      '<div class="row three"><div class="field"><label for="p-per">Qtd por cesta</label><input id="p-per" type="text" inputmode="decimal" data-bind="prod.perBasket" value="' + esc(pd.perBasket) + '"></div>' +
      '<div class="field"><label for="p-pack">Itens por embalagem</label><input id="p-pack" type="text" inputmode="numeric" data-bind="prod.packSize" value="' + esc(pd.packSize) + '"></div>' +
      '<div class="field"><label for="p-label">Nome da embalagem</label><input id="p-label" type="text" placeholder="fardo de 30" data-bind="prod.packLabel" value="' + esc(pd.packLabel) + '"></div></div>' +
      '<div class="field"><label for="p-group">Grupo</label><select id="p-group" data-bind="prod.group"><option value="">Nenhum</option><option value="arroz"' + (pd.group === 'arroz' ? ' selected' : '') + '>Arroz (um tipo ou outro por cesta)</option></select></div>' +
      '<div id="prodMsg">' + msgHTML('prod') + '</div><div class="actions"><button type="submit" class="btn">' + (pd.id ? 'Salvar' : 'Cadastrar produto') + '</button>' + (pd.id ? '<button type="button" class="btn ghost" data-act="cancel-prod">Cancelar</button>' : '') + '</div></form></section>';

    h += '<section class="card"><h2>Configurações</h2><form id="setForm" novalidate>' +
      '<div class="row"><div class="field"><label for="st-price">Preço da cesta (R$)</label><input id="st-price" type="text" inputmode="decimal" value="' + fin(st.price) + '"></div>' +
      '<div class="field"><label for="st-term">Prazo padrão</label><select id="st-term">' + [['30-60', '30 e 60 dias'], ['avista', 'À vista'], ['30', '30 dias'], ['fiado', 'Fiado']].map(function (o) { return '<option value="' + o[0] + '"' + (st.term === o[0] ? ' selected' : '') + '>' + o[1] + '</option>'; }).join('') + '</select></div></div>' +
      '<div class="row three"><div class="field"><label for="st-target">Meta de estoque (cestas)</label><input id="st-target" type="text" inputmode="decimal" value="' + fin(st.target) + '"></div>' +
      '<div class="field"><label for="st-min">Mínimo (cestas)</label><input id="st-min" type="text" inputmode="decimal" value="' + fin(st.minCover) + '"></div>' +
      '<div class="field"><label for="st-rice">Kg de arroz por cesta</label><input id="st-rice" type="text" inputmode="decimal" value="' + fin(st.riceKg) + '"></div></div>' +
      '<div class="field"><label for="st-cost">Custo unitário</label><select id="st-cost"><option value="last"' + (st.costMode === 'last' ? ' selected' : '') + '>Última compra</option><option value="avg"' + (st.costMode === 'avg' ? ' selected' : '') + '>Média de todas as compras</option></select></div>' +
      '<div id="setMsg">' + msgHTML('set') + '</div><div class="actions"><button type="submit" class="btn">Salvar configurações</button></div></form></section>';

    h += '<section class="card"><h2>Backup dos dados</h2><p class="sub"><small>Exporte para guardar uma cópia ou levar os dados a outro aparelho. Importar substitui tudo o que está salvo aqui.</small></p>' +
      '<div class="field"><label for="bk-text">Dados em JSON</label><textarea id="bk-text" spellcheck="false">' + esc(ui.exportText) + '</textarea></div><div id="bkMsg">' + msgHTML('bk') + '</div>' +
      '<div class="actions"><button class="btn" data-act="export">Exportar</button><button class="btn ghost" data-act="download">Baixar arquivo</button><button class="btn danger" data-act="import" data-label="Importar dados">Importar dados</button></div></section>';
    return h;

  function submitSup() {
    var sd = ui.sup, name = sd.name.trim();
    if (!name) { setMsg('sup', 'bad', 'Informe o nome do fornecedor.'); $('#supMsg').innerHTML = msgHTML('sup'); return; }
    var rec = sd.id ? E.byId(S.suppliers, sd.id) : null, data = { name: name, address: sd.address.trim(), phone: sd.phone.trim(), doc: sd.doc.trim() };
    if (rec) Object.assign(rec, data); else S.suppliers.push(Object.assign({ id: E.uid() }, data));
    setMsg('sup', null); ui.sup = null; toast('Fornecedor salvo.'); commit();
  }
  function submitProd() {
    var pd = ui.prod, name = pd.name.trim(), errs = [];
    if (!name) errs.push('Informe o nome do produto.');
    var per = pd.perBasket === '' ? 0 : E.parseNum(pd.perBasket), pack = pd.packSize === '' ? 1 : E.parseNum(pd.packSize);
    if (isNaN(per) || per < 0) errs.push('Quantidade por cesta inválida.');
    if (isNaN(pack) || pack < 1) errs.push('Itens por embalagem deve ser 1 ou mais.');
    if (S.products.some(function (p) { return p.id !== pd.id && p.name.toLowerCase() === name.toLowerCase(); })) errs.push('Já existe um produto com esse nome.');
    if (errs.length) { setMsg('prod', 'bad', errs); $('#prodMsg').innerHTML = msgHTML('prod'); return; }
    var data = { name: name, cat: pd.cat, unit: pd.unit, perBasket: per, packSize: pack, packLabel: pd.packLabel.trim() };
    var rec = pd.id ? E.byId(S.products, pd.id) : null;
    if (rec) { Object.assign(rec, data); if (pd.group) rec.group = pd.group; else delete rec.group; }
    else { var np = Object.assign({ id: E.uid() }, data); if (pd.group) np.group = pd.group; S.products.push(np); }
    setMsg('prod', null); ui.prod = null; toast('Produto salvo.'); commit();
  }
  function submitSettings() {
    function v(id) { return E.parseNum($('#' + id).value); }
    var price = v('st-price'), target = v('st-target'), min = v('st-min'), rice = v('st-rice'), errs = [];
    if (isNaN(price) || price < 0) errs.push('Preço inválido.');
    if (isNaN(target) || target < 0) errs.push('Meta inválida.');
    if (isNaN(min) || min < 0) errs.push('Mínimo inválido.');
    if (isNaN(rice) || rice <= 0) errs.push('Kg de arroz por cesta deve ser maior que zero.');
    if (errs.length) { setMsg('set', 'bad', errs); $('#setMsg').innerHTML = msgHTML('set'); return; }
    S.settings = { price: E.round2(price), term: $('#st-term').value, target: target, minCover: min, costMode: $('#st-cost').value, riceKg: rice };
    ui.planT = null; setMsg('set', 'ok', 'Configurações salvas.'); toast('Configurações salvas.'); commit();
  }

  /* ---------- exclusões ---------- */
  function doDelete(kind, id) {
    if (kind === 'sale') S.sales = S.sales.filter(function (s) { return s.id !== id; });
    else if (kind === 'purchase') S.purchases = S.purchases.filter(function (p) { return p.id !== id; });
    else if (kind === 'customer') {
      if (!E.canDeleteCustomer(S, id)) { toast('Este cliente tem vendas e não pode ser excluído.'); return; }
      S.customers = S.customers.filter(function (c) { return c.id !== id; });
      if (ui.cust && ui.cust.id === id) ui.cust = null;
    } else if (kind === 'supplier') {
      if (E.supplierUsed(S, id)) { toast('Este fornecedor tem compras e não pode ser excluído.'); return; }
      S.suppliers = S.suppliers.filter(function (s) { return s.id !== id; });
    } else if (kind === 'product') {
      if (E.productUsed(S, id)) { toast('Este produto já tem compras, vendas ou ajustes e não pode ser excluído.'); return; }
      S.products = S.products.filter(function (p) { return p.id !== id; });
      if (ui.sale) ui.sale = null;
    }
    toast('Excluído.'); commit();
  }

  /* ---------- render ---------- */
  function render() {
    var d = E.derive(S), h;
    $('#alerts').innerHTML = alertsHTML(d);
    if (ui.tab === 'painel') h = viewPainel(d);
    else if (ui.tab === 'vendas') h = viewVendas();
    else if (ui.tab === 'clientes') h = viewClientes();
    else if (ui.tab === 'compras') h = viewCompras();
    else if (ui.tab === 'estoque') h = viewEstoque(d);
    else h = viewCadastros();
    $('#view').innerHTML = h;
    $('#tabs').innerHTML = TABS.map(function (t) {
      return '<button data-act="go" data-tab="' + t[0] + '"' + (ui.tab === t[0] ? ' aria-current="page"' : '') + '><svg viewBox="0 0 24 24" aria-hidden="true">' + t[2] + '</svg>' + t[1] + '</button>';
    }).join('');
    document.title = 'Controle de Cestas';
    refreshSyncUI();
  }

  /* ---------- eventos ---------- */
  function setPath(path, value) {
    var p = path.split('.'); ui[p[0]][p[1]] = value;
  }

  document.addEventListener('submit', function (e) {
    e.preventDefault();
    var id = e.target.id;
    if (id === 'saleForm') submitSale();
    else if (id === 'custFormEl') submitCust();
    else if (id === 'purchForm') submitPurch();
    else if (id === 'supForm') submitSup();
    else if (id === 'prodForm') submitProd();
    else if (id === 'setForm') submitSettings();
    else if (id === 'adjForm') submitAdj();
    else if (id === 'loginForm') submitLogin();
    else if (id === 'signupForm') submitSignup();
  });

  function submitLogin() {
    var mail = $('#g-mail').value.trim(), pass = $('#g-pass').value;
    if (!mail || !pass) { setMsg('login', 'bad', 'Informe e-mail e senha.'); return refreshSyncUI(); }
    var btn = $('#loginForm button'); btn.disabled = true; btn.textContent = 'Entrando…';
    window.Sync.login(mail, pass).then(function (r) {
      setMsg('login', r.ok ? null : 'bad', r.ok ? '' : r.error);
      if (r.ok) toast('Bem-vindo!');
      gateSig = null; refreshSyncUI(); render();
    });
  }
  function submitSignup() {
    var mail = $('#g-mail').value.trim(), pass = $('#g-pass').value, pass2 = $('#g-pass2').value;
    var err = !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(mail) ? 'Informe um e-mail válido.' : pass.length < 8 ? 'A senha precisa ter pelo menos 8 caracteres.' : pass !== pass2 ? 'As senhas não são iguais.' : null;
    if (err) { setMsg('login', 'bad', err); gateSig = null; return refreshSyncUI(); }
    var btn = $('#signupForm button'); btn.disabled = true; btn.textContent = 'Criando…';
    window.Sync.signup(mail, pass).then(function (r) {
      if (r.ok && r.confirm) { ui.gateMode = 'login'; setMsg('login', 'ok', 'Conta criada. Enviamos um e-mail de confirmação para ' + mail + '. Confirme e depois entre.'); }
      else setMsg('login', r.ok ? null : 'bad', r.ok ? '' : r.error);
      if (r.ok && !r.confirm) toast('Conta criada. Bem-vindo!');
      gateSig = null; refreshSyncUI(); render();
    });
  }

  function submitAdj() {
    var a = ui.adj, p = prod(a.pid), c = E.parseNum(a.counted);
    var err = !p ? 'Escolha o produto.' : (isNaN(c) || c < 0) ? 'Informe a quantidade contada (zero ou mais).' : null;
    if (err) { setMsg('adj', 'bad', err); $('#adjMsg').innerHTML = msgHTML('adj'); return; }
    var cur = E.derive(S).stock[a.pid], delta = Math.round((c - cur) * 1e6) / 1e6;
    if (Math.abs(delta) < 1e-9) { setMsg('adj', 'info', 'A contagem é igual ao estoque do sistema. Nada a ajustar.'); $('#adjMsg').innerHTML = msgHTML('adj'); return; }
    S.adjustments.push({ id: E.uid(), pid: a.pid, delta: delta, date: E.today(), note: a.note.trim() });
    setMsg('adj', null); ui.adj = { pid: a.pid, counted: '', note: '' }; toast('Ajuste gravado.'); commit();
  }

  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-act]'); if (!b) return;
    var act = b.dataset.act;
    if (act === 'go') return go(b.dataset.tab);
    if (act === 'gate-mode') { ui.gateMode = b.dataset.mode; setMsg('login', null); gateSig = null; return refreshSyncUI(); }
    if (act === 'guest') { ui.guest = true; setMsg('login', null); gateSig = null; return render(); }
    if (act === 'leave-guest') { ui.guest = false; gateSig = null; return render(); }
    if (act === 'sync-now') { window.Sync.syncNow(); return; }
    if (act === 'sync-logout') { window.Sync.logout(); ui.guest = false; gateSig = null; toast('Você saiu. Os dados continuam neste aparelho.'); return render(); }
    if (act === 'sync-cloud' || act === 'sync-local') { window.Sync.resolve(act === 'sync-cloud' ? 'cloud' : 'local'); return refreshSyncUI(); }
    if (act === 'recv-parcel' || act === 'undo-parcel') {
      var sale = E.byId(S.sales, b.dataset.sale), p = sale && E.byId(sale.parcels, b.dataset.parcel);
      if (p) { act === 'recv-parcel' ? E.receiveParcel(p) : E.undoParcel(p); toast(act === 'recv-parcel' ? 'Recebimento registrado.' : 'Recebimento desfeito.'); commit(); }
      return;
    }
    if (act === 'recv-customer') {
      var inp = $('#rc-' + b.dataset.id), v = E.parseNum(inp.value), box = $('#rcmsg-' + b.dataset.id);
      if (isNaN(v) || v <= 0) { box.innerHTML = '<div class="msg bad">Informe um valor maior que zero.</div>'; return; }
      var bal = E.customerBalance(S, b.dataset.id, E.today());
      if (v > bal.open + 0.004) { box.innerHTML = '<div class="msg bad">O valor passa do saldo em aberto (' + E.money(bal.open) + ').</div>'; return; }
      var r = E.receiveForCustomer(S, b.dataset.id, v); toast(E.money(r.applied) + ' abatidos das parcelas mais antigas.'); return commit();
    }
    if (act === 'del') {
      if (b.dataset.armed) { return doDelete(b.dataset.kind, b.dataset.id); }
      b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = 'Confirmar exclusão';
      setTimeout(function () { if (b.isConnected && b.dataset.armed) { delete b.dataset.armed; b.classList.remove('armed'); b.textContent = b.dataset.label; } }, 4000);
      return;
    }
    if (act === 'copy-basket') return copyText(basketText(ui.sale.items));
    if (act === 'copy-repl') {
      var d = E.derive(S);
      if (b.dataset.kind === 'min') return copyText(replText(E.replenish(S, S.settings.minCover, d), 'Reposição urgente'));
      return copyText(replText(E.replenish(S, planT(), d), 'Reposição de estoque (meta ' + fin(planT()) + ' cestas)'));
    }
    if (act === 'edit-cust') { ui.cust = custDraftFrom(E.byId(S.customers, b.dataset.id)); render(); var f = $('#custForm'); if (f) f.scrollIntoView(); return; }
    if (act === 'cancel-cust') { ui.cust = null; setMsg('cust', null); return render(); }
    if (act === 'edit-sup') { var s = E.byId(S.suppliers, b.dataset.id); ui.sup = { id: s.id, name: s.name, address: s.address, phone: s.phone, doc: s.doc }; render(); return $('#supForm').scrollIntoView(); }
    if (act === 'cancel-sup') { ui.sup = null; return render(); }
    if (act === 'edit-prod') { var pr = prod(b.dataset.id); ui.prod = { id: pr.id, name: pr.name, cat: pr.cat, unit: pr.unit, perBasket: fin(pr.perBasket), packSize: fin(pr.packSize), packLabel: pr.packLabel, group: pr.group || '' }; render(); return $('#prodForm').scrollIntoView(); }
    if (act === 'cancel-prod') { ui.prod = null; return render(); }
    if (act === 'add-row') { ui.purch.rows.push({ pid: '', qty: '', total: '', newName: '', newUnit: 'un', newCat: E.CATS[0] }); $('#purchRows').innerHTML = purchRowsHTML(); return; }
    if (act === 'rm-row') { ui.purch.rows.splice(Number(b.dataset.i), 1); $('#purchRows').innerHTML = purchRowsHTML(); $('#purchTotal').textContent = 'Total: ' + E.money(purchTotal()); return; }
    if (act === 'undo-adj') { S.adjustments = S.adjustments.filter(function (a) { return a.id !== b.dataset.id; }); toast('Ajuste desfeito.'); return commit(); }
    if (act === 'export') { ui.exportText = JSON.stringify({ v: 1, state: S }, null, 2); setMsg('bk', 'ok', 'Dados exportados abaixo. Copie o texto ou baixe o arquivo.'); return render(); }
    if (act === 'download') {
      var blob = new Blob([JSON.stringify({ v: 1, state: S }, null, 2)], { type: 'application/json' }), a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'controle-cestas-' + E.today() + '.json'; document.body.appendChild(a); a.click();
      setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500); return;
    }
    if (act === 'import') {
      if (!b.dataset.armed) {
        b.dataset.armed = '1'; b.classList.add('armed'); b.textContent = 'Confirmar importação';
        setTimeout(function () { if (b.isConnected && b.dataset.armed) { delete b.dataset.armed; b.classList.remove('armed'); b.textContent = b.dataset.label; } }, 4000);
        return;
      }
      var txt = $('#bk-text').value.trim(), parsed;
      try { parsed = JSON.parse(txt); if (!parsed || typeof parsed !== 'object') throw new Error('x'); } catch (er) { setMsg('bk', 'bad', 'O texto não é um JSON válido.'); return render(); }
      S = E.migrate(parsed); ui.sale = ui.purch = ui.cust = ui.sup = ui.prod = ui.adj = null; ui.exportText = '';
      setMsg('bk', 'ok', 'Dados importados.'); toast('Dados importados.'); return commit();
    }
  });

  document.addEventListener('input', function (e) {
    var t = e.target;
    if (t.id === 'plan-t') { ui.planT = t.value; $('#planOut').innerHTML = planHTML(E.derive(S)); return; }
    if (t.dataset.item) { ui.sale.items[t.dataset.item] = Math.max(0, E.num(E.parseNum(t.value))); refreshSaleDyn(); return; }
    if (t.dataset.cmod) { ui.cust.modsStr[t.dataset.cmod] = t.value; return; }
    if (t.dataset.row != null) {
      var r = ui.purch.rows[Number(t.dataset.row)]; r[t.dataset.f] = t.value;
      if (t.dataset.f === 'qty' || t.dataset.f === 'total') $('#purchTotal').textContent = 'Total: ' + E.money(purchTotal());
      return;
    }
    if (t.dataset.bind && t.tagName !== 'SELECT') {
      setPath(t.dataset.bind, t.value);
      if (t.dataset.bind === 'sale.qty' || t.dataset.bind === 'sale.price' || t.dataset.bind === 'sale.entrada' || t.dataset.bind === 'sale.fiadoDue' || t.dataset.bind === 'sale.date') refreshSaleDyn();
    }
  });

  document.addEventListener('change', function (e) {
    var t = e.target;
    if (t.dataset.row != null && t.tagName === 'SELECT') {
      ui.purch.rows[Number(t.dataset.row)][t.dataset.f] = t.value;
      if (t.dataset.f === 'pid') $('#purchRows').innerHTML = purchRowsHTML();
      return;
    }
    if (!t.dataset.bind) return;
    var path = t.dataset.bind;
    setPath(path, t.value);
    if (path === 'sale.customerId') {
      var c = E.byId(S.customers, t.value);
      ui.sale.items = E.buildSaleItems(S, c, null); ui.sale.rice = detectRice(ui.sale.items);
      var nb = $('#newNameBox'); if (nb) nb.hidden = !!t.value;
      refreshSaleItems();
    } else if (path === 'sale.rice') {
      var rice = S.products.filter(E.isRice);
      rice.forEach(function (p) { ui.sale.items[p.id] = t.value === 'mix' ? E.num(p.perBasket) : (p.id === t.value ? E.num(S.settings.riceKg) : 0); });
      refreshSaleItems();
    } else if (path === 'sale.term') {
      $('#fiadoBox').hidden = t.value !== 'fiado'; $('#entradaBox').hidden = t.value === 'avista'; refreshSaleDyn();
    } else if (path === 'sale.date') refreshSaleDyn();
    else if (path === 'adj.pid') render();
  });

  window.addEventListener('pagehide', flush);
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'hidden') flush(); });

  S = load();
  if (window.Sync) window.Sync.init({ getState: function () { return S; }, applyRemote: applyRemote, hadSavedData: hadSaved, onChange: refreshSyncUI });
  else window.Sync = { status: function () { return { code: 'off', signedIn: false }; }, changed: function () {}, init: function () {} };
  try { var qt = new URLSearchParams(location.search).get('tab'); if (qt && TABS.some(function (t) { return t[0] === qt; })) ui.tab = qt; } catch (e) { /* ignore */ }
  render();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* ignore */ }
  var deferredInstall = null;
  window.addEventListener('beforeinstallprompt', function (ev) { ev.preventDefault(); deferredInstall = ev; var b = $('#installBtn'); if (b) b.hidden = false; });
  window.addEventListener('appinstalled', function () { deferredInstall = null; var b = $('#installBtn'); if (b) b.hidden = true; toast('App instalado.'); });
  var ib = $('#installBtn'); if (ib) ib.addEventListener('click', function () { if (deferredInstall) { deferredInstall.prompt(); deferredInstall = null; ib.hidden = true; } });
  window.__app = { get state() { return S; }, render: render, go: go, commit: commit };
})();

</script>
<script>
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', function () { navigator.serviceWorker.register('./sw.js').catch(function () {}); });
}
</script>
</body>
