<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b5e43" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0a3023" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Estoque, compras, vendas e parcelas de cestas básicas. Funciona sem internet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FeiraUP">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>FeiraUP</title>
<script>try{var th=localStorage.getItem('controle-cestas:theme');if(th==='dark'||th==='light')document.documentElement.dataset.theme=th;}catch(e){}</script>
<style>
/* Controle de Cestas — tema "pinheiro e milho": verde-escuro profundo, amarelo de milho como único destaque */
:root {
  --bg: #eef3ee; --surface: #ffffff; --surface2: #f3f7f3; --text: #10231b; --muted: #556a5f;
  --line: #d9e3db; --line-strong: #bccabf;
  --brand: #0b5e43; --brand-2: #12805a; --brand-ink: #ffffff; --brand-soft: #dcefe4;
  --corn: #f4b73d; --corn-ink: #2b1d00;
  --ok: #0f7a4f; --ok-bg: #dcf1e5; --warn: #7a4e00; --warn-bg: #fdf0cc; --bad: #b3261e; --bad-bg: #fde4e1;
  --info: #1f5a78; --info-bg: #e0eff7;
  --shadow: 0 1px 2px rgba(16, 35, 27, .06), 0 6px 18px -8px rgba(16, 35, 27, .14);
  --radius: 18px; --radius-sm: 12px; --nav-h: 68px; --side-w: 244px;
  --hero-a: #0f7650; --hero-b: #073d2c;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme=light]) {
    color-scheme: dark;
    --bg: #0c1611; --surface: #14231b; --surface2: #1a2d22; --text: #e8f1ea; --muted: #9bb2a2;
    --line: #27402f; --line-strong: #38573f;
    --brand: #4fc88a; --brand-2: #4fc88a; --brand-ink: #062213; --brand-soft: #1b3a29;
    --corn: #f4b73d; --corn-ink: #2b1d00;
    --ok: #74dba1; --ok-bg: #1b3b29; --warn: #f2c870; --warn-bg: #3a2e10; --bad: #ff9d92; --bad-bg: #44201a;
    --info: #8fcbe9; --info-bg: #17303c; --shadow: none;
    --hero-a: #145f45; --hero-b: #0a3023;
  }
}
:root[data-theme=dark] {
  color-scheme: dark;
  --bg: #0c1611; --surface: #14231b; --surface2: #1a2d22; --text: #e8f1ea; --muted: #9bb2a2;
    --line: #27402f; --line-strong: #38573f;
    --brand: #4fc88a; --brand-2: #4fc88a; --brand-ink: #062213; --brand-soft: #1b3a29;
    --corn: #f4b73d; --corn-ink: #2b1d00;
    --ok: #74dba1; --ok-bg: #1b3b29; --warn: #f2c870; --warn-bg: #3a2e10; --bad: #ff9d92; --bad-bg: #44201a;
    --info: #8fcbe9; --info-bg: #17303c; --shadow: none;
    --hero-a: #145f45; --hero-b: #0a3023;
}
:root[data-theme=light] { color-scheme: light; }
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 16px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  font-variant-numeric: tabular-nums; -webkit-font-smoothing: antialiased;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 20px);
  overflow-wrap: anywhere;
}
h1, h2, h3 { margin: 0; line-height: 1.2; letter-spacing: -.012em; }
h1 { font-size: 1.2rem; font-weight: 750; }
h2 { font-size: 1.1rem; font-weight: 720; }
h3 { font-size: 1rem; font-weight: 700; }
p { margin: 0 0 .5rem; }
small, .muted { color: var(--muted); }
small { font-size: .86rem; }
b { font-weight: 680; }

/* ---------- estrutura ---------- */
.shell { display: block; }
.main { min-width: 0; }
.top {
  position: sticky; top: 0; z-index: 20; color: #fff; padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top));
  background: linear-gradient(135deg, var(--hero-a), var(--hero-b));
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 10px; }
.brand h1 { color: #fff; font-size: 1.05rem; }
.brand span { display: block; font-size: .78rem; opacity: .82; line-height: 1.2; }
.top-actions { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.wrap { max-width: 1040px; margin: 0 auto; padding: 16px 14px 0; }
#saveWarn { display: none; background: var(--warn-bg); color: var(--warn); border: 1px solid var(--warn); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 12px; font-size: .92rem; }
#saveWarn.show { display: block; }

/* chip de nuvem */
.chip {
  display: inline-flex; align-items: center; gap: 7px; min-height: 36px; padding: 6px 12px; border-radius: 99px; border: 1px solid rgba(255,255,255,.28);
  background: rgba(255,255,255,.12); color: #fff; font: inherit; font-size: .84rem; font-weight: 650; cursor: pointer; white-space: nowrap;
}
.chip:hover { background: rgba(255,255,255,.2); }
.chip.static { background: var(--surface2); color: var(--text); border-color: var(--line); cursor: default; }
.chip[hidden] { display: none; }
.chip.install { background: var(--corn); color: var(--corn-ink); border-color: transparent; }
.dot { width: 9px; height: 9px; border-radius: 50%; background: #9fb0a5; flex: 0 0 auto; }
.dot.ok { background: #5be29a; } .dot.pending { background: var(--corn); } .dot.offline { background: #c4cfc8; box-shadow: inset 0 0 0 2px #6f8377; }
.dot.syncing { background: #7cc4ee; animation: pulse 1.1s ease-in-out infinite; }
.dot.conflict, .dot.error, .dot.expired { background: #ff8d80; }
.chip.static .dot.offline { background: #8fa196; box-shadow: none; }
@keyframes pulse { 50% { opacity: .35; } }
.syncline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ---------- avisos ---------- */
.banner { border-radius: var(--radius-sm); padding: 12px 14px; margin-bottom: 10px; display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; border: 1px solid; font-size: .95rem; }
.banner > div { flex: 1 1 220px; min-width: 0; }
.banner.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.banner.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.banner button { flex: 0 0 auto; }

/* ---------- cartões ---------- */
.grid { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 760px) { .grid.two { grid-template-columns: repeat(2, minmax(0, 1fr)); } .span2 { grid-column: 1 / -1; } }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; margin-bottom: 14px; }
.grid > .card { margin-bottom: 0; }
.card > h2 { margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.sub { margin-bottom: 10px; }

/* cartão de destaque: quantas cestas dá para montar agora */
.card.hero {
  background: linear-gradient(140deg, var(--hero-a), var(--hero-b)); border-color: transparent; color: #fff; position: relative; overflow: hidden; padding: 22px 20px;
}
.card.hero::after {
  content: ""; position: absolute; right: -40px; top: -40px; width: 190px; height: 190px; border-radius: 50%;
  background: radial-gradient(circle at 30% 30%, rgba(244,183,61,.35), rgba(244,183,61,0) 70%); pointer-events: none;
}
.card.hero h2, .card.hero p, .card.hero b { color: #fff; }
.card.hero small, .card.hero .muted { color: rgba(255,255,255,.8); }
.card.hero .big { color: var(--corn); font-size: clamp(3.4rem, 14vw, 5rem); }
.card.hero .badge.ok, .card.hero .badge.warn, .card.hero .badge.bad, .card.hero .badge.info { background: rgba(255,255,255,.18); color: #fff; }
.card.hero .btn { background: var(--corn); color: var(--corn-ink); border-color: var(--corn); }

.big { font-size: 2.3rem; font-weight: 780; line-height: 1.05; letter-spacing: -.03em; }
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface2); border-radius: var(--radius-sm); padding: 12px; min-width: 0; border: 1px solid var(--line); }
.kpi b { display: block; font-size: 1.12rem; font-weight: 740; letter-spacing: -.01em; }
.kpi span { font-size: .82rem; color: var(--muted); }
.kpi.bad b { color: var(--bad); } .kpi.ok b { color: var(--ok); }
.bar { display: flex; height: 16px; border-radius: 99px; overflow: hidden; background: var(--line); margin: 12px 0 6px; }
.bar i { display: block; height: 100%; }
.bar .c { background: var(--corn); } .bar .p { background: var(--brand-2); }
.legend { display: flex; gap: 16px; font-size: .86rem; color: var(--muted); flex-wrap: wrap; }
.legend em { font-style: normal; }
.legend em::before { content: ""; display: inline-block; width: 11px; height: 11px; border-radius: 4px; margin-right: 6px; vertical-align: -1px; }
.legend .c::before { background: var(--corn); } .legend .p::before { background: var(--brand-2); }

.badge { display: inline-block; padding: 3px 10px; border-radius: 99px; font-size: .8rem; font-weight: 650; white-space: nowrap; }
.badge.ok { background: var(--ok-bg); color: var(--ok); } .badge.warn { background: var(--warn-bg); color: var(--warn); }
.badge.bad { background: var(--bad-bg); color: var(--bad); } .badge.info { background: var(--info-bg); color: var(--info); }

/* ---------- formulários ---------- */
label { display: block; font-size: .9rem; font-weight: 650; margin: 0 0 5px; }
.field { margin-bottom: 12px; min-width: 0; }
.row { display: grid; gap: 12px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.row.one { grid-template-columns: minmax(0, 1fr); }
.row.three { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 560px) { .row.three { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
input, select, textarea {
  width: 100%; min-height: 48px; padding: 10px 13px; border-radius: var(--radius-sm); border: 1.5px solid var(--line-strong);
  background: var(--surface); color: var(--text); font: inherit; font-size: 16px; transition: border-color .15s, box-shadow .15s;
}
input:hover, select:hover, textarea:hover { border-color: var(--muted); }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline: none; border-color: var(--brand-2); box-shadow: 0 0 0 4px color-mix(in srgb, var(--brand-2) 24%, transparent); }
textarea { min-height: 120px; resize: vertical; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
button:focus-visible, a:focus-visible, summary:focus-visible { outline: 3px solid var(--brand-2); outline-offset: 2px; }
input[type=checkbox] { width: 22px; min-height: 22px; }
.btn {
  min-height: 48px; padding: 10px 18px; border-radius: var(--radius-sm); border: 1.5px solid var(--brand); background: var(--brand); color: var(--brand-ink);
  font: inherit; font-weight: 680; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: filter .15s, transform .08s;
}
.btn:hover { filter: brightness(1.08); }
.btn:active { transform: translateY(1px); }
.btn.ghost { background: var(--brand-soft); color: var(--brand); border-color: transparent; }
.btn.danger { background: transparent; color: var(--bad); border-color: var(--bad); }
.btn.danger.armed { background: var(--bad); color: #fff; }
.btn.small { min-height: 44px; padding: 7px 14px; font-size: .92rem; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }

/* ---------- listas ---------- */
.list { display: grid; gap: 10px; }
.item { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; background: var(--surface); min-width: 0; }
.item .head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; flex-wrap: wrap; }
.item .head b { min-width: 0; }
.parcel { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; padding: 10px 0; border-top: 1px dashed var(--line-strong); }
.parcel:first-of-type { margin-top: 8px; }
.parcel .info { flex: 1 1 140px; min-width: 0; }
.parcel .btns { display: flex; gap: 6px; flex-wrap: wrap; }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.stats div { background: var(--surface2); border-radius: 10px; padding: 8px 10px; min-width: 0; }
.stats b { display: block; font-size: .9rem; white-space: nowrap; overflow-wrap: normal; } .stats span { font-size: .78rem; color: var(--muted); }
.empty { text-align: center; color: var(--muted); padding: 22px 10px; border: 1.5px dashed var(--line-strong); border-radius: var(--radius-sm); }
.cat { margin: 18px 0 8px; font-size: .88rem; letter-spacing: .01em; color: var(--brand); font-weight: 740; }
.line { display: flex; justify-content: space-between; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.line:last-child { border-bottom: 0; }
.line > span:first-child { min-width: 0; }
.line > span:last-child { text-align: right; flex: 0 0 auto; max-width: 55%; }
.check-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: .95rem; }
.check-row:last-child { border-bottom: 0; }
.check-row.bad { color: var(--bad); }
.msg { border-radius: var(--radius-sm); padding: 10px 14px; margin: 10px 0; font-size: .95rem; border: 1px solid; }
.msg.bad { background: var(--bad-bg); color: var(--bad); border-color: var(--bad); }
.msg.ok { background: var(--ok-bg); color: var(--ok); border-color: var(--ok); }
.msg.info { background: var(--info-bg); color: var(--info); border-color: var(--info); }
.msg.warn { background: var(--warn-bg); color: var(--warn); border-color: var(--warn); }
.items-edit { display: grid; gap: 8px; }
.items-edit .ie { display: grid; grid-template-columns: minmax(0, 1fr) 104px; gap: 10px; align-items: center; }
.items-edit .ie span { min-width: 0; font-size: .95rem; }
.items-edit .ie small { display: block; }
.pitem { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 10px; background: var(--surface2); }
.pitem .row { margin-top: 10px; }
.total { font-size: 1.2rem; font-weight: 760; text-align: right; margin: 8px 0; }
details > summary { cursor: pointer; min-height: 44px; display: flex; align-items: center; font-weight: 650; }
.flow { display: grid; gap: 10px; }
.flow .m { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 14px; background: var(--surface2); }
.flow .m b { display: block; margin-bottom: 4px; }
.flow .m div { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: .92rem; }

/* ---------- navegação: barra inferior no celular, lateral no computador ---------- */
.side { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); box-shadow: 0 -6px 20px -12px rgba(16,35,27,.25); }
.side-brand { display: none; }
nav.tabs { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); }
nav.tabs button {
  position: relative; min-height: var(--nav-h); border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .66rem; font-weight: 650;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; padding: 6px 1px;
}
nav.tabs svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
nav.tabs button[aria-current=page] { color: var(--brand); }
nav.tabs button[aria-current=page] svg { stroke-width: 2.3; }
nav.tabs button[aria-current=page]::before { content: ""; position: absolute; top: 0; left: 22%; right: 22%; height: 3px; border-radius: 0 0 4px 4px; background: var(--brand-2); }

@media (min-width: 900px) {
  body { padding-bottom: 32px; }
  .shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); align-items: start; }
  .side { position: sticky; top: 0; height: 100vh; border-top: 0; border-right: 1px solid var(--line); box-shadow: none; padding: 20px 14px; display: flex; flex-direction: column; gap: 22px; overflow-y: auto; }
  .side-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
  .side-brand svg { width: 40px; height: 40px; border-radius: 11px; }
  .side-brand b { display: block; font-size: 1.05rem; line-height: 1.15; }
  .side-brand small { font-size: .8rem; }
  nav.tabs { display: flex; flex-direction: column; gap: 4px; }
  nav.tabs button { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 48px; padding: 8px 14px; border-radius: var(--radius-sm); font-size: .98rem; text-align: left; }
  nav.tabs button:hover { background: var(--surface2); }
  nav.tabs button[aria-current=page] { background: var(--brand-soft); }
  nav.tabs button[aria-current=page]::before { content: none; }
  .top { background: transparent; color: var(--text); padding: 18px 28px 0; position: static; }
  .brand { display: none; }
  .top::before { content: ""; flex: 1; }
  .chip { background: var(--surface); color: var(--text); border-color: var(--line-strong); }
  .chip:hover { background: var(--surface2); }
  .chip .dot.ok { background: var(--ok); } .chip .dot.offline { background: #8fa196; box-shadow: none; } .chip .dot.syncing { background: var(--info); }
  .chip .dot.conflict, .chip .dot.error, .chip .dot.expired { background: var(--bad); } .chip .dot.pending { background: #d99a12; }
  .wrap { padding: 14px 28px 0; }
}

#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 22px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: #10231b; color: #fff; padding: 12px 18px; border-radius: 99px; font-size: .95rem; opacity: 0; pointer-events: none; transition: .2s; z-index: 50; max-width: 92vw; text-align: center; box-shadow: 0 8px 24px -8px rgba(0,0,0,.4); }
#toast.show { opacity: 1; transform: translateX(-50%); }
@media (min-width: 900px) { #toast { bottom: 28px; } }
@media (prefers-reduced-motion: reduce) { #toast, .btn, input, select { transition: none; } .dot.syncing { animation: none; } html { scroll-behavior: auto; } }
@media print { .side, .top, #toast { display: none !important; } body { padding: 0; } .card { box-shadow: none; } }

/* ---------- tela de entrada ---------- */
body.locked { padding-bottom: 0; }
body.locked .shell { display: none; }
#gate { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 24px 16px;
  background: linear-gradient(160deg, var(--hero-a), var(--hero-b)); }
#gate[hidden] { display: none; }
.gate-card { width: 100%; max-width: 400px; background: var(--surface); border-radius: 24px; padding: 28px 22px; box-shadow: 0 24px 60px -20px rgba(0,0,0,.5); text-align: center; }
.gate-card img { border-radius: 20px; margin-bottom: 10px; }
.gate-card h1 { font-size: 1.5rem; margin-bottom: 6px; }
.gate-card form { text-align: left; }
.btn.wide { width: 100%; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; padding: 4px; margin: 16px 0 14px; background: var(--surface2); border-radius: var(--radius-sm); border: 1px solid var(--line); }
.seg button { min-height: 44px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; font-weight: 650; cursor: pointer; }
.seg button[aria-selected=true], .seg button[aria-checked=true] { background: var(--surface); color: var(--brand); box-shadow: var(--shadow); }
.gate-card .msg { text-align: left; }

/* ---------- cotação ---------- */
.btn.pick { justify-content: space-between; width: 100%; text-align: left; flex-wrap: wrap; min-height: 52px; }
.btn.pick small { color: inherit; opacity: .8; font-weight: 600; }
.qhead { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }

.btn.big { min-height: 56px; font-size: 1.05rem; margin-top: 12px; }
.bigin input { font-size: 1.35rem; font-weight: 700; min-height: 54px; }
.row.bigin label { font-size: .85rem; }
.item .head + small { display: block; margin-top: 2px; }
/* no celular, esconde a barra de abas enquanto o teclado está aberto (sobra mais tela para digitar) */
@media (max-width: 399px) { nav.tabs button { font-size: .6rem; letter-spacing: -.01em; } }
nav.tabs button { white-space: nowrap; }
@media (max-width: 899px) { body[data-nav=bottom].kb .side { display: none; } body[data-nav=bottom].kb { padding-bottom: 16px; } }
.total.sub2 { font-size: 1rem; font-weight: 500; margin-top: 0; color: var(--muted); }
.total.sub2 b { color: var(--text); font-size: 1.15rem; }
#quoteForm .seg { margin-top: 0; }

.chips { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: -2px 0 6px; }
.chip-btn { min-height: 44px; min-width: 56px; padding: 6px 14px; border-radius: 99px; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--text); font: inherit; font-weight: 700; cursor: pointer; }
.chip-btn.on { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); }
.chips small { flex: 1 1 100%; }

/* ---------- painel ---------- */
.brand, .side-brand { background: none; border: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; padding: 0; }
.side-brand { width: 100%; border-radius: var(--radius-sm); }
.side-brand:hover { background: var(--surface2); }
.seg.four { grid-template-columns: repeat(4, 1fr); margin: 4px 0 10px; }
.seg.four button { font-size: .86rem; padding: 0 4px; }
.dks { grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (min-width: 700px) { .dks { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.kpi.dk { display: flex; flex-direction: column; gap: 2px; padding: 12px; }
.kpi.dk span { order: 0; }
.kpi.dk b { order: 1; font-size: 1.3rem; }
.dk-foot { order: 2; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; min-height: 20px; }
.dk-foot small { font-size: .78rem; }
.delta { font-size: .8rem; font-weight: 700; white-space: nowrap; }
.delta.up { color: var(--ok); } .delta.down { color: var(--bad); } .delta.flat { color: var(--muted); }
.bar.stack i.late { background: var(--bad); } .bar.stack i.soon { background: var(--corn); } .bar.stack i.later { background: var(--brand-2); }
.legend .late::before { background: var(--bad); } .legend .soon::before { background: var(--corn); } .legend .later::before { background: var(--brand-2); }
.lines { margin-top: 10px; }
.drow { width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 12px 14px; font: inherit; color: inherit; cursor: pointer; min-height: 56px; }
.drow:hover { background: var(--surface2); }
.drow .head { display: flex; justify-content: space-between; gap: 8px; }
.mini { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 6px 0 4px; }
.mini i { display: block; height: 100%; border-radius: 99px; }
.mini i.late { background: var(--bad); } .mini i.ok { background: var(--brand-2); }
.bad-t { color: var(--bad); font-weight: 650; }
.chart { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 8px; }
.chart .col { display: flex; flex-direction: column; align-items: stretch; }
.chart .val { height: 18px; font-size: .74rem; font-weight: 700; text-align: center; color: var(--muted); }
.chart .bars { display: flex; align-items: flex-end; justify-content: center; gap: 3px; height: 130px; border-bottom: 2px solid var(--line-strong); }
.chart .bars i { flex: 1 1 0; max-width: 18px; border-radius: 4px 4px 0 0; min-height: 0; }
.chart .mes { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 4px; text-transform: capitalize; }
.chart i.cp, .legend .cp::before { background: var(--corn); } .chart i.cv, .legend .cv::before { background: var(--brand-2); } .chart i.cl, .legend .cl::before { background: var(--info); }
.mrow { display: grid; grid-template-columns: 76px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 6px 0; font-size: .92rem; }
.mrow .mini { margin: 0; } .mrow > span { white-space: nowrap; font-size: .88rem; }

/* ---------- forma de pagamento ---------- */
.seg.three { grid-template-columns: repeat(3, 1fr); margin: 6px 0 8px; }
#payModal[hidden], #rcptModal[hidden], #saleModal[hidden] { display: none; }
#payModal, #rcptModal, #saleModal { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
#payModal .scrim, #rcptModal .scrim, #saleModal .scrim { position: absolute; inset: 0; background: rgba(10, 30, 20, .5); }
#payModal .sheet, #rcptModal .sheet, #saleModal .sheet { position: relative; width: 100%; max-width: 480px; background: var(--surface); border-radius: 20px 20px 0 0; padding: 20px 16px calc(20px + env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); max-height: 92vh; overflow: auto; }
#payModal .sheet h2, #saleModal .sheet h2 { margin: 0 0 2px; }
@media (min-width: 700px) { #payModal, #rcptModal, #saleModal { align-items: center; } #payModal .sheet, #rcptModal .sheet, #saleModal .sheet { border-radius: 20px; } }
body.modal-open { overflow: hidden; }
body.modal-open .side { display: none; }

/* ---------- formulários: ajustes de conforto ---------- */
input[type=date] { -webkit-appearance: none; appearance: none; display: block; min-width: 0; max-width: 100%; text-align: left; }
input[type=date]::-webkit-date-and-time-value { text-align: left; margin: 0; }
input::placeholder { color: var(--muted); opacity: .7; }
.pitem { background: var(--surface); border: 1px solid var(--line-strong); border-left: 4px solid var(--brand-2); padding: 12px 14px 14px; }
.pitem-head { display: flex; justify-content: space-between; align-items: center; min-height: 34px; }
.pitem-head label { margin: 0; color: var(--muted); }
.link-btn { background: none; border: 0; padding: 6px 2px; min-height: 36px; color: var(--brand-2); font: inherit; font-weight: 650; text-decoration: underline; cursor: pointer; }
.pitem .lastbuy { margin: 10px 0 0; font-size: .9rem; color: var(--muted); line-height: 1.4; }
.pitem .lastbuy b { color: var(--text); }
.pitem .chips { margin-top: 8px; }
.pitem .chip-btn small { opacity: .75; margin-left: 4px; }
.pitem .hint { display: block; margin-top: 6px; color: var(--muted); }
.pitem .live { margin-top: 10px; font-size: .95rem; line-height: 1.6; }
.pitem .live:empty { display: none; }
.stickybar { position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px); z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 14px -6px 0; padding: 10px 12px; background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--radius); box-shadow: 0 10px 28px -10px rgba(0, 0, 0, .35); }
.stickybar .sb-total { display: flex; flex-direction: column; line-height: 1.15; min-width: 0; }
.stickybar .sb-total b { font-size: 1.25rem; }
.stickybar .btn { flex: 0 0 auto; }
body.kb .stickybar { bottom: 8px; }
@media (min-width: 900px) { .stickybar { bottom: 12px; } }

.passwrap { position: relative; }
.passwrap input { padding-right: 86px; }
.passwrap .link-btn { position: absolute; right: 6px; top: 6px; min-height: 36px; padding: 0 10px; }

.mrow.wide { grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr) auto; }
.mrow.wide > span { white-space: normal; }
.mini i.inv { background: var(--corn); } .mini i.wd { background: var(--info); }
@media (max-width: 400px) { nav.tabs button { font-size: .6rem; } }
@media (max-width: 380px) { nav.tabs button { font-size: .56rem; letter-spacing: -.02em; padding-left: 0; padding-right: 0; } nav.tabs svg { width: 22px; height: 22px; } }

/* vendas feitas, troca na cesta, edição de data */
.parcel .pays { flex-basis: 100%; display: grid; gap: 6px; }
.payline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 6px 8px; background: var(--surface2); border-radius: var(--radius-sm); }
.payline.editing { display: block; border: 1px solid var(--line-strong); }
.payline .btn.small { min-height: 34px; padding: 0 10px; }
.swaps { display: grid; gap: 8px; margin-top: 8px; }
.swap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; padding: 10px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); }
.swap .info { flex: 1 1 200px; min-width: 0; }
.costrow { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.costrow span { color: var(--muted); }

/* números do painel tocáveis */
button.kpi.tap { font: inherit; color: inherit; text-align: left; width: 100%; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button.kpi.tap:active { transform: scale(.985); }
button.kpi.tap[aria-pressed="true"] { border-color: var(--brand, #7cd3a1); box-shadow: 0 0 0 1px var(--brand, #7cd3a1) inset; }
.dd { margin-top: 12px; padding: 12px; border: 1px solid var(--line-strong); border-radius: var(--radius-sm); background: var(--surface); }
.dd .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 6px; }
.dd .line { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--line); }
.dd .line > span:first-child { min-width: 0; overflow-wrap: anywhere; }

/* planejamento mês a mês */
details.pm { border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
details.pm > summary { display: grid; grid-template-columns: 62px 1fr 1fr auto; gap: 6px; align-items: baseline; padding: 12px; cursor: pointer; list-style: none; font-size: .86rem; }
details.pm > summary::-webkit-details-marker { display: none; }
details.pm .in { color: var(--ok); } details.pm .out { color: var(--muted); }
details.pm .bal { text-align: right; } details.pm .bal.neg { color: var(--bad); }
details.pm .dd { border: 0; border-top: 1px solid var(--line); border-radius: 0; background: transparent; }
details.pm[open] > summary { border-bottom: 0; }
.list details.pm + details.pm { margin-top: 8px; }
.kpi.dk b { white-space: nowrap; font-size: clamp(1.05rem, 5.2vw, 1.3rem); }
details.pm > summary { grid-template-columns: 1fr auto; row-gap: 2px; }
details.pm > summary b:first-child { white-space: nowrap; }
details.pm > summary .bal { grid-column: 2; grid-row: 1; white-space: nowrap; }
details.pm > summary .in { grid-column: 1; grid-row: 2; white-space: nowrap; }
details.pm > summary .out { grid-column: 2; grid-row: 2; text-align: right; white-space: nowrap; }


/* ---------- menu: grupos, subseções e avisos ---------- */
.nav-group, .subnav, .nb, .menu-btn, #scrim { display: none; }
nav.tabs .ic { position: relative; display: inline-flex; }
nav.tabs .lb { display: inline; }
.nb { position: absolute; top: -5px; right: -9px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 9px; background: var(--bad); color: #fff; font: 700 .64rem/16px system-ui, sans-serif; font-style: normal; text-align: center; }
nav.tabs .ic .nb { display: block; }
.menu-btn { width: 44px; height: 44px; border: 0; border-radius: 12px; background: rgba(255,255,255,.14); color: inherit; align-items: center; justify-content: center; cursor: pointer; }
.menu-btn svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
.top .menu-btn { margin-right: 8px; }

/* menu lateral: sempre no computador; no celular quando escolhido em Cadastros */
@media (min-width: 900px) {
  .nav-group { display: block; margin: 14px 14px 4px; font-size: .78rem; font-weight: 650; color: var(--muted); }
  .nav-group:first-child { margin-top: 0; }
  .subnav { display: grid; gap: 2px; margin: 2px 0 6px 38px; }
  .subnav button { min-height: 38px; border: 0; background: transparent; border-radius: 10px; padding: 6px 12px; font: inherit; font-size: .92rem; color: var(--muted); text-align: left; cursor: pointer; }
  .subnav button:hover { background: var(--surface2); }
  .subnav button[aria-current] { color: var(--brand); font-weight: 700; background: var(--surface2); }
}
@media (max-width: 899px) {
  body[data-nav=side] { --nav-h: 0px; padding-bottom: 24px; }
  body[data-nav=side] .menu-btn { display: inline-flex; }
  body[data-nav=side] .side {
    position: fixed; top: 0; bottom: 0; left: 0; right: auto; width: min(310px, 86vw); z-index: 60; border-top: 0; border-right: 1px solid var(--line);
    padding: calc(env(safe-area-inset-top) + 18px) 14px calc(env(safe-area-inset-bottom) + 18px); display: flex; flex-direction: column; gap: 16px; overflow-y: auto;
    transform: translateX(-104%); transition: transform .22s ease; box-shadow: 12px 0 30px -14px rgba(16,35,27,.35); visibility: hidden;
  }
  body[data-nav=side].menu-open .side { transform: none; visibility: visible; }
  body[data-nav=side] .side-brand { display: flex; align-items: center; gap: 10px; padding: 2px 8px; }
  body[data-nav=side] .side-brand svg, body[data-nav=side] .side-brand img { width: 40px; height: 40px; border-radius: 11px; }
  body[data-nav=side] .side-brand b { display: block; font-size: 1.05rem; line-height: 1.15; }
  body[data-nav=side] nav.tabs { display: flex; flex-direction: column; gap: 4px; }
  body[data-nav=side] nav.tabs button { flex-direction: row; justify-content: flex-start; gap: 12px; min-height: 50px; padding: 8px 14px; border-radius: var(--radius-sm); font-size: 1rem; text-align: left; white-space: normal; }
  body[data-nav=side] nav.tabs button[aria-current=page] { background: var(--brand-soft); }
  body[data-nav=side] nav.tabs button[aria-current=page]::before { content: none; }
  body[data-nav=side] .nav-group { display: block; margin: 14px 14px 4px; font-size: .8rem; font-weight: 650; color: var(--muted); }
  body[data-nav=side] .nav-group:first-child { margin-top: 0; }
  body[data-nav=side] .subnav { display: grid; gap: 2px; margin: 2px 0 6px 38px; }
  body[data-nav=side] .subnav button { min-height: 44px; border: 0; background: transparent; border-radius: 10px; padding: 6px 12px; font: inherit; font-size: .95rem; color: var(--muted); text-align: left; cursor: pointer; flex-direction: row; justify-content: flex-start; }
  body[data-nav=side] .subnav button[aria-current] { color: var(--brand); font-weight: 700; background: var(--surface2); }
  body[data-nav=side].menu-open #scrim { display: block; position: fixed; inset: 0; z-index: 50; background: rgba(8,20,14,.5); }
  body[data-nav=side] #toast { bottom: 24px; }
  body[data-nav=side] .stickybar { bottom: 8px; }
  body[data-nav=side].menu-open { overflow: hidden; }
}
@media (prefers-reduced-motion: reduce) { body[data-nav=side] .side { transition: none; } }

/* configurações */
.line2 { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.line2 span { color: var(--muted); }

/* ---------- estrutura ERP: trilha, subabas, hub "Mais" ---------- */
.crumb { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 10px; font-size: .84rem; color: var(--muted); min-height: 1.2em; }
.crumb b { color: var(--text); font-weight: 650; }
.crumb i { font-style: normal; opacity: .6; }
.seg.scroll { display: flex; overflow-x: auto; gap: 4px; scrollbar-width: none; -webkit-overflow-scrolling: touch; margin: 0 0 12px; }
.seg.scroll::-webkit-scrollbar { display: none; }
.seg.scroll button { flex: 1 0 auto; padding: 0 14px; white-space: nowrap; }
.hub { display: grid; gap: 2px; }
.hubrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 56px; padding: 8px 4px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.hubrow:last-child { border-bottom: 0; }
.hubrow span { display: grid; gap: 2px; min-width: 0; }
.hubrow small { color: var(--muted); }
.hubrow i { font-style: normal; font-size: 1.4rem; color: var(--muted); }
nav.tabs button { order: var(--bo, 0); }
@media (max-width: 899px) { body:not([data-nav=side]) nav.tabs button.so:not([data-tab=painel]):not([data-tab=vendas]):not([data-tab=clientes]):not([data-tab=compras]):not([data-tab=contas]):not([data-tab=cotar]):not([data-tab=estoque]) { display: none; } }
@media (min-width: 900px) { nav.tabs button.bo { display: none; } nav.tabs button { order: 0; } }
body[data-nav=side] nav.tabs button.bo { display: none; }
body[data-nav=side] nav.tabs button { order: 0; }

/* ---------- reposição e posição de estoque ---------- */
.stepper { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; gap: 8px; align-items: end; margin: 10px 0 12px; }
.stepper .btn { min-height: 48px; font-size: 1.4rem; padding: 0; }
.stepper .field { margin: 0; }
.stepper input { text-align: center; font-size: 1.3rem; font-weight: 700; }
.rsum { margin: 4px 0 10px; }
.rgroup { margin: 0 0 10px; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
.rhead { display: flex; justify-content: space-between; gap: 8px; padding: 9px 12px; background: var(--surface2); font-size: .95rem; }
.rrow { display: flex; justify-content: space-between; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--line); }
.rrow .rn, .rrow .rp { display: grid; gap: 2px; min-width: 0; }
.rrow .rp { text-align: right; flex: 0 0 auto; }
.rrow small { color: var(--muted); }
.rtotal { display: flex; justify-content: space-between; align-items: baseline; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--brand-soft); color: var(--brand); font-weight: 650; }
.rtotal b { font-size: 1.25rem; }
details.fold > summary { list-style: none; cursor: pointer; display: grid; gap: 2px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary h2 { margin: 0; }
details.fold[open] > summary { margin-bottom: 10px; }
.kpis.three { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.srows { display: grid; }
.srow { border-bottom: 1px solid var(--line); }
.srow > summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 56px; padding: 8px 2px; }
.srow > summary::-webkit-details-marker { display: none; }
.srow .sn, .srow .sq { display: grid; gap: 3px; min-width: 0; }
.srow .sq { text-align: right; justify-items: end; flex: 0 0 auto; }
.srow small { color: var(--muted); }
.srow[open] { padding-bottom: 10px; }

/* ---------- listas limpas, detalhe, comprovante ---------- */
.cardhead { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
.cardhead h2 { margin: 0; }
.cardhead h2 small { color: var(--muted); font-weight: 500; }
.crows { display: grid; }
.crow { display: flex; align-items: center; justify-content: space-between; gap: 10px; width: 100%; min-height: 60px; padding: 10px 2px; border: 0; border-bottom: 1px solid var(--line); background: transparent; color: var(--text); font: inherit; text-align: left; cursor: pointer; }
.crow:last-child { border-bottom: 0; }
.crow:active { background: var(--surface2); }
.crow .cn, .crow .cv { display: grid; gap: 3px; min-width: 0; }
.crow .cn small { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.crow .cv { text-align: right; justify-items: end; flex: 0 0 auto; }
.crow i { font-style: normal; font-size: 1.4rem; color: var(--muted); flex: 0 0 auto; }
.prow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
.prow:last-child { border-bottom: 0; }
.prow .pn { display: grid; gap: 2px; } .prow small { color: var(--muted); }
.back { border: 0; background: transparent; color: var(--brand); font: inherit; font-weight: 650; min-height: 44px; padding: 0 4px; cursor: pointer; }
.linkbtn { border: 0; background: transparent; padding: 0; font: inherit; color: inherit; text-align: left; cursor: pointer; }
.cinfo { display: grid; gap: 3px; margin: 2px 0 6px; }
.cinfo small { color: var(--muted); }
.kpis.four { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
@media (min-width: 600px) { .kpis.four { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.dangerzone { margin: 8px 0 24px; justify-content: center; }
details.filters { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 8px; }
details.filters > summary { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 40px; cursor: pointer; font-weight: 650; list-style: none; }
details.filters > summary::-webkit-details-marker { display: none; }
details.filters > summary small { color: var(--muted); font-weight: 400; text-align: right; }
details.filters[open] > summary { margin-bottom: 8px; }
#rcptModal .sheet { max-height: 92vh; overflow-y: auto; }
.paper { background: #fff; color: #1a1a1a; border: 1px dashed #b9c4bd; border-radius: 12px; padding: 18px 16px; font-size: .95rem; }
.paper h3 { margin: 6px 0 2px; font-size: 1.05rem; text-align: center; }
.paper .ph { display: grid; justify-items: center; gap: 2px; text-align: center; }
.paper .biz { font-size: 1.15rem; }
.paper small { color: #5b6b62; }
.paper .pmeta { display: flex; justify-content: space-between; gap: 8px; margin: 8px 0 10px; padding-bottom: 8px; border-bottom: 1px solid #dfe6e1; font-size: .85rem; color: #5b6b62; }
.paper .pcl { display: grid; gap: 1px; margin-bottom: 10px; }
.paper .pl { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid #eef2ef; }
.paper .pl.sm { font-size: .85rem; color: #5b6b62; padding: 2px 0; border: 0; }
.paper .pl.tot { border-bottom: 0; font-size: 1.02rem; }
.paper .pt { margin-top: 8px; }
.paper .st.ok { color: #15803d; } .paper .st.bad { color: #b91c1c; }
.paper .pfoot { margin: 12px 0 0; text-align: center; font-size: .78rem; color: #5b6b62; }
.paper .pl > span:last-child { text-align: right; flex: 0 0 auto; }
.paper .pl .st { display: block; }
.kpis.three .kpi b { font-size: 1rem; white-space: nowrap; }
.kpis.three .kpi span { font-size: .78rem; }
.linkbtn.under { text-decoration: underline; color: var(--brand); }
.hint { margin: 10px 0 0; }

/* edição de venda */
.se-row { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 8px 10px; align-items: end; padding: 10px 0; border-bottom: 1px solid var(--line); }
.se-row .field { margin: 0; }
.se-row .se-note, .se-row .se-del { grid-column: 1 / -1; justify-self: start; color: var(--muted); }
.seg-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 6px; }
.se-sum { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.se-sum > div { display: grid; gap: 2px; padding: 10px 12px; border-radius: var(--radius-sm); background: var(--surface2); }
.se-sum span { color: var(--muted); font-size: .85rem; }

.rask { margin: 0 0 14px; padding: 14px; border-radius: var(--radius-sm); background: var(--brand-soft); }
.rask h2 { font-size: 1.1rem; margin: 0 0 4px; }
.rask .actions { margin-top: 10px; }
.rask a.btn { text-decoration: none; }
.rsend { margin-top: 12px; }
.rsend a.btn { text-decoration: none; }

/* ---------- lista de produtos (cadastro) ---------- */
.plist { display: grid; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); overflow: hidden; }
.plist .pl + .pl { border-top: 1px solid var(--line); }
.pl > summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 60px; padding: 10px 12px; cursor: pointer; }
.pl > summary::-webkit-details-marker { display: none; }
.pl > summary:active, .pl[open] > summary { background: var(--surface2); }
.pl-n, .pl-v { display: grid; gap: 3px; min-width: 0; }
.pl-n small { color: var(--muted); }
.pl-v { justify-items: end; text-align: right; flex: 0 0 auto; }
.pl-b { padding: 4px 12px 12px; background: var(--surface2); }
.pl-b dl { margin: 0 0 10px; display: grid; gap: 6px; }
.pl-b dl div { display: flex; justify-content: space-between; gap: 12px; font-size: .92rem; }
.pl-b dt { color: var(--muted); flex: 0 0 auto; }
.pl-b dd { margin: 0; text-align: right; font-weight: 600; }

.crumb-back { background: none; border: 0; padding: 4px 10px 4px 0; min-height: 32px; margin-right: 4px; color: var(--brand-2); font: inherit; font-weight: 700; cursor: pointer; }

/* valores em reais cabem nos cartões de 3 colunas em telas estreitas */
.kpis.three .kpi { padding: 10px 8px; }
.kpis.three .kpi b { font-size: clamp(.74rem, 3.6vw, 1rem); letter-spacing: -.02em; }
.kpis.three .kpi span { font-size: clamp(.7rem, 3vw, .78rem); }

/* ---------- PDV: nova venda ---------- */
.pos .pos-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; box-shadow: var(--shadow); min-width: 0; }
.pos .pos-card .field:last-child { margin-bottom: 0; }
.pos-lbl { display: block; margin: 0 0 6px; font-weight: 700; font-size: .92rem; }
.pos-lbl small { margin-left: 6px; color: var(--muted); font-weight: 500; }
.pos-sel { min-height: 56px; font-size: 1.1rem; font-weight: 650; }
.pos-line { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 12px; align-items: end; }
.pos-line .field { margin: 0; }
.pos-line .field label { font-weight: 700; font-size: .92rem; }
.pos-step { margin: 0; grid-template-columns: 46px minmax(0, 1fr) 46px; }
.pos-step .btn { min-height: 56px; }
.pos-step input, .pos-line #s-price { min-height: 56px; font-size: 1.35rem; font-weight: 750; text-align: center; }
.pos-date { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--line); }
.pos-date label { margin: 0; color: var(--muted); font-size: .9rem; }
.pos-date input { width: auto; min-width: 0; flex: 0 1 170px; }
.pos-grp + .pos-grp { margin-top: 14px; }
.pos-grp .chips { margin: 0; }
.pos .seg.four { margin: 0 0 10px; }
.pos .seg.four button { min-height: 52px; font-size: .88rem; line-height: 1.15; }
.pos .seg.four button[aria-checked=true] { background: var(--brand); color: var(--brand-ink); box-shadow: none; }
.pos details.fold > summary { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.pos .stickybar .sb-total b { font-size: 1.5rem; color: var(--brand); }
.pos .stickybar .btn.big { margin-top: 0; min-width: 170px; }
.pos #saleTerm .row { grid-template-columns: minmax(0, 1fr); gap: 0; }

/* ---------- finalizar venda ---------- */
#saleModal .sheet { max-height: 92vh; overflow-y: auto; }
.ck-sum { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 10px 0 16px; padding: 12px 14px; background: var(--surface2); border: 1px solid var(--line); border-radius: var(--radius-sm); }
.ck-sum span { display: grid; gap: 2px; min-width: 0; }
.ck-sum small { color: var(--muted); }
.ck-sum strong { font-size: 1.45rem; color: var(--brand); flex: 0 0 auto; }
#saleModal .seg.four { margin: 4px 0 12px; }
#saleModal .seg.four button { min-height: 52px; font-size: .88rem; line-height: 1.15; }
#saleModal .seg.four button[aria-checked=true] { background: var(--brand); color: var(--brand-ink); box-shadow: none; }
.ck-pars { display: grid; gap: 8px; margin: 4px 0 14px; }
.ck-par { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius-sm); background: var(--surface); }
.ck-par > span:first-child { display: grid; gap: 2px; min-width: 0; }
.ck-par small { color: var(--muted); }
.ck-due { display: grid; gap: 2px; margin: 0; flex: 0 1 168px; min-width: 0; }
.ck-due span { font-size: .78rem; color: var(--muted); }
.ck-due input { min-height: 46px; }
#saleModal .sheet.done { text-align: center; }
#saleModal .sheet.done .ck-sum, #saleModal .sheet.done .ck-par { text-align: left; }
.done-ic { width: 64px; height: 64px; margin: 4px auto 10px; border-radius: 50%; display: grid; place-items: center; background: var(--brand); color: var(--brand-ink); font-size: 2rem; font-weight: 800; }
#saleModal .actions { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
#saleModal .actions .btn { width: 100%; margin: 0; }

</style>
</head>
<body>
<div id="gate" hidden></div>
<div class="shell">
  <aside class="side">
    <button type="button" class="side-brand" data-act="go" data-tab="painel" aria-label="FeiraUP, ir para o início"><img src="icons/favicon.svg" alt="" width="40" height="40"><div><b>FeiraUP</b><small>Estoque, vendas e parcelas</small></div></button>
    <nav class="tabs" id="tabs" aria-label="Seções do app"></nav>
  </aside>
  <div class="main">
    <header class="top">
      <button type="button" class="menu-btn" id="menuBtn" data-act="menu" aria-label="Abrir menu" aria-expanded="false" aria-controls="tabs"><svg viewBox="0 0 24 24" aria-hidden="true"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
      <button type="button" class="brand" data-act="go" data-tab="painel" aria-label="FeiraUP, ir para o início"><img src="icons/favicon.svg" alt="" width="40" height="40"><div><h1>FeiraUP</h1><span>Estoque, compras, vendas e parcelas</span></div></button>
      <div class="top-actions">
        <button class="chip install" id="installBtn" type="button" hidden>Instalar app</button>
        <button class="chip" id="syncChip" type="button" data-act="go" data-tab="config" data-sub="conta" aria-label="Nuvem"></button>
      </div>
    </header>
    <div class="wrap">
      <div id="saveWarn" role="alert"></div>
      <div id="crumb" class="crumb"></div>
      <div id="alerts"></div>
      <main id="view"></main>
    </div>
  </div>
</div>
<div id="scrim" data-act="menu-close" aria-hidden="true"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
/* FeiraUP - núcleo de cálculo (funções puras, sem DOM) */
(function (root) {
  'use strict';

  var TZ = 'America/Sao_Paulo';
  var EPS = 1e-9;

  /* ---------- utilidades ---------- */
  function num(v) { var n = Number(v); return isFinite(n) ? n : 0; }
  function round2(n) { n = num(n); return Math.round(n * 100 + (n >= 0 ? 1e-9 : -1e-9)) / 100; }
  function r6(n) { return Math.round(num(n) * 1e6) / 1e6; }
  function r3(n) { return Math.round(num(n) * 1e3) / 1e3; }
  function floorCov(x) { return Math.floor(x + EPS); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

  function today() {
    return new Intl.DateTimeFormat('en-CA', { timeZone: TZ, year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date());
  }
  function parseISO(iso) { var p = String(iso).split('-').map(Number); return Date.UTC(p[0], p[1] - 1, p[2]); }
  function addDays(iso, n) {
    var p = String(iso).split('-').map(Number);
    return new Date(Date.UTC(p[0], p[1] - 1, p[2] + n)).toISOString().slice(0, 10);
  }
  function daysBetween(a, b) { return Math.round((parseISO(b) - parseISO(a)) / 864e5); }
  function validISO(iso) { return /^\d{4}-\d{2}-\d{2}$/.test(String(iso || '')); }

  var moneyFmt = new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' });
  var numFmt = new Intl.NumberFormat('pt-BR', { maximumFractionDigits: 3 });
  function money(n) { return moneyFmt.format(round2(n)); }
  function fnum(n) { return numFmt.format(r3(n)); }
  function fdate(iso) { if (!validISO(iso)) return '';var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function monthKey(iso) { return String(iso).slice(0, 7); }
  function fmonth(key) {
    var p = key.split('-');
    var nomes = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
    return nomes[Number(p[1]) - 1] + '/' + p[0];
  }

  /* aceita "1.234,56", "12,5" e "12.5" */
  function parseNum(str) {
    if (typeof str === 'number') return isFinite(str) ? str : NaN;
    var s = String(str == null ? '' : str).trim().replace(/\s/g, '').replace(/^R\$/, '');
    if (s === '') return NaN;
    if (s.indexOf(',') >= 0) s = s.replace(/\./g, '').replace(',', '.');
    var n = Number(s);
    return isFinite(n) ? n : NaN;
  }

  /* ---------- padrões ---------- */
  var DEFAULT_SETTINGS = { price: 340, term: '30-60', target: 10, minCover: 4, costMode: 'last', riceKg: 12 };
  var TERMS = ['30-60', 'avista', '30', 'fiado'];
  var CATS = ['Alimentos', 'Limpeza e higiene', 'Embalagens'];
  var EXPENSE_CATS = ['Combustível', 'Embalagens e sacolas', 'Caixotes e caixas', 'Frete e transporte', 'Alimentação', 'Manutenção', 'Taxas e tarifas', 'Itens extras', 'Outros'];

  function defaultProducts() {
    var A = CATS[0], L = CATS[1];
    function p(id, name, cat, unit, perBasket, packSize, packLabel, group) {
      var o = { id: id, name: name, cat: cat, unit: unit, perBasket: perBasket, packSize: packSize || 1, packLabel: packLabel || '' };
      if (group) o.group = group;
      return o;
    }
    return [
      p('p_arroz_pb', 'Arroz parboilizado (PB)', A, 'kg', 6, 30, 'fardo de 30', 'arroz'),
      p('p_arroz_br', 'Arroz branco', A, 'kg', 6, 30, 'fardo de 30', 'arroz'),
      p('p_acucar', 'Açúcar', A, 'kg', 3),
      p('p_flocao', 'Flocão de milho 500 g', A, 'un', 3),
      p('p_feijao', 'Feijão', A, 'kg', 1),
      p('p_tapioca', 'Goma de tapioca', A, 'kg', 1),
      p('p_cracker', 'Biscoito cream cracker', A, 'un', 1),
      p('p_maria', 'Biscoito Maria', A, 'un', 1),
      p('p_leite', 'Leite em pó Purelac 200 g', A, 'un', 2),
      p('p_cafe', 'Café moído 250 g', A, 'un', 2),
      p('p_macarrao', 'Macarrão espaguete 400 g', A, 'un', 2),
      p('p_sal', 'Sal refinado 1 kg', A, 'un', 1, 30, 'fardo de 30'),
      p('p_pimenta', 'Condimento pimenta', A, 'un', 1, 10, 'fardo de 10'),
      p('p_corante', 'Corante (colorau)', A, 'un', 1, 10, 'fardo de 10'),
      p('p_oleo', 'Óleo de soja 900 ml', A, 'un', 2),
      p('p_goiaba', 'Doce de goiaba 250 g', A, 'un', 1),
      p('p_margarina', 'Margarina 500 g', A, 'un', 1, 12, 'caixa de 12'),
      p('p_esponja', 'Esponja de lavar louça', L, 'un', 2, 80, 'caixa de 80'),
      p('p_sabao_po', 'Sabão em pó sachê 400 g', L, 'un', 1, 30, 'fardo de 30'),
      p('p_sabao_barra', 'Sabão em barra 450 g', L, 'un', 0.5),
      p('p_sabonete', 'Sabonete Ypê 85 g', L, 'un', 2, 12, 'dúzia de 12'),
      p('p_pasta', 'Pasta de dente 90 g', L, 'un', 1),
      p('p_detergente', 'Detergente Ypê 500 ml', L, 'un', 1),
      p('p_papel', 'Papel higiênico (pacote com 4)', L, 'un', 1),
      p('p_agua_san', 'Água sanitária', L, 'un', 1)
    ];
  }

  function newState() {
    return {
      settings: Object.assign({}, DEFAULT_SETTINGS),
      customers: [], suppliers: [], products: defaultProducts(),
      purchases: [], sales: [], adjustments: [], quotes: [], payables: [], withdrawals: [], contributions: [], expenses: []
    };
  }

  function byId(list, id) {
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }

  /* ---------- migração de dados antigos ---------- */
  function normSettings(s) {
    var o = Object.assign({}, DEFAULT_SETTINGS, s || {});
    ['price', 'target', 'minCover', 'riceKg'].forEach(function (k) {
      var n = Number(o[k]);
      o[k] = isFinite(n) && n >= 0 ? n : DEFAULT_SETTINGS[k];
    });
    if (TERMS.indexOf(o.term) < 0) o.term = DEFAULT_SETTINGS.term;
    if (o.costMode !== 'avg' && o.costMode !== 'last') o.costMode = 'last';
    var gq = {}; if (o.groupQty && typeof o.groupQty === 'object') Object.keys(GROUPS).forEach(function (k) { var n = Number(o.groupQty[k]); if (k !== 'arroz' && isFinite(n) && n > 0) gq[k] = n; });
    o.groupQty = gq;
    return o;
  }

  function normProduct(p) {
    var o = Object.assign({}, p);
    o.id = o.id || uid();
    o.name = String(o.name || 'Produto');
    o.cat = CATS.indexOf(o.cat) >= 0 ? o.cat : CATS[0];
    o.unit = o.unit === 'kg' ? 'kg' : 'un';
    o.perBasket = Math.max(0, num(o.perBasket));
    o.packSize = Math.max(1, num(o.packSize) || 1);
    o.packLabel = String(o.packLabel || '');
    if (!o.group && /arroz/i.test(o.name)) o.group = 'arroz';
    else if (!o.group && /^\s*caf[eé](\s|$)/i.test(o.name)) o.group = 'cafe';
    else if (!o.group && /^\s*macarr/i.test(o.name)) o.group = 'macarrao';
    if (!o.group || !GROUPS[o.group]) delete o.group;
    return o;
  }

  function migrate(raw) {
    var st = raw && typeof raw === 'object' ? (raw.state && typeof raw.state === 'object' ? raw.state : raw) : {};
    var out = newState();
    out.settings = normSettings(st.settings);
    out.products = Array.isArray(st.products) && st.products.length ? st.products.map(normProduct) : defaultProducts();
    // o arroz parboilizado também é comprado em fardo de 30 kg (igual ao arroz branco)
    out.products.forEach(function (p) { if (p.id === 'p_arroz_pb' && !(p.packSize > 1) && !p.packLabel) { p.packSize = 30; p.packLabel = 'fardo de 30'; } });

    out.suppliers = (Array.isArray(st.suppliers) ? st.suppliers : []).map(function (s) {
      return { id: s.id || uid(), name: String(s.name || 'Fornecedor'), address: String(s.address || ''), phone: String(s.phone || ''), doc: String(s.doc || '') };
    });

    out.customers = (Array.isArray(st.customers) ? st.customers : []).map(function (c) {
      var mods = {};
      if (c.mods && typeof c.mods === 'object') Object.keys(c.mods).forEach(function (k) { mods[k] = Math.max(0, num(c.mods[k])); });
      return { id: c.id || uid(), name: String(c.name || 'Cliente'), phone: String(c.phone || ''), address: String(c.address || ''), note: String(c.note || ''), mods: mods };
    });

    out.purchases = (Array.isArray(st.purchases) ? st.purchases : []).map(function (pu) {
      var o = {
        id: pu.id || uid(), date: validISO(pu.date) ? pu.date : today(), supplierId: pu.supplierId || '', note: String(pu.note || ''),
        items: (Array.isArray(pu.items) ? pu.items : []).map(function (it) { return { pid: it.pid, qty: num(it.qty), total: round2(it.total) }; })
      };
      if (pu.paidFrom === 'pessoal') o.paidFrom = 'pessoal';
      if (pu.payableId) o.payableId = String(pu.payableId);
      return o;
    });
    out.purchases.forEach(function (pu) { if (pu.payableId && !(Array.isArray(st.payables) && st.payables.some(function (b) { return b.id === pu.payableId; }))) delete pu.payableId; });

    // contas a pagar (fornecedores a prazo e outras despesas) e retiradas para a conta pessoal
    out.payables = (Array.isArray(st.payables) ? st.payables : []).filter(function (b) { return b && num(b.amount) > 0; }).map(function (b) {
      var o = { id: b.id || uid(), desc: String(b.desc || 'Conta a pagar').slice(0, 120), supplierId: b.supplierId || '', amount: round2(b.amount), due: validISO(b.due) ? b.due : today(), note: String(b.note || '') };
      if (b.purchaseId) o.purchaseId = String(b.purchaseId);
      o.pays = (Array.isArray(b.pays) ? b.pays : []).filter(function (x) { return x && validISO(x.date) && num(x.amount) > 0; }).map(function (x) {
        var y = { date: x.date, amount: round2(x.amount), from: x.from === 'pessoal' ? 'pessoal' : 'caixa' }; if (METHODS[x.method]) y.method = x.method; return y;
      });
      return o;
    });
    // despesas do negócio (combustível, itens extras...)
    out.expenses = (Array.isArray(st.expenses) ? st.expenses : []).filter(function (x) { return x && num(x.amount) > 0; }).map(function (x) {
      var o = { id: x.id || uid(), date: validISO(x.date) ? x.date : today(), amount: round2(x.amount), cat: EXPENSE_CATS.indexOf(x.cat) >= 0 ? x.cat : 'Outros', desc: String(x.desc || '').slice(0, 120), from: x.from === 'pessoal' ? 'pessoal' : 'caixa' };
      if (METHODS[x.method]) o.method = x.method; return o;
    });
    // dinheiro que o dono colocou no negócio
    out.contributions = (Array.isArray(st.contributions) ? st.contributions : []).filter(function (w) { return w && num(w.amount) > 0; }).map(function (w) {
      var o = { id: w.id || uid(), date: validISO(w.date) ? w.date : today(), amount: round2(w.amount), note: String(w.note || '').slice(0, 120) };
      if (METHODS[w.method]) o.method = w.method; return o;
    });
    out.withdrawals = (Array.isArray(st.withdrawals) ? st.withdrawals : []).filter(function (w) { return w && num(w.amount) > 0; }).map(function (w) {
      var o = { id: w.id || uid(), date: validISO(w.date) ? w.date : today(), amount: round2(w.amount), note: String(w.note || '').slice(0, 120) };
      if (METHODS[w.method]) o.method = w.method; return o;
    });

    out.adjustments = (Array.isArray(st.adjustments) ? st.adjustments : []).map(function (a) {
      return { id: a.id || uid(), pid: a.pid, delta: r6(a.delta), date: validISO(a.date) ? a.date : today(), note: String(a.note || '') };
    });

    // cotações feitas andando de comércio em comércio (não mexem no estoque)
    out.quotes = (Array.isArray(st.quotes) ? st.quotes : []).filter(function (q) {
      return q && typeof q.pid === 'string' && String(q.place || '').trim() && num(q.price) > 0 && num(q.qty) > 0;
    }).map(function (q) {
      return { id: q.id || uid(), pid: q.pid, place: String(q.place).trim().slice(0, 60), price: round2(q.price), qty: r3(q.qty), date: validISO(q.date) ? q.date : today() };
    });

    var defItems = {};
    out.products.forEach(function (p) { if (p.perBasket > 0) defItems[p.id] = p.perBasket; });

    out.sales = (Array.isArray(st.sales) ? st.sales : []).map(function (s) {
      var sale = Object.assign({}, s);
      sale.id = sale.id || uid();
      sale.date = validISO(sale.date) ? sale.date : today();
      sale.qty = num(sale.qty) > 0 ? num(sale.qty) : 1;
      sale.price = sale.price != null && isFinite(Number(sale.price)) ? num(sale.price) : out.settings.price;
      if (!sale.items || typeof sale.items !== 'object' || Array.isArray(sale.items) || !Object.keys(sale.items).length) sale.items = Object.assign({}, defItems);
      else { var it = {}; Object.keys(sale.items).forEach(function (k) { it[k] = Math.max(0, num(sale.items[k])); }); sale.items = it; }
      sale.mods = Array.isArray(sale.mods) ? sale.mods : [];
      sale.parcels = (Array.isArray(sale.parcels) ? sale.parcels : []).map(function (p) {
        var q = { id: p.id || uid(), due: validISO(p.due) ? p.due : sale.date, amount: round2(p.amount), paid: !!p.paid, received: round2(p.received) };
        if (p.kind === 'entrada' || p.kind === 'avista') q.kind = p.kind;
        if (Array.isArray(p.pays)) q.pays = p.pays.filter(function (x) { return x && validISO(x.date) && num(x.amount) > 0; }).map(function (x) { var y = { date: x.date, amount: round2(x.amount) }; if (METHODS[x.method]) y.method = x.method; return y; });
        return q;
      });
      if (!sale.customerId || !byId(out.customers, sale.customerId)) {
        var nm = String(sale.customerName || sale.customer || sale.cliente || sale.name || '').trim();
        var found = null;
        if (nm) {
          out.customers.forEach(function (c) { if (c.name.toLowerCase() === nm.toLowerCase()) found = c; });

  /* ---------- estoque e cobertura ---------- */

  /* ---------- custos ---------- */
  /* Histórico de preço de um produto: custo unitário da última compra de cada fornecedor (para cotação). */
  function priceHistory(state, pid) {

    });
    var rows = Object.keys(per).map(function (k) { return per[k]; });
    rows.sort(function (a, b) { return a.unit - b.unit; });

  /* Onde comprar: para cada produto cotado, escolhe o menor preço (cotação ou compra anterior) e agrupa por comércio.

  /* Nomes de comércio já usados (fornecedores + cotações), os mais recentes primeiro. */

  function unitCost(state, pid) {

    var best = lines[0];

    var qq = 0, tt = 0;
    lines.forEach(function (l) { if (l.idx === best.idx) { qq += l.qty; tt += l.total; } });

      var mem = groupMembers(state, key), tot = groupTotal(state, key);

  /* ---------- parcelas ---------- */
  function recebido(p) { return round2(p.paid ? p.amount : Math.min(num(p.amount), num(p.received))); }

  function customerBalance(state, customerId, hoje) {

    allParcels(state).forEach(function (r) {

    return { open: round2(open), late: round2(late), count: count };
  }

  function lateSummary(state, hoje) {

    });

  /* abate primeiro as parcelas abertas mais antigas */

  var METHODS = { pix: 'Pix', dinheiro: 'Dinheiro' };

  function splitPay(total, mode, pix) {

    if (recebido(p) > 0.004) out.push({ cls: 'warn', text: 'Parcial' });

  /* gera as parcelas de uma venda */
  function buildParcels(o) {

  function checkSale(state, qty, items, d) {

  function makeSale(state, input) {

  /* ---------- planejamento: quanto investir e quando o dinheiro volta ---------- */
  var PLAN_TERMS = { '30-60': [[1, 0.5], [2, 0.5]], avista: [[0, 1]], '30': [[1, 1]], fiado: [[2, 1]] };

    hoje = hoje || today();

  /* ---------- editar data de um recebimento ---------- */

    if (date > hoje) return { error: 'A data do recebimento não pode ser no futuro.' };
    var list = paysOf(sale, p, hoje);

    list[idx].date = date;
    p.pays = list.map(function (x) { var o = { date: x.date, amount: x.amount }; if (x.method) o.method = x.method; return o; });
    return { ok: true };
  }

  /* Muda a data prevista (vencimento) de uma parcela ainda não recebida por inteiro. */

  /* ---------- troca na cesta: o que tirar para manter o custo (e o lucro) da cesta padrão ---------- */

        var c = cands[i];

  function saleTotal(s) { return round2(num(s.qty) * num(s.price)); }

  /* ---------- painel ---------- */
  /* ---------- painel (dashboard) ---------- */
  function monthAdd(key, n) {

    return y + '-' + (m + 1 < 10 ? '0' : '') + (m + 1);
  }

  function periodRange(kind, hoje) {
    var cur = monthKey(hoje), r;
    if (kind === 'mes_ant') { var k1 = monthAdd(cur, -1), k2 = monthAdd(cur, -2); r = { from: k1 + '-01', to: monthEnd(k1), pfrom: k2 + '-01', pto: monthEnd(k2), label: fmonth(k1), plabel: fmonth(k2) }; }
    else if (kind === '3m') { var a = monthAdd(cur, -2), b = monthAdd(cur, -5), c = monthAdd(cur, -3); r = { from: a + '-01', to: monthEnd(cur), pfrom: b + '-01', pto: monthEnd(c), label: 'últimos 3 meses', plabel: '3 meses anteriores' }; }

    else { var p1 = monthAdd(cur, -1); r = { from: cur + '-01', to: monthEnd(cur), pfrom: p1 + '-01', pto: monthEnd(p1), label: 'este mês', plabel: 'mês passado' }; }

  }
  function salesMetrics(state, from, to) {
    var rev = 0, qty = 0, n = 0, cost = 0, missing = false, custs = {};

  }
  /* recebimentos e vencimentos de um período */

    allParcels(state).forEach(function (r) {

  function cash(state) {

    if (changed) h += line('Esta cesta', adv.cost);
    if (adv.delta > 0.004) {
      h += '<div class="msg warn" style="margin-top:8px"><b>Esta cesta custa ' + E.money(adv.delta) + ' a mais que a padrão.</b> Para manter o lucro, escolha uma troca ou cobre a diferença.</div>';
      if (adv.options.length) {
        h += '<div class="swaps">' + adv.options.map(function (o, i) {
          var txt = o.removals.map(function (r) { return esc(r.name) + ' <small>(' + (r.to > 0 ? 'de ' + fin(r.from) + ' para ' + fin(r.to) : 'tirar') + ' ' + (r.to > 0 ? '' : fin(r.from) + ' ') + r.unit + ')</small>'; }).join(', ');
          var res = Math.abs(o.diff) < 0.005 ? 'Fecha certinho: a cesta volta ao custo padrão.' : o.diff > 0 ? 'Fica ' + E.money(o.diff) + ' acima do custo padrão (lucro um pouco menor).' : 'Fica ' + E.money(-o.diff) + ' abaixo do custo padrão (lucro um pouco maior).';
          return '<div class="swap"><div class="info"><b>Tirar:</b> ' + txt + '<br><small>Sai ' + E.money(o.removed) + ' de custo. ' + res + '</small></div>' +
            '<button type="button" class="btn small" data-act="apply-swap" data-i="' + i + '">Aplicar</button></div>';
        }).join('') + '</div>';
      } else h += '<small>Não encontrei uma combinação de itens que feche essa diferença.</small>';
      if (has) h += '<div class="actions" style="margin-top:8px"><button type="button" class="btn small ghost" data-act="swap-price">Ou cobrar ' + E.money(price + adv.delta) + ' por cesta (+' + E.money(adv.delta) + ')</button></div>';
    } else if (adv.delta < -0.004) {
      h += '<div class="msg info" style="margin-top:8px">Esta cesta custa ' + E.money(-adv.delta) + ' a menos que a padrão, então o lucro por cesta é maior.</div>';
    }
    return h;
  }

  /* ---------- editar venda ---------- */
  function startSaleEdit(sale) {
    ui.saleEdit = { id: sale.id, date: sale.date, customerId: sale.customerId, qty: String(sale.qty), price: fin(sale.price), err: [],
      parcels: sale.parcels.slice().sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; }).map(function (p) { return { id: p.id, amount: fin(p.amount), due: p.due, got: E.recebido(p), kind: p.kind || '' }; }) };
  }
  function seTotal() { var d = ui.saleEdit, q = E.parseNum(d.qty), p = E.parseNum(d.price); return isNaN(q) || isNaN(p) ? NaN : E.round2(q * p); }
  function seSum() { return E.round2(ui.saleEdit.parcels.reduce(function (a, x) { var v = E.parseNum(x.amount); return a + (isNaN(v) ? 0 : v); }, 0)); }
  function seSummaryHTML() {
    var tot = seTotal(), sum = seSum();
    if (isNaN(tot)) return '<div class="msg info">Informe cestas e preço para conferir as parcelas.</div>';
    var diff = E.round2(tot - sum);
    return '<div class="se-sum"><div><span>Total da venda</span><b>' + E.money(tot) + '</b></div><div><span>Soma das parcelas</span><b>' + E.money(sum) + '</b></div></div>' +
      (Math.abs(diff) < 0.005 ? '<div class="msg ok">Parcelas conferem com o total.</div>' :
        '<div class="msg bad">' + (diff > 0 ? 'Faltam ' + E.money(diff) : 'Passou ' + E.money(-diff)) + ' nas parcelas. <button type="button" class="linkbtn under" data-act="se-fit">Ajustar a última parcela</button></div>');
  }
  function saleEditHTML() {
    var d = ui.saleEdit, custs = S.customers.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'pt-BR'); });
    var h = '<button type="button" class="back" data-act="se-cancel">‹ Cancelar edição</button>';
    h += '<form class="card" id="saleEditForm" novalidate><h2>Editar venda</h2><p class="sub"><small>Corrija os dados e as parcelas. O que já foi recebido continua registrado.</small></p>' +
      '<div class="field"><label for="se-cust">Cliente</label><select id="se-cust" data-bind="saleEdit.customerId">' + custs.map(function (c) { return '<option value="' + c.id + '"' + (d.customerId === c.id ? ' selected' : '') + '>' + esc(c.name) + '</option>'; }).join('') + '</select></div>' +
      '<div class="field"><label for="se-date">Data da venda</label><input id="se-date" type="date" data-bind="saleEdit.date" value="' + esc(d.date) + '"></div>' +
      '<div class="row"><div class="field"><label for="se-qty">Cestas</label><input id="se-qty" type="text" inputmode="numeric" data-bind="saleEdit.qty" value="' + esc(d.qty) + '"></div>' +
      '<div class="field"><label for="se-price">Preço da cesta (R$)</label><input id="se-price" type="text" inputmode="decimal" data-bind="saleEdit.price" value="' + esc(d.price) + '"></div></div>' +
      '<h3 style="margin:14px 0 6px">Parcelas</h3><div class="seg-actions"><button type="button" class="btn small ghost" data-act="se-replan" data-t="30-60">2 parcelas (30 e 60 dias)</button><button type="button" class="btn small ghost" data-act="se-replan" data-t="30">1 parcela (30 dias)</button></div>' +
      '<div id="seRows">' + seRowsHTML() + '</div><div class="actions" style="margin-top:6px"><button type="button" class="btn small ghost" data-act="se-add">+ Adicionar parcela</button></div>' +
      '<div id="seSum" style="margin-top:10px">' + seSummaryHTML() + '</div>' +

  function seRowsHTML() {
    return ui.saleEdit.parcels.map(function (x, i) {
      return '<div class="se-row"><div class="field"><label for="se-a' + i + '">Parcela ' + (i + 1) + (x.kind === 'entrada' ? ' · entrada' : x.kind === 'avista' ? ' · à vista' : '') + '</label>' +
        '<input id="se-a' + i + '" type="text" inputmode="decimal" aria-label="Valor da parcela ' + (i + 1) + '" data-sei="' + i + '" data-sepf="amount" value="' + esc(x.amount) + '"></div>' +
        '<div class="field"><label for="se-d' + i + '">Vencimento</label><input id="se-d' + i + '" type="date" data-sei="' + i + '" data-sepf="due" value="' + esc(x.due) + '"></div>' +
        (x.got > 0.004 ? '<small class="se-note">Já recebeu ' + E.money(x.got) + ' — não dá para baixar abaixo disso.</small>' : '<button type="button" class="btn small ghost se-del" data-act="se-del" data-i="' + i + '" aria-label="Remover parcela ' + (i + 1) + '">Remover</button>') + '</div>';

  function submitSaleEdit() {
    var d = ui.saleEdit, parcels = [], err = [];
    d.parcels.forEach(function (x, i) {
      var v = E.parseNum(x.amount); if (isNaN(v)) err.push('Parcela ' + (i + 1) + ': valor inválido.');

  function saleDetailHTML(s) {
    if (ui.saleEdit && ui.saleEdit.id === s.id) return saleEditHTML();
    var hoje = E.today(), lab = E.parcelLabels(s);
    var parcels = s.parcels.slice().sort(function (a, b) { return a.due < b.due ? -1 : a.due > b.due ? 1 : 0; });

      '<small>' + E.fdate(s.date) + ' · ' + fin(s.qty) + ' ' + plural(s.qty, 'cesta', 'cestas') + ' × ' + E.money(s.price) + (s.mods && s.mods.length ? ' · cesta personalizada' : '') + '</small>' +
      (s.mods && s.mods.length ? '<small style="display:block;margin-top:4px">' + s.mods.map(function (m) { var pd = prod(m.pid); return esc(pd ? pd.name : 'Item') + ': ' + fin(m.de) + ' → ' + fin(m.para); }).join(' · ') + '</small>' : '') +
      '<div class="kpis four" style="margin-top:12px"><div class="kpi"><b>' + E.money(tot) + '</b><span>Total</span></div><div class="kpi"><b>' + E.money(rec) + '</b><span>Recebido</span></div>' +
      '<div class="kpi"><b>' + E.money(abr) + '</b><span>A receber</span></div><div class="kpi"><b style="color:' + (pr < 0 ? 'var(--bad)' : 'var(--ok)') + '">' + E.money(pr) + '</b><span>Lucro bruto</span></div></div>' +
      '<div class="actions"><button class="btn" data-act="rcpt-sale" data-id="' + s.id + '">Comprovante da venda</button><button class="btn ghost" data-act="edit-sale" data-id="' + s.id + '">Editar venda</button></div></section>';

        '<div class="btns">' + (open ? '<button class="btn small" data-act="recv-parcel" data-sale="' + s.id + '" data-parcel="' + p.id + '">Receber</button>' : '') +
        (r > 0.004 ? '<button class="btn small ghost" data-act="undo-parcel" data-sale="' + s.id + '" data-parcel="' + p.id + '">Desfazer</button>' : '') + '</div>' +
        dueEditHTML(s, p, open) + payLinesHTML(s, p) + '</div>';
    }).join('') + '</div></section>';
    h += '<div class="actions dangerzone"><button class="btn small danger" data-act="del" data-kind="sale" data-id="' + s.id + '" data-label="Excluir venda">Excluir venda</button></div>';

  function saleRowHTML(s, hoje) {
    return '<button type="button" class="crow" data-act="open-sale" data-id="' + s.id + '"><span class="cn"><b>' + esc(custName(s.customerId)) + '</b><small>' + E.fdate(s.date) + ' · ' + fin(s.qty) + ' ' + plural(s.qty, 'cesta', 'cestas') + '</small></span>' +
      '<span class="cv"><b>' + E.money(E.saleTotal(s)) + '</b>' + saleStatusBadge(s, hoje) + '</span><i aria-hidden="true">›</i></button>';
  }

  function vendasFeitasHTML() {
    if (ui.saleOpen && E.byId(S.sales, ui.saleOpen)) return saleDetailHTML(E.byId(S.sales, ui.saleOpen));
    ui.saleOpen = null;
    var f = vfDraft(), hoje = E.today(), rg = E.periodRange(f.p, hoje);
    var sales = S.sales.filter(function (s) {
      if (s.date < rg.from || s.date > rg.to) return false;
      if (f.cust && s.customerId !== f.cust) return false;
      var open = s.parcels.some(function (p) { return E.isOpen(p); });
      if (f.st === 'abertas' && !open) return false;
      if (f.st === 'quitadas' && open) return false;
      return true;
    }).sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    var tot = 0, prof = 0, rec = 0, abr = 0, cestas = 0;
    sales.forEach(function (s) {
      tot += E.saleTotal(s); prof += E.saleProfit(s); cestas += E.num(s.qty);
      s.parcels.forEach(function (p) { rec += E.recebido(p); abr += E.aberto(p); });
    });
    var custs = S.customers.slice().sort(function (a, b) { return a.name.localeCompare(b.name, 'pt-BR'); });
    var sel = function (id, label, bind, cur, opts) {
      return '<div class="field"><label for="' + id + '">' + label + '</label><select id="' + id + '" data-bind="' + bind + '">' + opts.map(function (o) { return '<option value="' + o[0] + '"' + (cur === o[0] ? ' selected' : '') + '>' + esc(o[1]) + '</option>'; }).join('') + '</select></div>';
    };
    var STS = [['todas', 'Todas'], ['abertas', 'Com valor a receber'], ['quitadas', 'Totalmente recebidas']];
    var plab = (PERIODS.filter(function (x) { return x[0] === f.p; })[0] || [0, ''])[1], slab = (STS.filter(function (x) { return x[0] === f.st; })[0] || [0, ''])[1];
    var clab = f.cust ? custName(f.cust) : 'Todos os clientes';
    var h = '<section class="card"><div class="kpis three"><div class="kpi"><b>' + E.money(tot) + '</b><span>Vendido · ' + sales.length + '</span></div>' +
      '<div class="kpi"><b>' + E.money(abr) + '</b><span>A receber</span></div>' +
      '<div class="kpi"><b style="color:' + (prof < 0 ? 'var(--bad)' : 'var(--ok)') + '">' + E.money(prof) + '</b><span>Lucro bruto</span></div></div>' +
      '<details class="filters" data-keep="vfOpen"' + (ui.vfOpen ? ' open' : '') + '><summary><span>Filtros</span><small>' + esc(plab + ' · ' + slab + ' · ' + clab) + '</small></summary>' +
      '<div class="row">' + sel('vf-p', 'Período', 'vf.p', f.p, PERIODS) + sel('vf-st', 'Situação', 'vf.st', f.st, STS) + '</div>' +
      sel('vf-c', 'Cliente', 'vf.cust', f.cust, [['', 'Todos os clientes']].concat(custs.map(function (c) { return [c.id, c.name]; }))) + '</details>' +
      (sales.length ? '<small>' + fin(cestas) + ' ' + plural(cestas, 'cesta', 'cestas') + ' · ' + E.money(rec) + ' já recebido.</small>' : '') + '</section>';
    h += '<section class="card" style="margin-top:12px">';
    if (!sales.length) h += '<div class="empty">' + (S.sales.length ? 'Nenhuma venda com esses filtros.' : 'Nenhuma venda registrada ainda.') + '</div>';
    else h += '<div class="crows">' + sales.map(function (s) { return saleRowHTML(s, hoje); }).join('') + '</div>';
